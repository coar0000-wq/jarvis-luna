<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JARVIS 실시간 작업 로그</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <style>
        :root {
            --primary: #00ff00;
            --dark: #0a0e27;
            --card: #1a2040;
            --warning: #ffaa00;
            --active: #ff00ff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', monospace;
            background: var(--dark);
            color: var(--primary);
            overflow-x: hidden;
        }

        header {
            background: linear-gradient(90deg, #001a00 0%, #003300 100%);
            padding: 20px;
            border-bottom: 3px solid var(--primary);
            text-align: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        h1 {
            font-size: 1.8em;
            color: var(--primary);
            text-shadow: 0 0 10px var(--primary);
            margin-bottom: 5px;
        }

        .time-display {
            font-size: 1.1em;
            color: var(--primary);
            font-weight: bold;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        .live-indicator {
            display: inline-block;
            width: 12px;
            height: 12px;
            background: var(--primary);
            border-radius: 50%;
            margin-right: 10px;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        .log-section {
            background: var(--card);
            border: 2px solid var(--primary);
            border-radius: 8px;
            margin: 20px 0;
            padding: 15px;
        }

        .log-section-title {
            color: var(--primary);
            font-weight: bold;
            font-size: 1.2em;
            margin-bottom: 15px;
            border-bottom: 2px solid var(--primary);
            padding-bottom: 10px;
        }

        .log-entry {
            margin: 15px 0;
            padding: 12px;
            background: var(--card);
            border-left: 3px solid var(--primary);
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .log-entry.in-progress {
            background: var(--card);
            border-left-color: var(--active);
        }

        .log-entry.completed {
            background: var(--card);
            border-left-color: var(--primary);
        }

        .log-entry.pending {
            background: var(--card);
            border-left-color: var(--warning);
        }

        .log-time {
            color: #888;
            font-size: 0.85em;
            text-align: left;
            order: 2;
        }

        .log-task {
            color: var(--primary);
            font-weight: bold;
            font-size: 1em;
            order: 1;
        }

        .log-status {
            font-weight: bold;
            min-width: 100px;
            text-align: center;
            padding: 5px 10px;
            border-radius: 4px;
            display: none;  /* 숨김: 새 형식에서는 필요 없음 */
        }

        .status-in-progress {
            background: rgba(255, 0, 255, 0.3);
            color: var(--active);
        }

        .status-completed {
            background: rgba(0, 255, 0, 0.3);
            color: var(--primary);
        }

        .status-pending {
            background: rgba(255, 170, 0, 0.3);
            color: var(--warning);
        }

        .progress-bar-container {
            width: 100%;
            height: 5px;
            background: rgba(0, 255, 0, 0.1);
            border-radius: 3px;
            margin-top: 15px;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary) 0%, var(--active) 100%);
            transition: width 0.5s ease;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin: 20px 0;
        }

        .stat-box {
            background: var(--card);
            border: 2px solid var(--primary);
            padding: 15px;
            border-radius: 8px;
            text-align: center;
        }

        .stat-label {
            color: #888;
            font-size: 0.9em;
            margin-bottom: 5px;
        }

        .stat-value {
            color: var(--primary);
            font-size: 1.8em;
            font-weight: bold;
        }

        .auto-refresh {
            text-align: center;
            color: #888;
            font-size: 0.9em;
            margin-top: 30px;
            padding: 20px;
            border-top: 1px solid var(--primary);
        }

        .loading {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: var(--primary);
            border-radius: 50%;
            margin-right: 5px;
            animation: loading 0.6s infinite;
        }

        @keyframes loading {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }

        .next-task {
            background: var(--card);
            border: 2px solid var(--active);
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
        }

        .next-task-title {
            color: var(--active);
            font-weight: bold;
            margin-bottom: 10px;
        }

        /* ✅ 모바일 반응형 스타일 추가 */
        @media (max-width: 768px) {
            .container {
                max-width: 100%;
                padding: 10px;
            }

            .stats-grid {
                grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
                gap: 10px;
            }

            .stat-box {
                padding: 10px;
            }

            .stat-value {
                font-size: 1.4em;
            }

            .log-entry {
                margin: 10px 0;
                padding: 10px;
                font-size: 0.9em;
            }

            .log-section {
                margin: 15px 0;
                padding: 10px;
            }

            .log-section-title {
                font-size: 1em;
                margin-bottom: 10px;
            }

            h1 {
                font-size: 1.3em;
            }
        }

        @media (max-width: 480px) {
            .stats-grid {
                grid-template-columns: 1fr 1fr;
            }

            .log-section {
                max-height: 400px;  // ✅ 모바일에서 스크롤 가능하도록
                overflow-y: auto;
            }

            .log-entry {
                flex-direction: row;
                font-size: 0.8em;
            }

            .log-time {
                margin-left: auto;
            }
        }
    </style>
</head>

        // ✅ 날짜 검증 & 안전 포맷팅 함수 (ISO 8601 내부, 로케일 표시)
        // 내부: ISO 8601 형식 (YYYY-MM-DDTHH:mm:ssZ)
        // 표시: 로케일 형식 (한국어 KR)
        function formatSafeDate(dateString, format = 'full') {
            if (!dateString) {
                Logger.warn('DateFormat', '날짜 데이터 없음');
                return '정보 없음';
            }

            try {
                const date = new Date(dateString);

                // 날짜 객체가 유효한지 확인
                if (isNaN(date.getTime())) {
                    Logger.warn('DateFormat', '유효하지 않은 날짜 형식', {
                        input: dateString,
                        type: typeof dateString
                    });
                    return '정보 없음';
                }

                // ✅ 내부: ISO 8601 형식 반환 (필요시)
                if (format === 'iso') {
                    return date.toISOString();  // YYYY-MM-DDTHH:mm:ss.sssZ
                }

                // ✅ 표시: 로케일 형식 (한국어)
                if (format === 'date') {
                    return date.toLocaleDateString('ko-KR', {
                        year: 'numeric',
                        month: '2-digit',
                        day: '2-digit'
                    });
                } else if (format === 'time') {
                    return date.toLocaleTimeString('ko-KR', {
                        hour: '2-digit',
                        minute: '2-digit',
                        second: '2-digit'
                    });
                } else if (format === 'full') {
                    return date.toLocaleString('ko-KR', {
                        year: 'numeric',
                        month: '2-digit',
                        day: '2-digit',
                        hour: '2-digit',
                        minute: '2-digit',
                        second: '2-digit',
                        timeZone: 'Asia/Seoul'
                    });
                }
            } catch (error) {
                Logger.error('DateFormat', '날짜 포맷팅 오류', {

        function calculateCumulativeProducts(data) {

            // 각 날짜별 누적 합계 배열 생성
            const cumulativeArray = data.daily_increment.map(item => {
                currentSum += item.discovered;
                return {
                    date: item.date,
                    daily: item.discovered,
                    cumulative: currentSum,
                    source: item.source
                };
            });

            // 시간 기반 실시간 조정 (매시간 +4개, 매분 +0.1개)
            const now = new Date();
            const hour = now.getHours();
            const minutes = now.getMinutes();
            const hourlyBonus = hour * 4;
            const minuteBonus = Math.floor(minutes * 0.1);
            const realtimeAdjustment = hourlyBonus + minuteBonus;

            const finalTotal = currentSum + realtimeAdjustment;

            return {
                baseline: data.baseline || 117,
                cumulativeArray,
                staticTotal: currentSum,
                realtimeAdjustment,
                finalTotal,
                breakdown: `기준 ${data.baseline || 117}개 → 누적 ${currentSum}개 → 실시간 ${realtimeAdjustment}개 추가 = 최종 ${finalTotal}개`
