<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JARVIS LUNA - AGI Evolution OS</title>
    <style>
        body {
            background-color: #0d1117;
            color: #c9d1d9;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        .header-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-bottom: 25px;
        }
        .status-card {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 15px;
            text-align: center;
        }
        .dot {
            height: 10px;
            width: 10px;
            background-color: #238636;
            border-radius: 50%;
            display: inline-block;
            margin-right: 5px;
        }
        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-bottom: 25px;
        }
        .metric-box {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 20px;
            text-align: center;
        }
        .metric-value {
            font-size: 24px;
            font-weight: bold;
            color: #58a6ff;
            margin-top: 5px;
        }
        .section {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }
        h2 { font-size: 18px; margin-top: 0; color: #f0f6fc; }
        .log-item {
            padding: 10px 0;
            border-bottom: 1px solid #30363d;
            font-size: 14px;
        }
        .log-item:last-child { border-bottom: none; }
    </style>
</head>
<body>

<div class="container">
    <!-- 상단 상태 박스 -->
    <div class="header-grid">
        <div class="status-card">
            <div>도현 (CEO)</div>
            <div style="color: #238636; margin-top: 5px;"><span class="dot"></span>감시중</div>
        </div>
        <div class="status-card">
            <div>GitHub Actions</div>
            <div style="color: #238636; margin-top: 5px;"><span class="dot"></span>활성</div>
        </div>
        <div class="status-card">
            <div>JARVIS (AI)</div>
            <div style="color: #238636; margin-top: 5px;"><span class="dot"></span>자동화</div>
        </div>
        <div class="status-card">
            <div>Obsidian</div>
            <div id="obsidian-status-text" style="color: #238636; margin-top: 5px;">
                <span id="obsidian-dot" class="dot"></span>온라인
            </div>
        </div>
    </div>

    <!-- 메인 지표 영역 -->
    <div class="section">
        <h3>💰 Shopify + 다이소 Dropshipping</h3>
        <div class="metrics-grid">
            <div class="metric-box">
                <div>총 상품 수</div>
                <div class="metric-value" id="val-total">117개</div>
            </div>
            <div class="metric-box">
                <div>월 수익</div>
                <div class="metric-value" id="val-revenue">$3,900</div>
            </div>
            <div class="metric-box">
                <div>평균 마진</div>
                <div class="metric-value">650%</div>
            </div>
            <div class="metric-box">
                <div>자동화율</div>
                <div class="metric-value">95%</div>
            </div>
        </div>
    </div>

    <!-- 작업 상세 로그 영역 (자비스 작업 내역 실시간 출력) -->
    <div class="section">
        <h2>📋 작업 상세 로그 (최신 5개)</h2>
        <div id="log-container">
            <div class="log-item">로그를 불러오는 중...</div>
        </div>
    </div>

    <!-- Phase 26 진행도 -->
    <div class="section">
        <h2>📈 Phase 26 진행도: 100%</h2>
        <p style="color: #238636; font-weight: bold;">✅ 완료 (100%)</p>
        <p>📌 Phase 26 MoE Implementation Complete</p>
    </div>
    
    <div style="text-align: center; font-size: 12px; color: #8b949e; margin-top: 20px;" id="timestamp-view">
        ⏰ 마지막 업데이트: 확인 중...
    </div>
</div>

<script>
    async function updateDashboard() {
        try {
            // 1. 메인 지표 및 Obsidian 상태 동기화
            const resData = await fetch('cumulative_products.json?' + new Date().getTime());
            if (resData.ok) {
                const data = await resData.json();
                document.getElementById('val-total').innerText = data.cumulative_total + "개";
                document.getElementById('val-revenue').innerText = "$" + data.monthly_revenue.toLocaleString();
                document.getElementById('timestamp-view').innerText = "⏰ 마지막 업데이트: " + data.timestamp;

                // Obsidian 상태 동기화 (온라인/오프라인 불빛 분기)
                const dot = document.getElementById('obsidian-dot');
                const obsText = document.getElementById('obsidian-status-text');
                if (data.obsidian_status === "online") {
                    dot.style.backgroundColor = "#238636"; // 녹색불
                    obsText.innerHTML = '<span id="obsidian-dot" class="dot" style="background-color: #238636;"></span>온라인';
                } else {
                    dot.style.backgroundColor = "#da3633"; // 붉은색불
                    obsText.innerHTML = '<span id="obsidian-dot" class="dot" style="background-color: #da3633;"></span>오프라인';
                }
            }

            // 2. 작업 상세 로그 동기화
            const resLogs = await fetch('scheduler_log.json?' + new Date().getTime());
            if (resLogs.ok) {
                const logs = await resLogs.json();
                const container = document.getElementById('log-container');
                if (Array.isArray(logs) && logs.length > 0) {
                    container.innerHTML = logs.map(item => `
                        <div class="log-item">
                            <span style="color: #238636; font-weight: bold;">[${item.status}]</span> 
                            <span>${item.task}</span>
                            <span style="float: right; color: #8b949e; font-size: 12px;">${item.time}</span>
                        </div>
                    `).join('');
                } else {
                    container.innerHTML = '<div class="log-item">작업 로그가 없습니다.</div>';
                }
            }
        } catch (e) {
            console.error("대시보드 데이터 동기화 실패:", e);
        }
    }

    // 페이지 로드 시 즉시 실행 및 30초마다 자동 갱신
    updateDashboard();
    setInterval(updateDashboard, 30000);
</script>

</body>
</html>
