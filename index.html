<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JARVIS LUNA - Adaptive Intelligence</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;scroll-behavior:smooth;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Oxygen,Ubuntu,Cantarell,sans-serif;background:#0f0f0f;color:#e0e0e0;overflow-x:hidden;}
body::before{content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;
background:
radial-gradient(60rem 40rem at 12% 8%, rgba(88,166,255,0.10), transparent 60%),
radial-gradient(50rem 36rem at 88% 22%, rgba(163,113,247,0.09), transparent 62%),
radial-gradient(46rem 34rem at 70% 88%, rgba(63,185,80,0.07), transparent 60%),
radial-gradient(40rem 30rem at 24% 72%, rgba(210,153,34,0.06), transparent 60%);}

/* Liquid Glass */
.today-intelligence,.stat-card,.dashboard-card,.side-stat{position:relative;isolation:isolate;
background:linear-gradient(150deg,rgba(255,255,255,0.075) 0%,rgba(255,255,255,0.035) 42%,rgba(255,255,255,0.055) 100%);
backdrop-filter:blur(22px) saturate(180%) brightness(112%);
-webkit-backdrop-filter:blur(22px) saturate(180%) brightness(112%);
border:1px solid rgba(255,255,255,0.10);
box-shadow:
0 10px 32px rgba(0,0,0,0.45),
inset 0 1px 0 rgba(255,255,255,0.22),
inset 0 -1px 0 rgba(255,255,255,0.05),
inset 0 0 24px rgba(255,255,255,0.035);}
.today-intelligence::before,.stat-card::before,.dashboard-card::before,.side-stat::before{
content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:0;
background:linear-gradient(180deg,rgba(255,255,255,0.16) 0%,rgba(255,255,255,0.04) 18%,transparent 42%);}
.today-intelligence > *,.stat-card > *,.dashboard-card > *,.side-stat > *{position:relative;z-index:1;}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
.today-intelligence,.stat-card,.dashboard-card,.side-stat{background:#1a1a1a;border-color:#2a2a2a;}
}

img,canvas{max-width:100%;}
.dashboard-card,.stat-card,.side-stat,.log-list li{overflow-wrap:anywhere;word-break:break-word;min-width:0;}

/* Header */
header{background:#000;padding:0 40px;height:64px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:24px;border-bottom:1px solid #1a1a1a;}
.logo{font-size:22px;font-weight:300;letter-spacing:4px;color:#fff;line-height:1;white-space:nowrap;flex-shrink:0;}
nav{display:flex;gap:32px;align-items:center;height:100%;justify-self:center;}
nav a{text-decoration:none;color:#999;font-size:14px;line-height:1;transition:color 0.3s;cursor:pointer;display:flex;align-items:center;height:100%;border-bottom:2px solid transparent;}
nav a.active{color:#fff;border-bottom-color:#58a6ff;}
nav a:hover{color:#fff;}
.live-indicator{display:flex;align-items:center;gap:9px;font-size:22px;font-weight:300;letter-spacing:4px;
line-height:1;color:#3fb950;flex-shrink:0;justify-self:end;white-space:nowrap;}
.live-dot{width:11px;height:11px;background:#3fb950;border-radius:50%;flex-shrink:0;
box-shadow:0 0 10px rgba(63,185,80,0.65);animation:pulse 2s infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.5;}}

.container{max-width:1400px;margin:0 auto;padding:40px;}

/* Hero */
.hero{background:url('hero-bg.jpg') center/cover no-repeat,linear-gradient(135deg,#5a4a3a 0%,#8b6f47 25%,#a0845c 50%,#6b5844 75%,#4a3a2a 100%);
background-size:cover;background-position:center center;border-radius:12px;overflow:hidden;padding:60px 50px;margin-bottom:40px;
display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:end;position:relative;min-height:662px;
box-shadow:inset 0 0 60px rgba(0,0,0,0.5),0 8px 32px rgba(0,0,0,0.3);}
.hero::before{content:'';position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,0.32) 0%,rgba(0,0,0,0.42) 45%,rgba(0,0,0,0.62) 100%);border-radius:inherit;z-index:1;}
.hero-text{position:relative;z-index:2;text-shadow:2px 2px 4px rgba(0,0,0,0.5);grid-column:2;}
.hero-logo{font-size:16px;letter-spacing:3px;color:#fff;margin-bottom:20px;text-shadow:2px 2px 8px rgba(0,0,0,0.8);font-weight:300;}
.hero-text h1{font-size:52px;font-weight:700;color:#fff;line-height:1.3;margin-bottom:25px;text-transform:uppercase;text-shadow:3px 3px 10px rgba(0,0,0,0.9);letter-spacing:1px;}
.hero-text p{font-size:16px;color:#e8e8e8;line-height:1.7;margin-bottom:35px;text-shadow:2px 2px 6px rgba(0,0,0,0.7);}
.hero-buttons{display:flex;gap:15px;justify-content:flex-end;}
.btn{padding:14px 32px;border-radius:6px;font-size:15px;font-weight:500;border:2px solid transparent;cursor:pointer;transition:all 0.3s;text-shadow:1px 1px 3px rgba(0,0,0,0.3);}
.btn-primary{background:#f5f5f5;color:#2a2a2a;border-color:#f5f5f5;}
.btn-primary:hover{background:transparent;color:#f5f5f5;border-color:#f5f5f5;}
.btn-secondary{background:transparent;color:#f5f5f5;border-color:#f5f5f5;}
.btn-secondary:hover{background:#f5f5f5;color:#2a2a2a;border-color:#f5f5f5;}

/* Section Title */
.section-header{font-size:15px;font-weight:600;letter-spacing:1.5px;color:#999;text-transform:uppercase;margin:35px 0 18px;display:flex;align-items:center;gap:10px;}
.section-header .sh-img{width:40px;height:40px;object-fit:contain;display:block;flex:0 0 40px;}
.section-header::after{content:'';flex:1;height:1px;background:#2a2a2a;}

/* Team Cards */
.team-section{background:#141414;border:1px solid #2a2a2a;border-radius:12px;padding:24px 26px;margin-bottom:40px;}.team-focus{background:linear-gradient(150deg,rgba(255,255,255,.09) 0%,rgba(255,255,255,.035) 45%,rgba(88,166,255,.055) 100%);border-color:rgba(88,166,255,.22);box-shadow:0 14px 42px rgba(0,0,0,.42),inset 0 1px 0 rgba(255,255,255,.16),inset 0 0 30px rgba(88,166,255,.035);}.team-focus h3{font-size:15px;color:#f0f0f0;}.team-focus .team-sub{color:#8b949e;font-size:12px;margin-bottom:14px;}.team-focus .team-meta{background:rgba(255,255,255,.018);border-top-color:#30343a;border-bottom:1px solid #232323;border-radius:8px;padding:11px 12px;margin-bottom:8px;}.team-focus .team-row{padding:16px 10px;}.team-focus .team-name{font-size:14.5px;}.team-focus .team-summary{font-size:12.5px;color:#b0b7c0;}.team-focus .team-action{font-weight:600;}
.team-section h3{font-size:13px;letter-spacing:2px;color:#8b949e;text-transform:uppercase;margin-bottom:4px;display:flex;justify-content:space-between;align-items:baseline;gap:12px;}
.team-section .team-h3{display:inline-flex;align-items:center;gap:8px;}
.team-section .team-h3-img{width:40px;height:40px;object-fit:contain;display:block;flex:0 0 40px;}
.team-section .team-sub{font-size:12px;color:#666;margin-bottom:10px;}
.team-meta{display:flex;gap:18px;flex-wrap:wrap;font-size:12px;color:#8b949e;padding:10px 0 4px;border-top:1px solid #232323;margin-bottom:6px;}
.team-meta span{white-space:nowrap;}
.team-h3-when{font-size:11px;font-weight:400;letter-spacing:0;text-transform:none;color:#6e7681;margin-left:4px;}
.team-list{list-style:none;}
.team-row{display:flex;align-items:flex-start;gap:14px;padding:14px 0;border-bottom:1px solid #232323;}
.team-row:last-child{border-bottom:none;}

/* ✅ 비서실장 배경 통일 수정 - 모든 팀 아이콘 동일 배경 */
.team-icon{flex:0 0 40px;width:40px;height:40px;display:flex;align-items:center;justify-content:center;background:#2d2d2d!important;border-radius:8px!important;border:1px solid #3a3a3a!important;overflow:hidden;}
.team-icon img{width:100%;height:100%;object-fit:contain;display:block;background:transparent!important;box-shadow:none!important;}
.team-icon-fb{width:100%;height:100%;border-radius:8px!important;display:flex;align-items:center;justify-content:center;background:#2d2d2d!important;}
.team-icon svg{width:20px;height:20px;fill:none;stroke:#fff;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;}
.team-body{flex:1;min-width:0;}
.team-name{font-size:14px;color:#f0f0f0;font-weight:500;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.team-when{font-size:12px;color:#6e7681;white-space:nowrap;margin-left:auto;padding-left:12px;}
.team-summary{font-size:12.5px;color:#8b949e;margin-top:3px;line-height:1.5;}
.team-action{display:inline-block;margin-top:6px;font-size:11.5px;color:#e3b341;background:rgba(210,153,34,0.12);border:1px solid rgba(210,153,34,0.35);border-radius:5px;padding:3px 9px;}
.team-badge{font-size:10px;letter-spacing:0.5px;border-radius:4px;padding:1px 6px;border:1px solid;}
.team-badge.miss{color:#f85149;border-color:rgba(248,81,73,0.4);background:rgba(248,81,73,0.1);}
.team-badge.fail{color:#f85149;border-color:rgba(248,81,73,0.4);background:rgba(248,81,73,0.1);}
.secretary-row{border-bottom-color:#232323;}
.secretary-row .team-name{color:#ffffff;font-weight:600;}
.secretary-row .team-icon{background:#2d2d2d!important;border:1px solid #3a3a3a!important;border-radius:8px!important;}
.secretary-badge{color:#58a6ff;border-color:rgba(88,166,255,0.42);background:rgba(88,166,255,0.10);}
.secretary-row .team-summary{color:#8b949e;}
@media(max-width:600px){
.team-when{margin-left:0;padding-left:0;width:100%;}
.team-name{gap:4px;}
}

/* Today's Intelligence */
.today-intelligence{border-radius:14px;padding:30px;margin-bottom:40px;}
.today-intelligence h3{font-size:12px;font-weight:600;letter-spacing:1px;text-transform:uppercase;margin-bottom:20px;color:#999;display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;}
#updated-at{text-transform:none;letter-spacing:0;color:#666;font-weight:400;}
.intelligence-items{display:flex;gap:40px;flex-wrap:wrap;}
.intelligence-item{display:flex;gap:12px;align-items:flex-start;}
.intelligence-item span{font-size:14px;color:#e0e0e0;}

/* Stats */
.stats-section{display:grid;grid-template-columns:2fr 1fr;gap:30px;margin-bottom:40px;}
.stats-merged{grid-template-columns:1fr;}
.stats-merged .dz-grid{grid-template-columns:repeat(auto-fit,minmax(200px,1fr));margin-bottom:20px;}
.sd-sell{font-size:14px;font-weight:700;color:#58a6ff;white-space:nowrap;text-align:right;}
.sd-sell small{display:block;font-size:11px;font-weight:400;color:#8b949e;margin-top:2px;}
.stats-grid{display:grid;grid-template-columns:1fr;gap:20px;}
.stat-card{border-radius:14px;padding:25px;}
.stat-card h4{color:#999;font-size:12px;margin-bottom:8px;text-transform:uppercase;}
.stat-card .value{font-size:32px;font-weight:700;color:#fff;}
.stat-detail{margin-top:12px;padding-top:12px;border-top:1px solid #2a2a2a;font-size:12px;line-height:1.9;color:#888;}
.stat-detail .row{display:flex;justify-content:space-between;gap:12px;}
.stat-detail .row span:last-child{color:#e0e0e0;white-space:nowrap;}
.stat-detail .cap{color:#666;font-size:11px;margin-top:6px;display:block;}

/* Daiso */
#daiso.dashboard-card{padding:25px;}
#daiso h4{color:#58a6ff;font-size:14px;font-weight:600;text-transform:none;letter-spacing:0;margin-bottom:18px;}
.dz-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.dz-tile{background:#0f0f0f;border:1px solid #2a2a2a;border-radius:10px;padding:16px 14px;text-align:center;}
.dz-tile .k{font-size:12px;color:#999;margin-bottom:8px;}
.dz-tile .v{font-size:24px;font-weight:700;line-height:1.15;}
.dz-tile .u{font-size:11px;font-weight:400;color:#666;margin-top:5px;}
.dz-green .v{color:#3fb950;}
.dz-blue .v{color:#58a6ff;}
.dz-amber .v{color:#d29922;}
.dz-slate .v{color:#e0e0e0;}
.dz-rule{height:1px;background:#2a2a2a;margin:18px 0 14px;}
.dz-check{list-style:none;display:flex;flex-direction:column;gap:9px;}
.dz-check li{display:flex;align-items:flex-start;gap:9px;font-size:13px;color:#e0e0e0;}
.dz-check .mark{flex-shrink:0;width:15px;height:15px;border-radius:3px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;background:#238636;color:#fff;}
.dz-check li.pending{color:#777;}
.dz-check li.pending .mark{background:#2a2a2a;color:#666;}
.dz-note{margin-top:14px;font-size:11px;line-height:1.75;color:#666;}

/* Dashboard Grid */
.dashboard-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px;margin-bottom:40px;}
.dashboard-card{border-radius:14px;padding:20px;}
.dashboard-card h4{color:#999;font-size:12px;margin-bottom:15px;text-transform:uppercase;display:flex;align-items:center;gap:8px;}
.dashboard-card-icon{width:16px;height:16px;background:#2a2a2a;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:10px;}

/* ===== Product Discovery Card ===== */
.pd-card{padding:20px 22px !important;}
.pd-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;}
.pd-title{display:flex;align-items:center;gap:10px;font-size:16px;font-weight:600;color:#e0e0e0;}
.pd-title svg{width:18px;height:18px;color:#58a6ff;flex-shrink:0;}
.pd-menu{color:#666;font-size:20px;cursor:pointer;line-height:1;padding:4px;}
.pd-list{list-style:none;margin:0;padding:0;}
.pd-item{display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid #2a2a2a;}
.pd-item:last-child{border-bottom:none;padding-bottom:2px;}
.pd-thumb{width:48px;height:48px;border-radius:10px;background:#1a1a1a;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;border:1px solid #2a2a2a;}
.pd-info{flex:1;min-width:0;}
.pd-name{font-size:15px;font-weight:600;color:#e0e0e0;margin-bottom:3px;}
.pd-desc{font-size:13px;color:#888;}
.pd-change{font-size:14px;font-weight:600;color:#3fb950;white-space:nowrap;}

/* Shopify Demand Score Card */
.sd-card{padding:20px 22px!important;}
.sd-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.sd-title{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600;color:#e0e0e0;}
.sd-title .icon{font-size:18px;}
.sd-title .icon-img{width:40px;height:40px;border-radius:10px;display:block;flex:0 0 40px;}
.dashboard-card h4 .h4-img{width:18px;height:18px;border-radius:5px;vertical-align:-3px;margin-right:6px;display:inline-block;}
.sd-summary{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;}
.sd-badge{padding:4px 10px;border-radius:20px;font-size:12px;font-weight:600;}
.sd-badge.s{background:#23863633;color:#3fb950;}
.sd-badge.a{background:#1f6feb33;color:#58a6ff;}
.sd-badge.b{background:#9e6a0333;color:#d29922;}
.sd-badge.c{background:#2a2a2a;color:#888;}
.sd-list{list-style:none;max-height:560px;overflow-y:auto;padding-right:6px;}
.sd-item{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid #2a2a2a;}
.sd-item:last-child{border-bottom:none;}
.sd-rank{width:22px;font-size:13px;font-weight:700;color:#666;text-align:center;}
.sd-thumb{width:48px;height:48px;border-radius:10px;flex:0 0 48px;overflow:hidden;background:#1a1a1a;border:1px solid #2a2a2a;display:flex;align-items:center;justify-content:center;}
.sd-thumb img{width:100%;height:100%;object-fit:cover;display:block;}
.sd-thumb.ph{font-size:18px;color:#555;}
.sd-info{flex:1;min-width:0;}
.sd-name{font-size:13px;font-weight:600;color:#e0e0e0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.sd-meta{font-size:11px;color:#888;margin-top:2px;}
.sd-score{font-size:14px;font-weight:700;color:#3fb950;white-space:nowrap;}
.sd-grade{display:inline-block;width:18px;height:18px;line-height:18px;text-align:center;border-radius:4px;font-size:11px;font-weight:700;margin-right:6px;}
.sd-grade.S{background:#238636;color:#fff;}
.sd-grade.A{background:#1f6feb;color:#fff;}
.sd-grade.B{background:#9e6a03;color:#fff;}
.sd-grade.C{background:#444;color:#aaa;}

/* Custom Lists for Marketing & Strategy Cards */
.mkt-list{list-style:none;padding:0;margin:0;}
.mkt-item{padding:10px 0;border-bottom:1px solid #2a2a2a;display:flex;justify-content:space-between;align-items:center;gap:10px;}
.mkt-item:last-child{border-bottom:none;}
.mkt-main{flex:1;min-width:0;}
.mkt-title{font-size:13px;font-weight:600;color:#e0e0e0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.mkt-sub{font-size:11px;color:#777;margin-top:2px;}
.mkt-badge{font-size:11px;font-weight:600;padding:3px 8px;border-radius:4px;white-space:nowrap;}
.mkt-badge.green{background:rgba(63,185,80,0.15);color:#3fb950;}
.mkt-badge.blue{background:rgba(88,166,255,0.15);color:#58a6ff;}
.mkt-badge.purple{background:rgba(163,113,247,0.15);color:#a371f7;}
.mkt-badge.amber{background:rgba(210,153,34,0.15);color:#d29922;}

/* Side Stats */
.side-stats{display:flex;flex-direction:column;gap:20px;}
.side-stat{border-radius:14px;padding:20px;display:flex;justify-content:space-between;align-items:center;}
.side-stat-label{display:flex;align-items:center;gap:10px;}
.side-stat-icon{width:24px;height:24px;background:#2a2a2a;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:12px;}
.side-stat-text{display:flex;flex-direction:column;}
.side-stat-text span:first-child{font-size:12px;color:#999;}
.side-stat-text span:last-child{font-size:14px;color:#fff;font-weight:600;}
.dash-side{display:grid;grid-template-columns:1fr 1fr;gap:20px;}
@media(min-width:900px){.dash-side{grid-column:span 2;}}
@media(max-width:520px){.dash-side{grid-template-columns:1fr;}}

/* Log List */
.log-list{list-style:none;margin-top:15px;}
.log-list li{padding:10px 0;border-bottom:1px solid #2a2a2a;font-size:13px;color:#999;display:flex;justify-content:space-between;gap:15px;}
.log-list li:last-child{border-bottom:none;}
.log-text{color:#e0e0e0;}
.log-time{font-size:12px;color:#666;white-space:nowrap;}

.progress-bar{width:100%;height:6px;background:#2a2a2a;border-radius:3px;overflow:hidden;margin-top:15px;}
.progress-fill{height:100%;background:linear-gradient(90deg,#58a6ff,#79c0ff);transition:width 0.6s ease;}

footer{text-align:center;padding:30px;color:#666;font-size:12px;border-top:1px solid #1a1a1a;margin-top:40px;}

/* Responsive */
@media(max-width:1024px){
.hero{grid-template-columns:1fr;padding:40px 30px;min-height:555px;}
.hero-text{grid-column:1;}
.dashboard-grid{grid-template-columns:repeat(2,1fr);}
.stats-section{grid-template-columns:1fr;}
header{display:flex;flex-wrap:wrap;gap:10px;padding:12px 20px;height:auto;}
nav{gap:22px;flex-wrap:wrap;justify-content:flex-start;height:auto;justify-self:auto;order:3;width:100%;}
nav a{height:auto;padding-bottom:3px;}
.live-indicator{justify-self:auto;margin-left:auto;order:2;}
}
@media(max-width:768px){
body{font-size:14px;}
header{padding:14px 16px;}
.logo{font-size:18px;letter-spacing:2px;}
nav{gap:16px;}
nav a{font-size:12px;}
.live-indicator{font-size:18px;letter-spacing:2px;}
.container{padding:20px;}
.hero{padding:28px 20px;border-radius:8px;min-height:400px;}
.hero::before{background:linear-gradient(180deg,rgba(0,0,0,0.62) 0%,rgba(0,0,0,0.5) 55%,rgba(0,0,0,0.66) 100%);}
.hero-text h1{font-size:30px;margin-bottom:14px;}
.hero-text p{font-size:14px;margin-bottom:20px;}
.btn{padding:11px 18px;font-size:13px;flex:1;}
.today-intelligence{padding:20px;margin-bottom:30px;}
.intelligence-items{flex-direction:column;gap:15px;}
.stats-section{gap:20px;}
.stat-card{padding:20px;}
.stat-card .value{font-size:24px;}
.dashboard-grid{grid-template-columns:1fr;gap:15px;}
.dashboard-card{padding:15px;}
}
@media(max-width:480px){
.hero{min-height:340px;}
.hero-text h1{font-size:24px;}
.hero-text p{font-size:13px;}
.btn{padding:11px 12px;font-size:12px;}
.container{padding:15px;}
}

/* 채널 상태 표시 - 빈 채널을 가짜로 채우지 않고 사유를 밝힌다 */
.ch-note{font-size:13px;color:#8b949e;margin:-8px 0 18px 2px;line-height:1.6;}
.ch-note-sub{font-size:12px;color:#6e7681;}
.ch-empty{padding:12px 0;list-style:none;}
.ch-badge{display:inline-block;font-size:11px;font-weight:700;padding:3px 9px;
  border-radius:999px;background:rgba(139,148,158,.14);color:#8b949e;
  border:1px solid rgba(139,148,158,.24);}
.ch-reason{font-size:11.5px;color:#6e7681;margin-top:7px;line-height:1.55;}
.ch-src{list-style:none;font-size:11px;color:#6e7681;padding-top:9px;margin-top:7px;
  border-top:1px solid rgba(139,148,158,.14);}
.ch-off{font-size:10px;font-weight:700;color:#8b949e;background:rgba(139,148,158,.14);border:1px solid rgba(139,148,158,.24);border-radius:999px;padding:2px 7px;margin-left:6px;vertical-align:middle;}
.pm-warn{color:#f0883e;background:rgba(240,136,62,.08);border:1px solid rgba(240,136,62,.22);border-radius:10px;padding:10px 12px;margin-top:12px;font-size:12.5px;line-height:1.6;}
.pm-warn b{color:#ff7b72;}
.pm-src{font-size:11px;color:#6e7681;line-height:1.65;margin-top:9px;}
.ch-ai{display:inline-block;font-size:10px;font-weight:700;color:#d29922;background:rgba(210,153,34,.12);border:1px solid rgba(210,153,34,.28);border-radius:999px;padding:2px 7px;margin-right:7px;}

/* 마케팅 조사 분석팀 */
.mt-note{font-size:13px;color:#8b949e;margin:-8px 0 18px 2px;line-height:1.6;}
.mt-tags{margin-top:7px;display:flex;flex-wrap:wrap;gap:5px;}
.mt-tag{font-size:10.5px;color:#7ee787;background:rgba(126,231,135,.09);
  border:1px solid rgba(126,231,135,.2);border-radius:5px;padding:2px 7px;}
.sd-score small{display:block;font-size:10px;font-weight:400;color:#8b949e;margin-top:3px;}
.mkt-badge.amber{background:rgba(210,153,34,.13);color:#d29922;border:1px solid rgba(210,153,34,.26);}
.ch-manual{display:inline-block;font-size:10px;font-weight:700;color:#58a6ff;background:rgba(88,166,255,.12);border:1px solid rgba(88,166,255,.28);border-radius:999px;padding:2px 7px;margin-right:7px;}
.ch-verified{display:inline-block;font-size:10px;font-weight:700;color:#7ee787;background:rgba(126,231,135,.1);border:1px solid rgba(126,231,135,.24);border-radius:999px;padding:2px 7px;margin-right:7px;}
.pm-duty{background:rgba(88,166,255,.07);border:1px solid rgba(88,166,255,.22);border-radius:10px;padding:11px 13px;margin-top:12px;font-size:12.5px;color:#8b949e;line-height:1.6;}
.pm-duty b{color:#58a6ff;}
.pm-tbl{width:100%;border-collapse:collapse;margin:9px 0 6px;font-size:12px;}
.pm-tbl th{text-align:left;color:#6e7681;font-weight:600;padding:4px 6px;border-bottom:1px solid rgba(139,148,158,.18);}
.pm-tbl td{padding:5px 6px;border-bottom:1px solid rgba(139,148,158,.08);color:#c9d1d9;}
.pm-cau{font-size:11px;color:#f0883e;}
.pm-offer{background:rgba(126,231,135,.06);border:1px solid rgba(126,231,135,.2);border-radius:10px;padding:11px 13px;margin-top:12px;font-size:12.5px;color:#8b949e;line-height:1.6;}
.pm-offer b{color:#7ee787;}
.pm-offer .pm-tbl td{white-space:nowrap;}
.of-hl td{color:#7ee787;font-weight:600;}
.of-fs{font-size:9.5px;background:rgba(126,231,135,.14);border:1px solid rgba(126,231,135,.26);border-radius:999px;padding:1px 6px;margin-left:5px;}
.of-note{font-size:11px;color:#6e7681;line-height:1.6;}

.ops-meta{font-size:11px;color:#8b949e;margin-top:8px;}
.sd-csv-bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:8px 0 4px;font-size:12px;}
.sd-csv-bar a{color:#58a6ff;}
.sd-kw{display:inline-block;margin:2px 4px 0 0;padding:2px 6px;border-radius:4px;background:#21262d;color:#c9d1d9;font-size:10px;}
.sd-cost{font-size:11px;color:#8b949e;margin-top:2px;}

.agent-card{margin:0 0 18px;padding:14px 16px;border-radius:10px;border:1px solid #30363d;background:#0d1117;}
.agent-card h4{margin:0 0 8px;font-size:14px;color:#e6edf3;}
.agent-card ol{margin:8px 0 0;padding-left:20px;color:#c9d1d9;font-size:13px;line-height:1.55;}
.agent-card li{margin-bottom:6px;}
.agent-card .agent-meta{font-size:11px;color:#8b949e;margin-top:10px;}
.agent-card a{color:#58a6ff;}
.agent-card.risk-high{border-color:#9e6a03;background:#1a1408;}
.agent-card.risk-medium{border-color:#388bfd;background:#0d1117;}
.agent-card.risk-low{border-color:#238636;}
