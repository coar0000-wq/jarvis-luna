<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MD Family JARVIS LUNA - Enterprise v2</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        body{font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;background:#0d1117;color:#c9d1d9;padding:20px;min-height:100vh;}
        .container{max-width:900px;margin:auto;}
        h1{color:#58a6ff;margin-bottom:25px;border-bottom:1px solid #30363d;padding-bottom:12px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;}
        h1 .title{font-size:1.5rem;}
        #live-indicator{font-size:12px;color:#8b949e;background:#21262d;padding:4px 12px;border-radius:20px;border:1px solid #30363d;}
        #live-indicator.online{color:#3fb950;border-color:#238636;}
        #live-indicator.loading{color:#d29922;border-color:#9e6a03;}
        h2{color:#58a6ff;margin-bottom:18px;border-bottom:1px solid #30363d;padding-bottom:8px;}
        .card{background:#161b22;border:1px solid #30363d;border-radius:10px;padding:20px;margin-bottom:22px;}
        .stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:15px;margin-bottom:10px;}
        .stat-box{background:#21262d;border:1px solid #30363d;border-radius:8px;padding:18px;text-align:center;}
        .stat-box h3{color:#8b949e;font-size:13px;margin-bottom:10px;}
        .stat-box p{color:#f0f6fc;font-size:24px;font-weight:bold;}
        .refresh-info{text-align:right;color:#8b949e;font-size:12px;margin-top:12px;}
        ul{list-style:none;}
        li{padding:10px 0;border-bottom:1px solid #21262d;font-size:14px;display:flex;justify-content:space-between;align-items:center;gap:10px;}
        li:last-child{border-bottom:none;}
        .log-content{display:flex;gap:8px;align-items:center;flex:1;}
        .log-time{color:#8b949e;font-size:12px;background:#21262d;padding:2px 8px;border-radius:6px;border:1px solid #30363d;white-space:nowrap;}
        .log-empty{color:#8b949e;text-align:center;padding:16px 0;display:block;}
        .footer{text-align:center;color:#6e7681;font-size:12px;margin-top:30px;padding-bottom:20px;}
    </style>
</head>
<body>
<div class="container">
    <h1>
        <span class="title">MD Family JARVIS LUNA - Enterprise v2</span>
        <span id="live-indicator" class="loading">🟡 동기화 중...</span>
    </h1>

    <div class="stats-grid" style="margin-bottom: 22px;">
        <div class="stat-box"><h3>상품발굴팀</h3><p id="p-found">--</p></div>
        <div class="stat-box"><h3>시장분석팀</h3><p id="m-analyzed">--</p></div>
        <div class="stat-box"><h3>Shopify 운영</h3><p id="s-registered">--</p></div>
        <div class="stat-box"><h3>주문관리팀</h3><p id="o-today">--</p></div>
    </div>

    <div class="card">
        <h2>💰 CEO Executive Dashboard</h2>
        <div class="stats-grid">
            <div class="stat-box"><h3>오늘 매출</h3><p id="kpi-sales">$0</p></div>
            <div class="stat-box"><h3>오늘 순이익</h3><p id="kpi-profit">$0</p></div>
            <div class="stat-box"><h3>신규 상품</h3><p id="kpi-new">0개</p></div>
            <div class="stat-box"><h3>자동화율</h3><p id="kpi-auto">0%</p></div>
        </div>
        <div class="refresh-info" id="update-time">데이터 동기화 대기 중...</div>
    </div>

    <div class="card">
        <h2>🤖 AI 운영 브리핑</h2>
        <ul id="log-list">
            <li class="log-empty">⏳ 실시간 브리핑 불러오는 중...</li>
        </ul>
    </div>

    <div class="footer">MD Family JARVIS LUNA Enterprise v2 · GitHub Pages</div>
</div>

<script>
async function loadEnterpriseData() {
    const indicator = document.getElementById("live-indicator");
    indicator.className = "loading";
    indicator.textContent = "🟡 동기화 중...";

    try {
        const [kpi, product, market, shopify, order, finance, briefing] = await Promise.all([
            fetch('./data/executive_kpi.json').then(r => r.json()).catch(() => ({})),
            fetch('./data/product_team.json').then(r => r.json()).catch(() => ({})),
            fetch('./data/market_team.json').then(r => r.json()).catch(() => ({})),
            fetch('./data/shopify_team.json').then(r => r.json()).catch(() => ({})),
            fetch('./data/order_team.json').then(r => r.json()).catch(() => ({})),
            fetch('./data/finance_team.json').then(r => r.json()).catch(() => ({})),
            fetch('./data/ai_briefing.json').then(r => r.json()).catch(() => ({}))
        ]);

        document.getElementById("p-found").textContent = (product.today_found ?? 0) + "개";
        document.getElementById("m-analyzed").textContent = (market.analyzed ?? 0) + "개";
        document.getElementById("s-registered").textContent = (shopify.registered ?? 0) + "개";
        document.getElementById("o-today").textContent = (order.today_orders ?? 0) + "건";

        document.getElementById("kpi-sales").textContent = "$" + (kpi.today_sales ?? 0);
        document.getElementById("kpi-profit").textContent = "$" + (kpi.today_profit ?? 0);
        document.getElementById("kpi-new").textContent = (kpi.new_products ?? 0) + "개";
        document.getElementById("kpi-auto").textContent = (kpi.automation_rate ?? 0) + "%";
        document.getElementById("update-time").textContent = `마지막 갱신 : ${kpi.updated || "방금 전"}`;

        const logList = document.getElementById("log-list");
        if (briefing.logs && Array.isArray(briefing.logs) && briefing.logs.length > 0) {
            logList.innerHTML = "";
            briefing.logs.forEach(log => {
                const li = document.createElement("li");
                li.innerHTML = `
                    <div class="log-content"><span style="color:#58a6ff; font-weight:bold;">[${log.category}]</span> <span>${log.text}</span></div>
                    <span class="log-time">🕒 ${log.time}</span>
                `;
                logList.appendChild(li);
            });
        } else {
            logList.innerHTML = `<li class="log-empty">표시할 브리핑 로그가 없습니다.</li>`;
        }

        indicator.className = "online";
        indicator.textContent = "🟢 LIVE SYNC";
    } catch (err) {
        console.error("데이터 동기화 실패:", err);
        indicator.className = "loading";
        indicator.textContent = "🔴 SYNC ERROR";
    }
}
loadEnterpriseData();
setInterval(loadEnterpriseData, 30000);
</script>
</body>
</html>
