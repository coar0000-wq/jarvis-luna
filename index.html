<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JARVIS LUNA</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        header { text-align: center; color: white; margin-bottom: 30px; }
        h1 { font-size: 2.5em; margin-bottom: 10px; }
        .metrics { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .metric { background: white; padding: 20px; border-radius: 10px; text-align: center; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .metric-label { color: #666; font-size: 14px; margin-bottom: 10px; }
        .metric-value { font-size: 2em; font-weight: bold; color: #667eea; }
        .section { background: white; padding: 25px; border-radius: 10px; margin-bottom: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .section h2 { color: #667eea; margin-bottom: 15px; font-size: 1.5em; }
        .task-item { padding: 15px; border-left: 4px solid #667eea; background: #f8f9fa; margin-bottom: 10px; border-radius: 5px; }
        .task-item .status { display: inline-block; padding: 5px 10px; border-radius: 3px; font-size: 12px; font-weight: bold; margin-right: 10px; }
        .status.completed { background: #d4edda; color: #155724; }
        .status.in_progress { background: #cfe2ff; color: #084298; }
        .status.pending { background: #fff3cd; color: #664d03; }
        .team-member { padding: 12px; background: #f8f9fa; margin-bottom: 10px; border-radius: 5px; display: flex; justify-content: space-between; align-items: center; }
        .team-member .role { color: #666; font-size: 14px; }
        .progress-bar { width: 100%; height: 6px; background: #e0e0e0; border-radius: 3px; overflow: hidden; margin-top: 10px; }
        .progress { height: 100%; background: linear-gradient(90deg, #667eea, #764ba2); width: var(--progress); }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🤖 JARVIS LUNA</h1>
            <p>AGI 진화 실시간 대시보드</p>
        </header>

        <div class="metrics">
            <div class="metric">
                <div class="metric-label">AGI 레벨</div>
                <div class="metric-value">3.0</div>
            </div>
            <div class="metric">
                <div class="metric-label">진화도</div>
                <div class="metric-value">50%</div>
            </div>
            <div class="metric">
                <div class="metric-label">정확도</div>
                <div class="metric-value">99.8%</div>
            </div>
            <div class="metric">
                <div class="metric-label">가용성</div>
                <div class="metric-value">99.9%</div>
            </div>
        </div>

        <div class="section">
            <h2>📋 작업 상세 로그</h2>
            <div id="task-details">로딩 중...</div>
        </div>

        <div class="section">
            <h2>👥 팀원 실시간 상태</h2>
            <div id="team-status">로딩 중...</div>
        </div>

        <div class="section">
            <h2>📊 프로젝트 진행도</h2>
            <div id="project-progress">로딩 중...</div>
        </div>
    </div>

    <script>
        // 데이터 로드 및 표시
        async function loadData() {
            try {
                // 작업 로그
                const workRes = await fetch('./data/jarvis_work_detailed_log.json?t=' + Date.now());
                if (workRes.ok) {
                    const workData = await workRes.json();
                    displayTasks(workData.completed_today || []);
                }
            } catch (e) { console.log('작업 로그 로드 실패'); }

            try {
                // 팀원 상태
                const teamRes = await fetch('./data/team_status.json?t=' + Date.now());
                if (teamRes.ok) {
                    const teamData = await teamRes.json();
                    displayTeam(teamData.team_members || []);
                }
            } catch (e) { console.log('팀원 상태 로드 실패'); }

            try {
                // 프로젝트
                const projRes = await fetch('./data/projects.json?t=' + Date.now());
                if (projRes.ok) {
                    const projData = await projRes.json();
                    displayProjects(projData.projects || []);
                }
            } catch (e) { console.log('프로젝트 로드 실패'); }
        }

        function displayTasks(tasks) {
            let html = '';
            tasks.forEach(task => {
                html += `<div class="task-item">
                    <span class="status completed">${task.status || '✅ 완료'}</span>
                    <strong>${task.task}</strong>
                    <div style="color: #999; font-size: 12px; margin-top: 5px;">${task.duration || ''}</div>
                </div>`;
            });
            document.getElementById('task-details').innerHTML = html || '<p style="color: #999;">작업 데이터 없음</p>';
        }

        function displayTeam(members) {
            let html = '';
            members.forEach(member => {
                html += `<div class="team-member">
                    <div>
                        <strong>${member.name}</strong>
                        <div class="role">${member.role}</div>
                    </div>
                    <div>${member.status}</div>
                </div>`;
            });
            document.getElementById('team-status').innerHTML = html || '<p style="color: #999;">팀원 데이터 없음</p>';
        }

        function displayProjects(projects) {
            let html = '';
            projects.forEach(proj => {
                html += `<div style="margin-bottom: 20px;">
                    <div style="display: flex; justify-content: space-between; margin-bottom: 8px;">
                        <strong>${proj.name || proj.category}</strong>
                        <span style="color: #667eea; font-weight: bold;">${proj.progress || 0}%</span>
                    </div>
                    <div class="progress-bar">
                        <div class="progress" style="--progress: ${proj.progress || 0}%"></div>
                    </div>
                </div>`;
            });
            document.getElementById('project-progress').innerHTML = html || '<p style="color: #999;">프로젝트 데이터 없음</p>';
        }

        // 페이지 로드 시 데이터 불러오기
        window.addEventListener('load', loadData);
    </script>
</body>
</html>
