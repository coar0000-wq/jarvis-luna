name: publish
description: "Fail-closed publication: immutable delta, latest source merge, regeneration, final quality, bounded normal push"

inputs:
  paths:
    description: "Explicit required publication paths, separated by whitespace"
    required: true
  message:
    description: "Commit message"
    required: false
    default: "publish: auto"
  regenerate-dashboard:
    description: "Refresh local runtime even without source changes; final merged source changes always regenerate"
    required: false
    default: "true"
  audit:
    description: "Run full team audit in addition to the mandatory final release gate"
    required: false
    default: "true"

  collector-report:
    description: "Current sanitized collector outcome report, if produced by this workflow"
    required: false
    default: ''
  execution-id:
    description: "Current outcome report execution identity"
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Publish verified latest-source transaction
      shell: bash
      env:
        PUBLISH_PATHS: ${{ inputs.paths }}
        PUBLISH_MESSAGE: ${{ inputs.message }}
        PUBLISH_REGENERATE: ${{ inputs.regenerate-dashboard }}
        PUBLISH_AUDIT: ${{ inputs.audit }}
        PUBLISH_COLLECTOR_REPORT: ${{ inputs.collector-report }}
        PUBLISH_EXECUTION_ID: ${{ inputs.execution-id }}
        TYPESAFE_ENABLED: '0'
        GEMINI_FALLBACK_ENABLED: '0'
      run: |
        set -euo pipefail
        args=(
          --paths "$PUBLISH_PATHS"
          --message "$PUBLISH_MESSAGE"
          --regenerate-dashboard "$PUBLISH_REGENERATE"
          --audit "$PUBLISH_AUDIT"
          --max-attempts 3
        )
        if [ -n "$PUBLISH_COLLECTOR_REPORT" ]; then
          args+=(--collector-report "$PUBLISH_COLLECTOR_REPORT" --execution-id "$PUBLISH_EXECUTION_ID")
        fi
        python -u scripts/publish_transaction.py "${args[@]}"
