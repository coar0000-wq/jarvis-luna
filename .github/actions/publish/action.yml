name: publish
description: "산출물 발행 - 원격 최신 위에 이번 변경만 커밋 (git add -A 금지)"

inputs:
  paths:
    description: "이번 실행에서 만든 파일 목록 (공백/줄바꿈 구분)"
    required: true
  message:
    description: "커밋 메시지"
    required: true
    default: "publish: auto"

runs:
  using: "composite"
  steps:
    - name: Publish only specified paths
      shell: bash
      run: |
        set -e
        echo "📦 Publish paths:"
        echo "${{ inputs.paths }}"
        
        # paths를 줄바꿈/공백으로 분리하여 git add
        echo "${{ inputs.paths }}" | tr ' ' '\n' | while read -r p; do
          p=$(echo "$p" | xargs) # trim
          if [ -n "$p" ]; then
            if [ -e "$p" ]; then
              echo "  + $p"
              git add "$p" || echo "⚠️ add 실패: $p"
            else
              echo "  - not found (skip): $p"
            fi
          fi
        done
        
        # 변경사항이 있는지 확인
        if git diff --cached --quiet; then
          echo "ℹ️ 변경사항 없음 - 커밋 스킵"
          exit 0
        fi
        
        git config user.name "JARVIS"
        git config user.email "jarvis@luna.bot"
        git commit -m "${{ inputs.message }} - $(date -u +%Y-%m-%dT%H:%M:%SZ)"
        
        # rebase retry - 남의 결과 되돌리지 않음
        for i in 1 2 3; do
          git pull --rebase origin main || (git rebase --abort; git pull origin main)
          if git push origin main; then
            echo "✅ Push 성공"
            break
          fi
          echo "retry $i"; sleep 5
          if [ $i -eq 3 ]; then
            echo "❌ Push 3회 실패"
            exit 1
          fi
        done
