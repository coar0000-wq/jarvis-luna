name: 산출물 발행

description: >
  이번 실행이 실제로 바꾼 파일만 원격 최신 위에 얹고,
  대시보드를 최종 트리에서 다시 만든 뒤,
  팀 숫자 감사를 통과한 경우에만 main으로 발행한다.

inputs:
  paths:
    description: 발행 대상 경로. 공백으로 나눈다.
    required: false
    default: data obsidian

  message:
    description: 커밋 메시지
    required: true

  base:
    description: >
      이번 실행이 시작한 커밋.
      이 커밋부터 현재 실행이 만든 변경만 발행한다.
    required: false
    default: ${{ github.sha }}

  regenerate-dashboard:
    description: >
      발행 직전 dashboard_runtime.json 을 다시 만들지
    required: false
    default: 'true'

  audit:
    description: >
      발행 전에 팀 보고 숫자 감사를 실행할지
    required: false
    default: 'true'

runs:
  using: composite

  steps:
    - shell: bash
      env:
        IN_PATHS: ${{ inputs.paths }}
        IN_MESSAGE: ${{ inputs.message }}
        IN_BASE: ${{ inputs.base }}
        IN_REGEN: ${{ inputs.regenerate-dashboard }}
        IN_AUDIT: ${{ inputs.audit }}

      run: |
        set -euo pipefail

        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

        echo "========================================"
        echo "JARVIS 안전 발행 시작"
        echo "========================================"

        # ------------------------------------------------------------
        # 1. 이번 실행이 실제로 만든 변경사항을 임시 커밋으로 고정
        # ------------------------------------------------------------

        git add -A -- $IN_PATHS 2>/dev/null || true

        if git diff --cached --quiet; then
          echo "이번 실행이 만든 변경 없음"
          exit 0
        fi

        git commit -q -m "wip (발행 전 고정)"

        MINE=$(git rev-parse HEAD)

        echo "이번 실행 커밋: $MINE"

        # ------------------------------------------------------------
        # 2. 기준 커밋 존재 여부 확인
        #
        # 기준 커밋을 찾지 못하면 과거처럼 전체 경로를 덮어쓰지 않는다.
        # 안전하게 중단한다.
        # ------------------------------------------------------------

        BASE="$IN_BASE"

        if [ -z "$BASE" ]; then
          echo "::error::이번 실행의 기준 커밋이 비어 있다."
          echo "::error::안전하지 않은 전체 경로 발행을 막기 위해 중단한다."
          exit 1
        fi

        if ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
          echo "::error::기준 커밋 ${BASE} 을 찾을 수 없다."
          echo "::error::전체 data 덮어쓰기 폴백은 사용하지 않는다."
          exit 1
        fi

        echo "기준 커밋 확인: $BASE"

        # ------------------------------------------------------------
        # 3. 최신 origin/main 위에 이번 실행의 변경 파일만 적용
        # ------------------------------------------------------------

        for i in 1 2 3 4 5; do

          echo "----------------------------------------"
          echo "발행 시도 $i / 5"
          echo "----------------------------------------"

          git fetch -q origin main

          git checkout -q -B publish origin/main
          git reset -q --hard origin/main

          CHANGED=$(git diff --name-only "$BASE" "$MINE" -- $IN_PATHS)

          if [ -z "$CHANGED" ]; then
            echo "이번 실행이 바꾼 파일이 없다"
            exit 0
          fi

          echo "이번 실행 변경 파일:"
          printf '%s\n' "$CHANGED"

          N=0

          while IFS= read -r f; do
            [ -z "$f" ] && continue

            # MINE에 파일이 존재하면 최신 원격 트리에 그 파일만 복원
            if git cat-file -e "${MINE}:${f}" 2>/dev/null; then

              git checkout -q "$MINE" -- "$f"
              N=$((N + 1))

            else

              # 이번 실행에서 파일이 삭제됐다면 원격에서도 삭제
              if git cat-file -e "HEAD:${f}" 2>/dev/null; then
                git rm -q -f -- "$f"
                N=$((N + 1))
              fi

            fi

          done <<< "$CHANGED"

          echo "이번 실행이 바꾼 파일 ${N}개만 얹는다"
          echo "나머지 원격 파일은 그대로 유지한다"

          if [ "$N" -eq 0 ]; then
            echo "::error::적용된 변경 파일이 0개다."
            exit 1
          fi

          git add -A -- $IN_PATHS 2>/dev/null || true

          # ----------------------------------------------------------
          # 4. 최종 트리에서 dashboard_runtime.json 재생성
          # ----------------------------------------------------------

          if [ "$IN_REGEN" = "true" ] &&
             [ -f scripts/generate_dashboard_runtime.py ]; then

            echo "대시보드 최종 트리 재생성..."

            python3 -u scripts/generate_dashboard_runtime.py

            git add -A -- data/dashboard_runtime.json 2>/dev/null || true

          fi

          # ----------------------------------------------------------
          # 5. 변경사항이 정말 있는지 확인
          # ----------------------------------------------------------

          if git diff --cached --quiet; then
            echo "최종 트리에 발행할 변경사항 없음"
            exit 0
          fi

          # ----------------------------------------------------------
          # 6. 커밋 후보 생성
          # ----------------------------------------------------------

          git commit -q -m "$IN_MESSAGE"

          CANDIDATE=$(git rev-parse HEAD)

          echo "발행 후보 커밋: $CANDIDATE"

          # ----------------------------------------------------------
          # 7. 중요:
          #    푸시하기 전에 감사 실행
          #
          #    예전에는 push 후 audit이었다.
          #    그래서:
          #
          #      push 성공
          #      ↓
          #      audit FAIL
          #      ↓
          #      Actions 빨간색
          #
          #    이제는:
          #
          #      대시보드 생성
          #      ↓
          #      audit
          #      ↓
          #      audit 통과
          #      ↓
          #      push
          #
          #    순서로 바꾼다.
          # ----------------------------------------------------------

          if [ "$IN_AUDIT" = "true" ] &&
             [ -f scripts/audit_team_reports.py ]; then

            echo "팀 보고 숫자 감사 시작..."

            if ! python3 -u scripts/audit_team_reports.py; then
              echo "::error::팀 보고 숫자 감사 실패."
              echo "::error::원격 main에는 아직 푸시하지 않는다."
              echo "::error::위 FAIL 내용을 먼저 수정한다."
              exit 1
            fi

            echo "팀 보고 숫자 감사 통과"

          fi

          # ----------------------------------------------------------
          # 8. 최종 푸시
          # ----------------------------------------------------------

          if git push -q origin HEAD:main; then

            echo "========================================"
            echo "push 성공"
            echo "시도: $i"
            echo "이번 실행 변경 파일: ${N}개"
            echo "========================================"

            exit 0
          fi

          echo "::warning::push 거절됨. 최신 원격으로 다시 계산한다."

          git reset -q --hard origin/main

          sleep $((i * 4))

        done

        echo "::error::5회 시도 후 push 실패"
        exit 1
