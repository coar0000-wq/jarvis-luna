version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '03:00'
      timezone: Asia/Seoul
    open-pull-requests-limit: 3
    groups:
      verified-actions:
        patterns: ['*']
  - package-ecosystem: pip
    directory: /requirements
    schedule:
      interval: weekly
      day: monday
      time: '03:30'
      timezone: Asia/Seoul
    open-pull-requests-limit: 3
    groups:
      locked-profiles:
        patterns: ['*']
