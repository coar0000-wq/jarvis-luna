name: JARVIS Health Monitor

on:
  schedule:
    # 30분 간격 (더 안정적)
    - cron: '0 * * * *'
    - cron: '30 * * * *'
  workflow_dispatch:

jobs:
  health_check_and_recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 📥 저장소 체크아웃
        uses: actions/checkout@v4.1.7

      - name: 🐍 Python 3.10 설정
        uses: actions/setup-python@v5.2
        with:
          python-version: '3.10'

      - name: 📦 필수 라이브러리 설치
        run: |
          pip install requests --break-system-packages
          echo "✅ 라이브러리 설치 완료"

      - name: 🔍 JARVIS 상태 체크
        run: |
          echo "🔍 JARVIS 시스템 상태 체크 시작..."
          echo "⏰ 실행 시간: $(date '+%Y-%m-%d %H:%M:%S')"
          python scripts/health_check.py > health_check.log 2>&1
          cat health_check.log

      - name: 🔧 자동 복구 실행
        run: |
          echo "🔧 JARVIS 자동 복구 시작..."
          python scripts/auto_recovery.py
          echo "✅ 복구 완료"

      - name: 📝 실행 상태 기록
        run: |
          git config --local user.email "jarvis-health@automation.local"
          git config --local user.name "JARVIS Health Monitor"

          echo "✅ GitHub Actions 실행: $(date '+%Y-%m-%d %H:%M:%S')" >> .github/health_check.log

          git add -A

          if git diff --cached --quiet; then
            echo "ℹ️ 변경사항 없음"
          else
            git commit -m "🤖 JARVIS 자동화 실행 ($(date '+%Y-%m-%d %H:%M:%S'))"
            git push origin main
          fi

      - name: 📊 실행 결과
        run: |
          echo "=================================================="
          echo "✅ JARVIS 10분 자동 안정화 완료"
          echo "=================================================="
          echo "⏰ 실행 시간: $(date '+%Y-%m-%d %H:%M:%S')"
          echo ""
          echo "📋 체크 항목:"
          echo "  ✅ 데이터 파일 신선도"
          echo "  ✅ 워크플로우 상태"
          echo "  ✅ 스크립트 파일 무결성"
          echo "  ✅ 에러 자동 복구"
          echo ""
          echo "🔄 다음 실행: 약 10분 후"
          echo "=================================================="