name: Daiso Real Product Collection

# 다이소몰에서 실제 상품 데이터를 수집한 뒤
# Shopify 수요 점수를 계산하고 저장소에 커밋한다.
#
# 핵심 원칙
# 1. 실제 수집 결과가 확인되기 전에는 publish하지 않는다.
# 2. 수집기가 실패해도 "성공"으로 위장하지 않는다.
# 3. 부분 파싱 실패는 상세 숫자로 기록하되,
#    전체 수집 결과가 유효하면 계속 진행한다.
# 4. 이미 실패한 URL은 다음 수집 단계에서 같은 URL만 반복하지 않도록
#    기존 큐/수집기 블랙리스트 로직을 존중한다.

on:
  schedule:
    - cron: '20 19 * * *'

  workflow_dispatch:
    inputs:
      max_items:
        description: '이번 실행에서 수집할 상품 수'
        required: false
        default: '110'

      queue_only:
        description: '뷰티 큐 대상 (비우면 허브 전체)'
        required: false
        default: ''

      delay:
        description: '요청 간 대기 초 (robots.txt 권장 30)'
        required: false
        default: '30'

concurrency:
  group: daiso-real-collection
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests beautifulsoup4 lxml

      - name: 환율 갱신 (USD/KRW)
        continue-on-error: true
        timeout-minutes: 3
        run: |
          python -u scripts/fetch_fx_rate.py

      - name: 뷰티 URL 큐 만들기
        continue-on-error: true
        timeout-minutes: 8
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DAISO_QUEUE_ONLY: ${{ github.event.inputs.queue_only }}
        run: |
          python -u scripts/daiso/build_beauty_queue.py

      - name: Collect Daiso products
        continue-on-error: true
        env:
          DAISO_MAX_ITEMS: ${{ github.event.inputs.max_items || '110' }}
          DAISO_DELAY: ${{ github.event.inputs.delay || '30' }}
        run: |
          python -u scripts/daiso/collect_daiso.py

      - name: 제외 규칙으로 상품 목록 정리
        shell: bash
        run: |
          python -u scripts/daiso/prune_excluded_products.py --apply

      - name: 실제 수집 결과 검증
        shell: bash
        run: |
          python - <<'PY'
          import json
          import sys
          from datetime import datetime, timezone
          from pathlib import Path

          path = Path("data/daiso_real/collection_status.json")

          if not path.exists():
              print("::error::collection_status.json 이 없습니다.")
              sys.exit(1)

          try:
              data = json.loads(path.read_text(encoding="utf-8"))
          except Exception as e:
              print(f"::error::collection_status.json JSON 파싱 실패: {e}")
              sys.exit(1)

          run = data.get("last_run") or {}

          requested = int(run.get("requested") or 0)
          ok = int(run.get("ok") or 0)
          parse_failed = int(run.get("parse_failed") or 0)

          started = str(run.get("started_at") or "")
          finished = str(run.get("finished_at") or "")
          status = str(run.get("status") or "").lower()

          print("========================================")
          print("       다이소 실제 수집 결과 검증")
          print("========================================")
          print(f"requested    : {requested}")
          print(f"ok           : {ok}")
          print(f"parse_failed : {parse_failed}")
          print(f"status       : {status}")
          print(f"started_at   : {started}")
          print(f"finished_at  : {finished}")
          print("========================================")

          print(f"queue_size   : {run.get('queue_size')}")
          print(f"url_source   : {run.get('url_source')}")
          print(f"뷰티 아님    : {run.get('skipped_not_beauty')}")
          print("========================================")

          if not requested:
              print("::error::requested 값이 0입니다.")
              sys.exit(1)

          if not started:
              print("::error::이번 수집의 started_at 기록이 없습니다.")
              sys.exit(1)

          if not finished:
              print("::error::이번 수집의 finished_at 기록이 없습니다.")
              sys.exit(1)

          try:
              started_dt = datetime.fromisoformat(
                  started.replace("Z", "+00:00")
              )
              finished_dt = datetime.fromisoformat(
                  finished.replace("Z", "+00:00")
              )
          except Exception as e:
              print(f"::error::수집 시각 파싱 실패: {e}")
              sys.exit(1)

          now = datetime.now(timezone.utc)

          age_hours = (
              now - finished_dt
          ).total_seconds() / 3600

          duration_minutes = (
              finished_dt - started_dt
          ).total_seconds() / 60

          print(f"완료 후 경과: {age_hours:.2f}시간")
          print(f"실행 시간  : {duration_minutes:.1f}분")

          if age_hours > 6:
              print(
                  "::error::최근 수집 완료 기록이 너무 오래됐습니다. "
                  f"마지막 완료 시각 기준 {age_hours:.1f}시간 전입니다."
              )
              sys.exit(1)

          if finished_dt < started_dt:
              print("::error::finished_at 이 started_at 보다 빠릅니다.")
              sys.exit(1)

          if status != "ok":
              print(
                  f"::error::수집기 상태가 정상(ok)이 아닙니다: {status}"
              )
              sys.exit(1)

          if ok <= 0:
              print(
                  "::error::이번 실행 성공 상품이 0건입니다. "
                  "기존 데이터를 새 수집 결과처럼 발행하지 않습니다."
              )

              if not run.get("queue_size"):
                  print(
                      "::error::큐가 비어 있었습니다. "
                      "scripts/daiso/build_beauty_queue.py 부터 보십시오."
                  )

              sys.exit(1)

          if parse_failed > 0:
              print(
                  f"::warning::부분 파싱 실패 {parse_failed}건이 있습니다. "
                  "실패 SKU는 collector_audit에서 확인합니다."
              )

          print("실제 수집 결과 검증 통과")
          PY

      - name: Product Master 갱신 + Score Shopify demand
        shell: bash
        run: |
          python -u scripts/build_product_master.py
          python -u scripts/daiso/score_shopify_demand.py
          python -u scripts/build_product_master.py --inject-s

      # ============================================================
      # 점수 파생 보드 재생성
      #
      # 순서:
      #   score
      #     -> legal
      #     -> market_team
      #     -> listing_gate
      #     -> Shopify S CSV
      #     -> channel_candidates
      #     -> dashboard
      #
      # build_artifact_graph.py가 이 재생성 경로를 검사한다.
      # ============================================================
      - name: 점수 파생 보드 재생성
        shell: bash
        run: |
          python -u scripts/check_legal_products.py
          python -u scripts/build_legal_full.py
          python -u scripts/build_listing_gate.py
          python -u scripts/build_product_master.py --inject-s
          python -u scripts/build_market_team.py

      - name: Shopify 게이트 통과 Export와 Action 큐 생성
        shell: bash
        run: |
          python -u scripts/export_shopify_operational.py
          python -u scripts/build_shopify_action_queue.py

      - name: 채널 후보 재생성
        shell: bash
        run: |
          python -u scripts/discover_channels.py

      - name: Validate artifacts
        id: validate
        shell: bash
        run: |
          python -u scripts/validate_commerce_architecture.py
          python - <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          required = [
              "data/daiso_real/products.json",
              "data/daiso_real/shopify_demand_score.json",
              "data/daiso_real/collection_status.json",
          ]

          ok = True

          for p in required:
              f = Path(p)

              if not f.exists():
                  print("MISSING", p)
                  ok = False
                  continue

              try:
                  data = json.loads(
                      f.read_text(encoding="utf-8")
                  )
                  print("OK", p)

                  if isinstance(data, dict):
                      print(
                          "  keys:",
                          ", ".join(list(data.keys())[:12])
                      )

              except Exception as e:
                  print("INVALID", p, e)
                  ok = False

          products_path = Path("data/daiso_real/products.json")

          if products_path.exists():
              try:
                  products_doc = json.loads(
                      products_path.read_text(encoding="utf-8")
                  )

                  if isinstance(products_doc, dict):
                      products = (
                          products_doc.get("products")
                          or products_doc.get("items")
                          or []
                      )
                  elif isinstance(products_doc, list):
                      products = products_doc
                  else:
                      products = []

                  if not isinstance(products, list):
                      print(
                          "::error::products.json의 상품 목록 구조가 잘못되었습니다."
                      )
                      ok = False
                  else:
                      print(f"PRODUCTS_COUNT={len(products)}")

              except Exception as e:
                  print(
                      "::error::products.json 검증 실패:",
                      e
                  )
                  ok = False

          with open(
              os.environ["GITHUB_OUTPUT"],
              "a",
              encoding="utf-8"
          ) as out:
              out.write(
                  f"artifacts_ok={'true' if ok else 'false'}\n"
              )

          if not ok:
              print("::error::산출물 검증 실패")
              sys.exit(1)

          print("산출물 검증 통과")
          PY

      - name: 대시보드 최종 생성
        shell: bash
        run: |
          python -u scripts/generate_dashboard_runtime.py

      - name: 발행 전 감사 미리 보기
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          echo '### 다이소 실수집 결과' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

          python - <<'PY' >> "$GITHUB_STEP_SUMMARY" 2>&1
          import json
          from pathlib import Path

          p = Path("data/daiso_real/collection_status.json")

          if p.exists():
              d = json.loads(
                  p.read_text(encoding="utf-8")
              )
              r = d.get("last_run") or {}

              for k in (
                  "requested",
                  "ok",
                  "parse_failed",
                  "status",
                  "queue_size",
                  "url_source",
                  "skipped_not_beauty",
                  "skipped_parked",
                  "finished_at",
              ):
                  print(f"{k}=", r.get(k))
          else:
              print("collection_status.json 없음")
          PY

          python -u scripts/audit_team_reports.py \
            >> "$GITHUB_STEP_SUMMARY" 2>&1 || true

          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Summary
        if: always()
        shell: bash
        run: |
          echo '### 다이소 실수집 + Shopify 수요 점수' >> "$GITHUB_STEP_SUMMARY"

          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path

          files = [
              "data/daiso_real/collection_status.json",
              "data/daiso_real/shopify_demand_score.json",
          ]

          for p in files:
              f = Path(p)

              if not f.exists():
                  print(f"- {p}: 없음")
                  continue

              try:
                  d = json.loads(
                      f.read_text(encoding="utf-8")
                  )
              except Exception as e:
                  print(f"- {p}: 파싱 실패 {e}")
                  continue

              if p.endswith("collection_status.json"):
                  r = d.get("last_run") or {}

                  print(
                      "- 수집: "
                      f"requested={r.get('requested', 0)} / "
                      f"ok={r.get('ok', 0)} / "
                      f"parse_failed={r.get('parse_failed', 0)} / "
                      f"status={r.get('status', '-')}"
                  )

                  print(
                      f"- 수집 완료: {r.get('finished_at', '-')}"
                  )

              else:
                  if isinstance(d, dict):
                      n = (
                          d.get("total")
                          or d.get("count")
                          or len(
                              d.get(
                                  "products",
                                  d.get("scores", [])
                              )
                          )
                      )
                      print(
                          f"- {p}: {n}건 / "
                          f"updated "
                          f"{d.get('updated_at') or d.get('generated_at') or '-'}"
                      )
                  elif isinstance(d, list):
                      print(
                          f"- {p}: {len(d)}건"
                      )
          PY

      - name: 산출물 발행 (원격 최신 위에 이번 변경만)
        if: steps.validate.outputs.artifacts_ok == 'true'
        uses: ./.github/actions/publish
        with:
          paths: >-
            data/daiso_real
            data/product_master.json
            data/legal_products.json
            data/legal_full.json
            data/mocra_readiness.json
            data/market_team.json
            data/shopify_marketing_strategy.json
            data/marketing_priority.csv
            data/coaching_loop.json
            data/listing_gate.json
            data/shopify_exports
            data/shopify_action_queue.json
            data/dashboard_runtime.json
            data/channel_candidates.json
            data/knowledge/cumulative_history.json
          message: 다이소 실수집 + Shopify 수요 점수 갱신
          regenerate-dashboard: 'true'
          audit: 'true'

      - name: 최종 결과
        if: always()
        shell: bash
        run: |
          echo "========================================"
          echo "     JARVIS Daiso Collection 결과"
          echo "========================================"

          if [ -f data/daiso_real/collection_status.json ]; then
            python - <<'PY'
          import json
          from pathlib import Path

          p = Path(
              "data/daiso_real/collection_status.json"
          )

          d = json.loads(
              p.read_text(encoding="utf-8")
          )

          r = d.get("last_run") or {}

          print(
              f"요청: {r.get('requested', 0)}"
          )
          print(
              f"성공: {r.get('ok', 0)}"
          )
          print(
              f"파싱 실패: {r.get('parse_failed', 0)}"
          )
          print(
              f"상태: {r.get('status', '-')}"
          )
          print(
              f"완료: {r.get('finished_at', '-')}"
          )

          reasons = r.get("parse_fail_reasons") or {}

          if reasons:
              print("실패 사유:")
              for k, v in reasons.items():
                  print(f"  - {k}: {v}")
          PY
          else
            echo "collection_status.json 없음"
          fi

          echo "========================================"
