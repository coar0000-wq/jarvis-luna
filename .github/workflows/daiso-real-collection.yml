name: Daiso Real Product Collection

# 다이소몰에서 실제 상품 데이터를 수집한 뒤
# Shopify 수요 점수를 계산하고 저장소에 커밋한다.
#
# 핵심 원칙
# 1. 실제 수집 결과가 확인되기 전에는 publish하지 않는다.
# 2. 수집기가 실패해도 "성공"으로 위장하지 않는다.
# 3. 부분 파싱 실패는 상세 숫자로 기록하되,
#    전체 수집 결과가 유효하면 계속 진행한다.
# 4. 이미 실패한 URL은 다음 수집 단계에서 같은 URL만 반복하지 않도록
#    기존 큐/수집기 블랙리스트 로직을 존중한다.

on:
  schedule:
    - cron: '20 19 * * *'

  workflow_dispatch:
    inputs:
      max_items:
        description: '이번 실행에서 수집할 상품 수'
        required: false
        default: '110'

      queue_only:
        description: '뷰티 큐 대상 (비우면 허브 전체)'
        required: false
        default: ''

      delay:
        description: '요청 간 대기 초 (robots.txt 권장 30)'
        required: false
        default: '30'

      reconcile_safety:
        description: '(사람 확인용 1회 조치) 안전 원장 연속성을 main 의 검증된 스냅샷에서 다시 세운다. 직전 실행들이 증거 파일 없이 실패해 생긴 교착 해소용'
        required: false
        default: false
        type: boolean

      refresh_auxiliary_sources:
        description: '환율·뷰티 큐 갱신 (false는 기존 큐로 무료 진단)'
        required: false
        default: true
        type: boolean

concurrency:
  # The same durable source ledger is used by Core/Deep; serialize all three.
  group: main-publish
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # actions/setup-python@v7.0.0
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements/requirements-daiso.txt

      - name: Restore durable source safety before observation
        id: source_safety
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          # reconcile_safety=true 는 사람이 수동 실행할 때만 쓴다. main 에 커밋된 스냅샷이 스스로 유효할 때만 통과한다.
          if [ "${{ github.event_name == 'workflow_dispatch' && inputs.reconcile_safety }}" = "true" ]; then
            python -u scripts/restore_source_safety.py --root "$GITHUB_WORKSPACE" --verify-current
          else
            python -u scripts/restore_source_safety.py --root "$GITHUB_WORKSPACE"
          fi

      - name: Restore immutable operations safety before execution
        id: operations_safety
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          if [ "${{ github.event_name == 'workflow_dispatch' && inputs.reconcile_safety }}" = "true" ]; then
            python -u scripts/restore_operations_safety.py --root "$GITHUB_WORKSPACE" --verify-current
          else
            python -u scripts/restore_operations_safety.py --root "$GITHUB_WORKSPACE"
          fi

      - name: 환율 갱신 (USD/KRW)
        if: github.event_name != 'workflow_dispatch' || inputs.refresh_auxiliary_sources
        continue-on-error: true
        timeout-minutes: 3
        run: |
          python -u scripts/fetch_fx_rate.py

      - name: 뷰티 URL 큐 만들기
        if: github.event_name != 'workflow_dispatch' || inputs.refresh_auxiliary_sources
        continue-on-error: true
        timeout-minutes: 8
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DAISO_QUEUE_ONLY: ${{ github.event.inputs.queue_only }}
        run: |
          python -u scripts/daiso/build_beauty_queue.py

      - name: Collect Daiso products
        id: collector
        continue-on-error: true
        env:
          DAISO_EXECUTION_ID: ${{ github.run_id }}:${{ github.run_attempt }}:collect
          # Daily discovery is independent from fixed operating quantities.
          DAISO_DISCOVERY_ENABLED: '1'
          DAISO_OPERATING_UPDATES_ENABLED: '0'
          DAISO_MAX_ITEMS: ${{ github.event.inputs.max_items || '110' }}
          DAISO_DELAY: ${{ github.event.inputs.delay || '30' }}
        run: |
          echo "started_at=$(date -u +%Y-%m-%dT%H:%M:%S.%NZ)" >> "$GITHUB_OUTPUT"
          python -u scripts/daiso/collect_daiso.py

      - name: 실제 수집 결과 검증
        id: collection
        if: ${{ always() && steps.collector.outcome != 'skipped' }}
        shell: bash
        env:
          COLLECTOR_OUTCOME: ${{ steps.collector.outcome }}
          COLLECTOR_STARTED_AT: ${{ steps.collector.outputs.started_at }}
          DAISO_EXECUTION_ID: ${{ github.run_id }}:${{ github.run_attempt }}:collect
        run: |
          python -u scripts/validate_daiso_collection.py \
            --collector-outcome "$COLLECTOR_OUTCOME" \
            --execution-id "$DAISO_EXECUTION_ID" \
            --started-after "$COLLECTOR_STARTED_AT"

      - name: 제외 규칙으로 상품 목록 정리
        if: steps.collection.outputs.mode == 'collected'
        shell: bash
        run: |
          python -u scripts/daiso/prune_excluded_products.py --apply

      - name: Product Master 갱신 + Score Shopify demand
        if: steps.collection.outputs.mode == 'collected'
        shell: bash
        run: |
          python -u scripts/build_product_master.py
          python -u scripts/daiso/score_shopify_demand.py
          python -u scripts/build_product_master.py --inject-s

      # ============================================================
      # 점수 파생 보드 재생성
      #
      # 순서:
      #   score
      #     -> legal
      #     -> market_team
      #     -> listing_gate
      #     -> Shopify S CSV
      #     -> channel_candidates
      #     -> dashboard
      #
      # build_artifact_graph.py가 이 재생성 경로를 검사한다.
      # ============================================================
      - name: 점수 파생 보드 재생성
        if: steps.collection.outputs.mode == 'collected'
        shell: bash
        run: |
          python -u scripts/check_legal_products.py
          python -u scripts/build_legal_full.py
          python -u scripts/build_listing_gate.py
          python -u scripts/build_product_master.py --inject-s
          python -u scripts/build_market_team.py

      - name: Shopify 게이트 통과 Export와 Action 큐 생성
        if: steps.collection.outputs.mode == 'collected'
        shell: bash
        run: |
          python -u scripts/prepare_commerce_export.py
          python -u scripts/export_shopify_operational.py --blocked-noop
          python -u scripts/build_shopify_action_queue.py

      - name: 채널 후보 재생성
        if: steps.collection.outputs.mode == 'collected'
        shell: bash
        run: |
          python -u scripts/discover_channels.py

      - name: Keep canonical product inputs on no_change
        if: steps.collection.outputs.mode == 'no_change' || steps.collection.outputs.mode == 'candidates'
        shell: bash
        run: |
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path
          p = Path('data/daiso_real/collection_status.json')
          current = json.loads(p.read_text(encoding='utf-8'))
          baseline = json.loads(subprocess.check_output(['git', 'show', 'HEAD:data/daiso_real/collection_status.json'], text=True, encoding='utf-8'))
          if 'fx' in baseline:
              current['fx'] = baseline['fx']
          else:
              current.pop('fx', None)
          p.write_text(json.dumps(current, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          queue = 'data/daiso_real/beauty_queue.json'
          tracked = subprocess.run(['git', 'ls-files', '--error-unmatch', queue], capture_output=True).returncode == 0
          if tracked:
              subprocess.run(['git', 'restore', '--source=HEAD', '--', queue], check=True)
          else:
              Path(queue).unlink(missing_ok=True)
          print('NO_CHANGE_CANONICAL_INPUTS_PRESERVED')
          PY

      - name: Build separate candidate comparisons
        if: steps.collection.outputs.collection_valid == 'true'
        shell: bash
        env:
          TYPESAFE_ENABLED: '0'
          GEMINI_FALLBACK_ENABLED: '0'
        run: python -u scripts/build_daiso_candidate_comparison.py

      - name: Record actual collector stage receipt
        if: steps.collection.outputs.collection_valid == 'true'
        env:
          COLLECTOR_OUTCOME: ${{ steps.collector.outcome }}
          COLLECTOR_STARTED_AT: ${{ steps.collector.outputs.started_at }}
          DAISO_EXECUTION_ID: ${{ github.run_id }}:${{ github.run_attempt }}:collect
        run: |
          python -u scripts/candidate_pool_history.py --root "$GITHUB_WORKSPACE"
          python -u scripts/daiso_pipeline_inputs.py record-collector --root "$GITHUB_WORKSPACE" \
            --collector-outcome "$COLLECTOR_OUTCOME" --started-after "$COLLECTOR_STARTED_AT"

      - name: Observe active shortlist source prices without operating writes
        if: steps.source_safety.outputs.continuity == 'verified'
        continue-on-error: true
        timeout-minutes: 12
        env:
          JARVIS_SOURCE_CONTINUITY: ${{ steps.source_safety.outputs.continuity }}
        run: python -u scripts/daiso/observe_shortlist.py --root "$GITHUB_WORKSPACE"

      - name: Observe actual Actions freshness (read-only)
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python -u scripts/collect_workflow_status.py

      - name: 대시보드 최종 생성
        if: steps.collection.outputs.collection_valid == 'true'
        shell: bash
        run: |
          python -u scripts/health_check_v2.py
          python -u scripts/generate_dashboard_runtime.py
          python -u scripts/run_jarvis_agents.py --force
          python -u scripts/build_team_improvement.py

      - name: Validate artifacts
        if: steps.collection.outputs.mode == 'collected'
        id: validate
        shell: bash
        run: |
          python -u scripts/validate_commerce_architecture.py
          python - <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          required = [
              "data/daiso_real/products.json",
              "data/daiso_real/shopify_demand_score.json",
              "data/daiso_real/collection_status.json",
          ]

          ok = True

          for p in required:
              f = Path(p)

              if not f.exists():
                  print("MISSING", p)
                  ok = False
                  continue

              try:
                  data = json.loads(
                      f.read_text(encoding="utf-8")
                  )
                  print("OK", p)

                  if isinstance(data, dict):
                      print(
                          "  keys:",
                          ", ".join(list(data.keys())[:12])
                      )

              except Exception as e:
                  print("INVALID", p, e)
                  ok = False

          products_path = Path("data/daiso_real/products.json")

          if products_path.exists():
              try:
                  products_doc = json.loads(
                      products_path.read_text(encoding="utf-8")
                  )

                  if isinstance(products_doc, dict):
                      products = (
                          products_doc.get("products")
                          or products_doc.get("items")
                          or []
                      )
                  elif isinstance(products_doc, list):
                      products = products_doc
                  else:
                      products = []

                  if not isinstance(products, list):
                      print(
                          "::error::products.json의 상품 목록 구조가 잘못되었습니다."
                      )
                      ok = False
                  else:
                      print(f"PRODUCTS_COUNT={len(products)}")

              except Exception as e:
                  print(
                      "::error::products.json 검증 실패:",
                      e
                  )
                  ok = False

          with open(
              os.environ["GITHUB_OUTPUT"],
              "a",
              encoding="utf-8"
          ) as out:
              out.write(
                  f"artifacts_ok={'true' if ok else 'false'}\n"
              )

          if not ok:
              print("::error::산출물 검증 실패")
              sys.exit(1)

          print("산출물 검증 통과")
          PY

      - name: 발행 전 감사 미리 보기
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          echo '### 다이소 실수집 결과' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

          python - <<'PY' >> "$GITHUB_STEP_SUMMARY" 2>&1
          import json
          from pathlib import Path

          p = Path("data/daiso_real/collection_status.json")

          if p.exists():
              d = json.loads(
                  p.read_text(encoding="utf-8")
              )
              r = d.get("last_run") or {}

              for k in (
                  "requested",
                  "ok",
                  "parse_failed",
                  "status",
                  "queue_size",
                  "url_source",
                  "skipped_not_beauty",
                  "skipped_parked",
                  "finished_at",
              ):
                  print(f"{k}=", r.get(k))
          else:
              print("collection_status.json 없음")
          PY

          python -u scripts/audit_team_reports.py \
            >> "$GITHUB_STEP_SUMMARY" 2>&1 || true

          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Summary
        if: always()
        shell: bash
        run: |
          echo '### 다이소 실수집 + Shopify 수요 점수' >> "$GITHUB_STEP_SUMMARY"

          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path

          files = [
              "data/daiso_real/collection_status.json",
              "data/daiso_real/shopify_demand_score.json",
          ]

          for p in files:
              f = Path(p)

              if not f.exists():
                  print(f"- {p}: 없음")
                  continue

              try:
                  d = json.loads(
                      f.read_text(encoding="utf-8")
                  )
              except Exception as e:
                  print(f"- {p}: 파싱 실패 {e}")
                  continue

              if p.endswith("collection_status.json"):
                  r = d.get("last_run") or {}

                  print(
                      "- 수집: "
                      f"requested={r.get('requested', 0)} / "
                      f"ok={r.get('ok', 0)} / "
                      f"parse_failed={r.get('parse_failed', 0)} / "
                      f"status={r.get('status', '-')}"
                  )

                  print(
                      f"- 최근 시도 완료: {r.get('finished_at', '-')}"
                  )
                  success = d.get("last_success") or {}
                  print(f"- 최근 유효 수집: {success.get('finished_at', '없음')}")
                  if r.get("status") == "no_change":
                      print("- 정상 무변경: 신규 수집 아님, 최근 유효 수집 시각 유지")
                  elif r.get("status") == "candidates_collected":
                      print(f"- 신규 비교 후보 {r.get('candidates_new', 0)}건 · 재확인 {r.get('candidates_updated', 0)}건 · 운영 상품 변경 없음")

              else:
                  if isinstance(d, dict):
                      n = (
                          d.get("total")
                          or d.get("count")
                          or len(
                              d.get(
                                  "products",
                                  d.get("scores", [])
                              )
                          )
                      )
                      print(
                          f"- {p}: {n}건 / "
                          f"updated "
                          f"{d.get('updated_at') or d.get('generated_at') or '-'}"
                      )
                  elif isinstance(d, list):
                      print(
                          f"- {p}: {len(d)}건"
                      )
          PY

      - name: 산출물 발행 (원격 최신 위에 이번 변경만)
        if: steps.collection.outputs.mode == 'collected' && steps.validate.outputs.artifacts_ok == 'true'
        uses: ./.github/actions/publish
        env:
          JARVIS_OPERATIONS_CONTINUITY: ${{ steps.operations_safety.outputs.operations_continuity }}
          JARVIS_SOURCE_CONTINUITY: ${{ steps.source_safety.outputs.continuity }}
        with:
          paths: >-
            data/daiso_real
            data/product_master.json
            data/legal_products.json
            data/legal_full.json
            data/mocra_readiness.json
            data/market_team.json
            data/shopify_marketing_strategy.json
            data/marketing_priority.csv
            data/coaching_loop.json
            data/listing_gate.json
            data/shopify_exports
            data/shopify_action_queue.json
            data/shopify_shortlist.json
            data/shopify_sync_guard.json
            data/dashboard_runtime.json
            data/channel_candidates.json
            data/knowledge/cumulative_history.json
            data/agents
            data/publish_deletions.json
          message: "${{ github.event_name == 'workflow_dispatch' && !inputs.refresh_auxiliary_sources && '다이소 관측 발행 [source-recovery-offline]' || '다이소 실수집 + Shopify 수요 점수 갱신' }}"
          regenerate-dashboard: 'true'
          audit: 'true'

      # 비교 후보·정상 무변경은 별도 후보/관측만 발행한다. 운영 상품/판매 파생 데이터는 발행하지 않는다.
      - name: 정상 무변경 관측 metadata 발행
        if: steps.collection.outputs.mode == 'no_change' || steps.collection.outputs.mode == 'candidates'
        uses: ./.github/actions/publish
        env:
          JARVIS_OPERATIONS_CONTINUITY: ${{ steps.operations_safety.outputs.operations_continuity }}
          JARVIS_SOURCE_CONTINUITY: ${{ steps.source_safety.outputs.continuity }}
        with:
          paths: >-
            data/daiso_real/collection_status.json
            data/daiso_real/crawl_state.json
            data/daiso_real/candidate_pool.json
            data/daiso_real/candidate_pool_history
            data/daiso_real/candidate_observations.json
            data/daiso_real/candidate_comparison.json
            data/daiso_real/shortlist_observations.json
            data/daiso_real/.shortlist_observation_claim.json
            data/agents
            data/publish_deletions.json
            data/dashboard_runtime.json
            data/health_check.json
            data/agents/workflow_freshness.json
            data/agents/ops_plan.json
            data/agents/last_run.json
            data/agents/collector_audit.json
            data/agents/signal_audit.json
            data/agents/score_explain.json
            data/agents/listing_notes.json
            data/team_improvement.json
            data/knowledge/cumulative_history.json
          message: "${{ github.event_name == 'workflow_dispatch' && !inputs.refresh_auxiliary_sources && '다이소 비교 관측 발행 [source-recovery-offline]' || '다이소 신규 비교 후보·관측 발행 (운영 상품 유지)' }}"
          regenerate-dashboard: 'false'
          audit: 'false'

      - name: 수집 시도 진단 보존
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # actions/upload-artifact@v7.0.2
        with:
          name: daiso-attempt-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            data/daiso_real/collection_status.json
            data/daiso_real/candidate_pool.json
            data/daiso_real/candidate_pool_history
            data/daiso_real/candidate_comparison.json
            data/publish_deletions.json
            data/agents/daiso_pipeline_receipts.json
            data/agents/daiso_pipeline_history
          if-no-files-found: warn
          retention-days: 14

      - name: Pack durable source safety even after publication failure
        if: always() && steps.source_safety.outputs.continuity == 'verified'
        run: |
          python -u scripts/source_safety_checkpoint.py pack --root "$GITHUB_WORKSPACE" \
            --output "$RUNNER_TEMP/source-safety.zip" --repository "$GITHUB_REPOSITORY" \
            --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" --commit "$GITHUB_SHA"

      - name: Retain source safety checkpoint
        if: always() && steps.source_safety.outputs.continuity == 'verified'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: source-safety-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/source-safety.zip
          if-no-files-found: error
          retention-days: 14

      - name: Retain immutable operations safety history
        if: always() && steps.operations_safety.outputs.operations_continuity == 'verified'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: operations-safety-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            data/operations/state.json
            data/operations/reports
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3
          compression-level: 9

      - name: 최종 결과
        if: always()
        shell: bash
        run: |
          echo "========================================"
          echo "     JARVIS Daiso Collection 결과"
          echo "========================================"

          if [ -f data/daiso_real/collection_status.json ]; then
            python - <<'PY'
          import json
          from pathlib import Path

          p = Path(
              "data/daiso_real/collection_status.json"
          )

          d = json.loads(
              p.read_text(encoding="utf-8")
          )

          r = d.get("last_run") or {}

          print(
              f"요청: {r.get('requested', 0)}"
          )
          print(
              f"성공: {r.get('ok', 0)}"
          )
          print(
              f"파싱 실패: {r.get('parse_failed', 0)}"
          )
          print(
              f"상태: {r.get('status', '-')}"
          )
          print(
              f"완료: {r.get('finished_at', '-')}"
          )

          reasons = r.get("parse_fail_reasons") or {}

          if reasons:
              print("실패 사유:")
              for k, v in reasons.items():
                  print(f"  - {k}: {v}")
          PY
          else
            echo "collection_status.json 없음"
          fi

          echo "========================================"
