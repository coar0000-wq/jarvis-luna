name: Daiso Real Product Collection

# 다이소몰에서 실제 상품 데이터를 수집합니다.
# robots.txt(Crawl-delay 30)를 지키므로 상품 1건당 약 30초가 걸립니다.
# 한 번에 60건 = 약 30분. 하루 1회 실행합니다.

on:
  schedule:
    - cron: '20 19 * * *'      # 매일 04:20 KST
  workflow_dispatch:
    inputs:
      max_items:
        description: '이번 실행에서 수집할 상품 수'
        required: false
        default: '110'
      delay:
        description: '요청 간 대기 초 (robots.txt 권장 30)'
        required: false
        default: '30'

concurrency:
  group: daiso-real-collection
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Collect
        env:
          DAISO_MAX_ITEMS: ${{ github.event.inputs.max_items || '110' }}
          DAISO_DELAY: ${{ github.event.inputs.delay || '30' }}
        run: python scripts/daiso/collect_daiso.py
        continue-on-error: true

      - name: Report status
        run: |
          echo '### 다이소 실수집 결과' >> $GITHUB_STEP_SUMMARY
          echo '```json' >> $GITHUB_STEP_SUMMARY
          python -c "import json;d=json.load(open('data/daiso_real/collection_status.json',encoding='utf-8'));print(json.dumps(d['last_run'],ensure_ascii=False,indent=2));print(json.dumps(d['totals'],ensure_ascii=False,indent=2))" >> $GITHUB_STEP_SUMMARY || echo 'status file missing' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Commit
        run: |
          git config user.name  "JARVIS LUNA"
          git config user.email "coar0000@naver.com"
          git add data/daiso_real
          git diff --staged --quiet && echo "변경 없음" && exit 0
          git commit -m "다이소 실제 상품 수집 $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase --autostash origin main
          git push origin HEAD:main
