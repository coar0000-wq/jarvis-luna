name: Daiso Real Product Collection

# 다이소몰에서 실제 상품 데이터를 수집한 뒤
# Shopify 수요 점수를 계산하고 저장소에 커밋한다.

on:
  schedule:
    - cron: '20 19 * * *'      # 매일 04:20 KST
  workflow_dispatch:
    inputs:
      max_items:
        description: '이번 실행에서 수집할 상품 수'
        required: false
        default: '110'
      queue_only:
        description: "뷰티 큐 대상 (비우면 허브 전체)"
        required: false
        default: ""
      delay:
        description: '요청 간 대기 초 (robots.txt 권장 30)'
        required: false
        default: '30'

concurrency:
  # 모든 main 자동 발행 워크플로가 공유하는 잠금 그룹
  group: main-publish
  # 동시에 들어온 실행을 최대 100개까지 대기열에 보관한다.
  queue: max
  # 실행 중인 데이터 생성은 중단하지 않고 다음 실행을 대기시킨다.
  cancel-in-progress: false
permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests beautifulsoup4 lxml

      # 환율은 상품 수집과 별개로 돈다. 예전에는 collect_daiso.py 안에
      # 있어서 다이소가 막히면 환율도 같이 멈췄다.
      - name: 환율 갱신 (USD/KRW)
        continue-on-error: true
        timeout-minutes: 3
        run: python -u scripts/fetch_fx_rate.py

      # 뷰티 URL 큐. 실패해도 수집은 사이트맵으로 계속 돈다.
      #
      # 사이트맵을 훑으면 뷰티관 밖 상품을 받아본 뒤 버린다. 한 회차
      # 110건 중 82건이 그랬고 Crawl-delay 30 이라 41분이 버려졌다.
      # Gemini 가 렌더된 뷰티관 페이지를 읽어 상품 URL 만 돌려준다.
      # 이름과 가격은 받지 않는다. 그건 아래 수집 단계가 직접 받는다.
      - name: 뷰티 URL 큐 만들기
        continue-on-error: true
        timeout-minutes: 8
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DAISO_QUEUE_ONLY: ${{ github.event.inputs.queue_only }}
        run: python -u scripts/daiso/build_beauty_queue.py

      - name: Collect Daiso products
        env:
          DAISO_MAX_ITEMS: ${{ github.event.inputs.max_items || '110' }}
          DAISO_DELAY: ${{ github.event.inputs.delay || '30' }}
        run: python scripts/daiso/collect_daiso.py
        continue-on-error: true

      - name: Score Shopify demand
        run: python scripts/daiso/score_shopify_demand.py
        continue-on-error: true

      - name: Validate artifacts
        id: validate
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path

          ok = True
          for p in ("data/daiso_real/products.json",
                    "data/daiso_real/shopify_demand_score.json"):
              f = Path(p)
              if not f.exists():
                  print("MISSING", p); ok = False; continue
              try:
                  json.loads(f.read_text(encoding="utf-8"))
                  print("OK", p)
              except Exception as e:
                  print("INVALID", p, e); ok = False

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"artifacts_ok={'true' if ok else 'false'}\n")
          PY

      - name: Summary
        if: always()
        run: |
          echo '### 다이소 실수집 + Shopify 수요 점수' >> $GITHUB_STEP_SUMMARY
          python - <<'PY' >> $GITHUB_STEP_SUMMARY
          import json
          from pathlib import Path
          for p in ("data/daiso_real/collection_status.json",
                    "data/daiso_real/shopify_demand_score.json"):
              f = Path(p)
              if not f.exists():
                  print(f"- {p}: 없음")
                  continue
              try:
                  d = json.loads(f.read_text(encoding="utf-8"))
              except Exception as e:
                  print(f"- {p}: 파싱 실패 {e}")
                  continue
              if isinstance(d, dict):
                  n = d.get("total") or d.get("count") or len(d.get("products", d.get("scores", [])))
                  print(f"- {p}: {n}건 / updated {d.get('updated_at') or d.get('generated_at') or '-'}")
              else:
                  print(f"- {p}: {len(d)}건")
          PY

      - name: 산출물 발행 (원격 최신 위에 이번 변경만)
        if: steps.validate.outputs.artifacts_ok == 'true'
        uses: ./.github/actions/publish
        with:
          paths: data/daiso_real
          message: 다이소 실수집 + Shopify 수요 점수 갱신

      # 수집 단계가 continue-on-error 라 스크립트가 죽어도 워크플로는
      # 초록으로 끝난다. 실제로 09-06 21:23 실행이 성공으로 보고됐는데
      # collection_status 는 09-05 것 그대로였다. 성공했다고 믿게 된다.
      #
      # 커밋 뒤에 둔다. 기록은 남기고 결과만 빨갛게 만든다.
      - name: 수집이 실제로 일어났는지 확인
        if: always()
        run: |
          python - <<'PY'
          import json, sys
          from datetime import datetime, timezone
          from pathlib import Path
          p = Path("data/daiso_real/collection_status.json")
          if not p.exists():
              print("::error::collection_status.json 이 없다")
              sys.exit(1)
          run = json.loads(p.read_text(encoding="utf-8")).get("last_run") or {}
          started = run.get("started_at") or ""
          if not started:
              print("::error::last_run.started_at 이 없다")
              sys.exit(1)
          age = (datetime.now(timezone.utc)
                 - datetime.fromisoformat(started.replace("Z", "+00:00")))
          hours = age.total_seconds() / 3600
          state = run.get("status", "?")
          print(f"마지막 수집 시각 {started} ({hours:.1f}시간 전) · 상태 {state}")
          if hours > 6 or state not in ("ok",):
              print(f"::error::이번 실행에서 수집이 일어나지 않았다. "
                    f"기록은 {hours:.1f}시간 전 것이고 상태는 {state} 다.")
              sys.exit(1)
          PY

      - name: Skip notice
        if: steps.validate.outputs.artifacts_ok != 'true'
        run: echo "산출물 검증 실패 - 커밋하지 않음" >> $GITHUB_STEP_SUMMARY
