name: Daiso Real Product Collection

# 다이소몰에서 실제 상품 데이터를 수집한 뒤
# Shopify 수요 점수를 자동 계산한다.

on:
  schedule:
    - cron: '20 19 * * *'      # 매일 04:20 KST
  workflow_dispatch:
    inputs:
      max_items:
        description: '이번 실행에서 수집할 상품 수'
        required: false
        default: '110'
      delay:
        description: '요청 간 대기 초 (robots.txt 권장 30)'
        required: false
        default: '30'

concurrency:
  group: daiso-real-collection
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Collect Daiso products
        env:
          DAISO_MAX_ITEMS: ${{ github.event.inputs.max_items || '110' }}
          DAISO_DELAY: ${{ github.event.inputs.delay || '30' }}
        run: python scripts/daiso/collect_daiso.py
        continue-on-error: true

      - name: Score Shopify demand
        run: python scripts/daiso/score_shopify_demand.py

      - name: Report status
        run: |
          echo '### 다이소 실수집 + Shopify 수요 점수' >> $GITHUB_STEP_SUMMARY
          echo '```json' >> $GITHUB_STEP_SUMMARY
          python -c "
          import json
          from pathlib import Path
          st = Path('data/daiso_real/collection_status.json')
          sc = Path('data/daiso_real/shopify_demand_score.json')
          if st.exists():
            d=json.load(open(st,encoding='utf-8'))
