name: Daiso Real Product Collection

# 다이소몰에서 실제 상품 데이터를 수집한 뒤
# Shopify 수요 점수를 계산하고 저장소에 커밋한다.

on:
  schedule:
    - cron: '20 19 * * *'      # 매일 04:20 KST
  workflow_dispatch:
    inputs:
      max_items:
        description: '이번 실행에서 수집할 상품 수'
        required: false
        default: '110'
      delay:
        description: '요청 간 대기 초 (robots.txt 권장 30)'
        required: false
        default: '30'

concurrency:
  group: daiso-real-collection
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests beautifulsoup4 lxml

      - name: Collect Daiso products
        env:
          DAISO_MAX_ITEMS: ${{ github.event.inputs.max_items || '110' }}
          DAISO_DELAY: ${{ github.event.inputs.delay || '30' }}
        run: python scripts/daiso/collect_daiso.py
        continue-on-error: true

      - name: Score Shopify demand
        run: python scripts/daiso/score_shopify_demand.py
        continue-on-error: true

      - name: Validate artifacts
        id: validate
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path

          ok = True
          for p in ("data/daiso_real/products.json",
                    "data/daiso_real/shopify_demand_score.json"):
              f = Path(p)
              if not f.exists():
                  print("MISSING", p); ok = False; continue
              try:
                  json.loads(f.read_text(encoding="utf-8"))
                  print("OK", p)
              except Exception as e:
                  print("INVALID", p, e); ok = False

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"artifacts_ok={'true' if ok else 'false'}\n")
          PY

      - name: Summary
        if: always()
        run: |
          echo '### 다이소 실수집 + Shopify 수요 점수' >> $GITHUB_STEP_SUMMARY
          python - <<'PY' >> $GITHUB_STEP_SUMMARY
          import json
          from pathlib import Path
          for p in ("data/daiso_real/collection_status.json",
                    "data/daiso_real/shopify_demand_score.json"):
              f = Path(p)
              if not f.exists():
                  print(f"- {p}: 없음")
                  continue
              try:
                  d = json.loads(f.read_text(encoding="utf-8"))
              except Exception as e:
                  print(f"- {p}: 파싱 실패 {e}")
                  continue
              if isinstance(d, dict):
                  n = d.get("total") or d.get("count") or len(d.get("products", d.get("scores", [])))
                  print(f"- {p}: {n}건 / updated {d.get('updated_at') or d.get('generated_at') or '-'}")
              else:
                  print(f"- {p}: {len(d)}건")
          PY

      - name: Commit and push
        if: steps.validate.outputs.artifacts_ok == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # 이번 실행이 만든 산출물을 임시 커밋으로 고정
          for pth in data/daiso_real; do
            git add -A -- "$pth" 2>/dev/null || true
          done
          if git diff --cached --quiet; then
            echo "생성된 변경 없음"
            exit 0
          fi
          git commit -q -m "wip"
          MINE=$(git rev-parse HEAD)

          # 원격 최신을 베이스로 두고 그 위에 우리 산출물만 얹는다.
          # rebase 를 쓰지 않으므로 add/add 충돌이 구조적으로 발생하지 않는다.
          # (2026-09-01: rebase 방식이 manual_channels.json 충돌로 계속 실패해 교체)
          for i in 1 2 3 4 5; do
            git fetch -q origin main
            git checkout -q -B publish origin/main
            RESTORED=0
            for pth in data/daiso_real; do
              if git checkout -q "$MINE" -- "$pth" 2>/dev/null; then
                RESTORED=$((RESTORED+1))
              fi
              git add -A -- "$pth" 2>/dev/null || true
            done
            if [ "$RESTORED" -eq 0 ]; then
              echo "산출물 복원 실패 - 중단"
              exit 1
            fi
            if git diff --cached --quiet; then
              echo "원격과 동일 - 푸시 불필요"
              exit 0
            fi
            git commit -q -m "다이소 실수집 + Shopify 수요 점수 갱신"
            if git push -q origin HEAD:main; then
              echo "push 성공 (시도 $i, 복원 경로 ${RESTORED}개)"
              exit 0
            fi
            echo "push 거절됨, 재시도 $i"
            git reset -q --hard "$MINE"
            sleep $((i * 4))
          done
          echo "5회 시도 후 push 실패"
          exit 1
      - name: Skip notice
        if: steps.validate.outputs.artifacts_ok != 'true'
        run: echo "산출물 검증 실패 - 커밋하지 않음" >> $GITHUB_STEP_SUMMARY
