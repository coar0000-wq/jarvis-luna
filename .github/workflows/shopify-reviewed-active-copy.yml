name: Shopify exact Dr.CPU ACTIVE description correction (manual)
on:
  workflow_dispatch:
    inputs:
      review_ticket:
        description: 'Reviewed data/manual/active_copy/tickets/<ticket>/scope.json'
        type: string
        required: true
      apply_copy:
        description: 'false: read-only plan; true: exact reviewed Dr.CPU description only'
        type: boolean
        default: false
        required: true
      expected_plan_digest:
        description: 'Required exact reviewed digest for apply or reconciliation'
        type: string
        default: ''
      reconcile_artifact_id:
        description: 'Prior immutable checkpoint ID; read-only recovery'
        type: string
        default: ''
      reconcile_artifact_digest:
        description: 'Prior checkpoint ZIP SHA256'
        type: string
        default: ''
concurrency:
  group: daiso-daily-beauty-shopify
  cancel-in-progress: false
permissions:
  contents: read
  actions: read
jobs:
  copy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - name: Install pinned verification dependencies
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements/requirements-verification.txt
      - name: Offline regression tests
        run: |
          set -euo pipefail
          python -B - <<'PY'
          import socket, sys, unittest
          def blocked(*a, **k): raise AssertionError('network disabled during tests')
          socket.create_connection = blocked
          socket.socket.connect = blocked
          sys.path.insert(0, 'scripts')
          suite = unittest.TestSuite(unittest.defaultTestLoader.loadTestsFromName(name) for name in (
              'test_plan_draft_product_copy', 'test_apply_reviewed_draft_copy',
              'test_reviewed_draft_copy_workflow', 'test_dr_cpu_active_copy'))
          raise SystemExit(0 if unittest.TextTestRunner().run(suite).wasSuccessful() else 1)
          PY
      - name: Validate bounded inputs
        id: inputs
        env:
          REVIEW_TICKET: ${{ inputs.review_ticket }}
          APPLY_COPY: ${{ inputs.apply_copy }}
          EXPECTED_DIGEST: ${{ inputs.expected_plan_digest }}
          RESTORE_ID: ${{ inputs.reconcile_artifact_id }}
          RESTORE_DIGEST: ${{ inputs.reconcile_artifact_digest }}
        run: |
          set -euo pipefail
          python -B - <<'PY'
          import json, os, pathlib, re, sys
          sys.path.insert(0, 'scripts')
          import dr_cpu_active_copy as copy
          ticket = os.environ['REVIEW_TICKET']
          apply = os.environ['APPLY_COPY'] == 'true'
          restore = os.environ['RESTORE_ID']
          digest = os.environ['EXPECTED_DIGEST']
          if not re.fullmatch(r'[A-Za-z0-9_-]{1,64}', ticket): raise SystemExit('invalid ticket')
          if restore and apply: raise SystemExit('reconciliation is read-only')
          if bool(restore) != bool(os.environ['RESTORE_DIGEST']): raise SystemExit('restore pair required')
          if restore and (not restore.isdigit() or not re.fullmatch(r'[0-9a-f]{64}', os.environ['RESTORE_DIGEST'])):
              raise SystemExit('invalid restore identity')
          if (apply or restore) and not re.fullmatch(r'[0-9a-f]{64}', digest): raise SystemExit('exact digest required')
          path = pathlib.Path('data/manual/active_copy/tickets') / ticket / 'scope.json'
          if path.is_symlink() or not path.is_file(): raise SystemExit('reviewed scope missing')
          scope = json.loads(path.read_text())
          copy.validate_scope(scope, {'product': {'status': 'ACTIVE'}}, copy.utcnow(), expiry=not bool(restore))
          shop = scope.get('canonical_shop','')
          if not re.fullmatch(r'[a-z0-9][a-z0-9-]*\.myshopify\.com', shop): raise SystemExit('invalid shop')
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:
              out.write(f'scope={path.as_posix()}\nshop={shop}\nproduct={scope["product_id"]}\n')
          PY
      - name: Prepare consistent live read-only plan
        id: prepare
        if: ${{ inputs.reconcile_artifact_id == '' }}
        env:
          SCOPE: ${{ steps.inputs.outputs.scope }}
          SHOPIFY_STORE: ${{ secrets.SHOPIFY_STORE }}
          SHOPIFY_ADMIN_TOKEN: ${{ secrets.SHOPIFY_ADMIN_TOKEN }}
          SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          python -B scripts/dr_cpu_active_copy.py prepare --scope "$SCOPE" \
            --read-live --fetch-sources --evidence-root "$RUNNER_TEMP/drcpu-copy-evidence" \
            --output-dir out/drcpu-copy | tee copy-prepare.json
          python -B - <<'PY'
          import json, os
          result = json.load(open('copy-prepare.json'))
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:
              out.write(f'artifact_name={result["artifact_name"]}\n')
          PY
      - name: Check requested plan digest before checkpoint
        if: ${{ inputs.apply_copy }}
        env:
          EXPECTED_DIGEST: ${{ inputs.expected_plan_digest }}
        run: |
          python -B - <<'PY'
          import json, os, sys
          sys.path.insert(0,'scripts')
          from dr_cpu_active_copy import validate_plan_digest
          validate_plan_digest(json.load(open('out/drcpu-copy/plan.json')),os.environ['EXPECTED_DIGEST'])
          PY
      - name: Persist immutable checkpoint before write
        id: checkpoint
        if: ${{ inputs.apply_copy }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.prepare.outputs.artifact_name }}
          path: |
            out/drcpu-copy/plan.json
            out/drcpu-copy/journal.json
          retention-days: 30
          if-no-files-found: error
          overwrite: false
      - name: Apply exact copy once
        if: ${{ inputs.apply_copy }}
        env:
          EXPECTED_DIGEST: ${{ inputs.expected_plan_digest }}
          ARTIFACT_ID: ${{ steps.checkpoint.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.checkpoint.outputs.artifact-digest }}
          GITHUB_TOKEN: ${{ github.token }}
          SHOPIFY_STORE: ${{ secrets.SHOPIFY_STORE }}
          SHOPIFY_ADMIN_TOKEN: ${{ secrets.SHOPIFY_ADMIN_TOKEN }}
          SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          python -B scripts/dr_cpu_active_copy.py execute --apply \
            --plan out/drcpu-copy/plan.json --journal out/drcpu-copy/journal.json \
            --expected-plan-digest "$EXPECTED_DIGEST" --evidence-root "$RUNNER_TEMP/drcpu-copy-evidence" \
            --artifact-id "$ARTIFACT_ID" --artifact-digest "$ARTIFACT_DIGEST" | tee out/drcpu-copy/result.json
      - name: Restore original checkpoint and reconcile without writing
        if: ${{ inputs.reconcile_artifact_id != '' }}
        env:
          EXPECTED_DIGEST: ${{ inputs.expected_plan_digest }}
          ARTIFACT_ID: ${{ inputs.reconcile_artifact_id }}
          ARTIFACT_DIGEST: ${{ inputs.reconcile_artifact_digest }}
          EXPECTED_SHOP: ${{ steps.inputs.outputs.shop }}
          EXPECTED_PRODUCT: ${{ steps.inputs.outputs.product }}
          GITHUB_TOKEN: ${{ github.token }}
          SHOPIFY_STORE: ${{ secrets.SHOPIFY_STORE }}
          SHOPIFY_ADMIN_TOKEN: ${{ secrets.SHOPIFY_ADMIN_TOKEN }}
          SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          mkdir -p out/drcpu-copy
          python -B scripts/dr_cpu_active_copy.py reconcile-artifact \
            --artifact-id "$ARTIFACT_ID" --artifact-digest "$ARTIFACT_DIGEST" \
            --repository "$GITHUB_REPOSITORY" --expected-plan-digest "$EXPECTED_DIGEST" \
            --expected-shop "$EXPECTED_SHOP" --expected-product "$EXPECTED_PRODUCT" \
            | tee out/drcpu-copy/reconcile-result.json
      - name: Preserve results including failures (no supplier image binaries)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: drcpu-copy-result-${{ github.run_id }}-${{ github.run_attempt }}
          path: out/drcpu-copy/*.json
          retention-days: 30
          if-no-files-found: warn
