name: SerpApi 미국 시장가·트렌드·YouTube 수집

# 무료 플랜 월 250회를 용도별로 나눠 쓴다.
#   market  상한 200 (S등급 상품 + 키워드 8)
#   youtube 상한 45
# 둘을 합쳐 245 로 250 안쪽이다.
#
# 실측: 09-05 실행 22회, 09-06 실행 13회. S등급 개수에 따라 달라진다.
# 지금 S 가 5개라 회당 13회쯤 든다. 주 2회면 한 달 117회다.
#
# 주 1회에서 주 2회로 늘렸다. 깃허브가 스케줄을 부하에 따라 걸러내는데
# Deep Analysis 는 30분 설정에 실측 132분이었다. 하루 48회짜리는 걸러져도
# 몇 번은 돌지만 주 1회짜리는 한 번 걸러지면 그 주가 통째로 빈다.
# 실제로 09-05 에 크론을 걸었는데 스케줄 실행이 한 번도 없었다.
#
# youtube.com/robots.txt 가 RSS 를 막아 SerpApi 로 우회한다.
on:
  schedule:
    - cron: "0 20 * * 1,4"    # 매주 화·금요일 05:00 KST
  workflow_dispatch:
    inputs:
      only:
        description: "prices / trends / 비우면 둘 다"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: serpapi-market
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 예전에는 "호출 없이 종료한다" 고 찍기만 하고 그대로 다음 단계로
      # 넘어갔다. 말과 동작이 달랐다. 키가 없으면 실제로 멈춘다.
      # 멈추기 전에 사유를 파일에 남겨서 대시보드가 이유를 알 수 있게 한다.
      - name: 시크릿 확인
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: |
          if [ -n "$SERPAPI_KEY" ]; then
            echo "SERPAPI_KEY 확인됨 (길이 ${#SERPAPI_KEY})"
            exit 0
          fi
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          p = Path("data/serpapi_market.json")
          try:
              d = json.loads(p.read_text(encoding="utf-8"))
          except (OSError, json.JSONDecodeError):
              d = {}
          d["blocked"] = {
              "at": datetime.now(timezone.utc).isoformat(),
              "reason": "SERPAPI_KEY 가 저장소 Secrets 에 없다",
              "fix": "Settings > Secrets and variables > Actions 에 SERPAPI_KEY 등록",
          }
          p.parent.mkdir(parents=True, exist_ok=True)
          p.write_text(json.dumps(d, ensure_ascii=False, indent=2) + "\n",
                       encoding="utf-8")
          PY
          echo "::error::SERPAPI_KEY 가 없다. 호출하지 않고 여기서 멈춘다."
          exit 1

      - name: 수집
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: |
          if [ -n "${{ github.event.inputs.only }}" ]; then
            python scripts/collect_serpapi_market.py --only=${{ github.event.inputs.only }}
          else
            python scripts/collect_serpapi_market.py
          fi

      # YouTube. 같은 원장을 쓰고 용도별 상한(youtube 30/월)이 따로 있다.
      - name: YouTube 검색 수집
        continue-on-error: true
        timeout-minutes: 5
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: python -u scripts/collect_serpapi_youtube.py

      - name: 결과 요약
        run: |
          python - <<'PY' >> $GITHUB_STEP_SUMMARY
          import json
          from pathlib import Path
          d = json.loads(Path("data/serpapi_market.json").read_text(encoding="utf-8"))
          u = d.get("usage") or {}
          print("## SerpApi 수집\n")
          print(f"- 플랜: {d.get('plan','')}")
          print(f"- 이번 실행 {u.get('spent_this_run','?')}회 · 이번 달 {u.get('used','?')}/{u.get('cap','?')}")
          for k in ("prices", "trends"):
              b = d.get(k) or {}
              print(f"- {k}: {b.get('status')} {b.get('count', 0)}건"
                    + (f" · 실패 {len(b.get('failures') or [])}건" if b.get("failures") else ""))
          try:
              y = json.loads(Path("data/youtube_serpapi.json").read_text(encoding="utf-8"))
              bud = y.get("예산") or {}
              print(f"- youtube: 영상 {y.get('video_count', 0)}건 · "
                    f"예산 {bud.get('youtube_used','?')}/{bud.get('youtube_cap','?')}")
              bm = y.get("bucket_mentions") or {}
              if bm:
                  print("  - 상품군: " + ", ".join(f"{k} {v}" for k, v in
                                                 sorted(bm.items(), key=lambda x: -x[1])[:5]))
          except (OSError, json.JSONDecodeError, KeyError):
              print("- youtube: 산출물 없음")
          PY

      - name: 커밋 및 푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # youtube_serpapi.json 을 빠뜨려서 첫 실행 때 5회를 쓰고도
          # 산출물이 저장되지 않았다. 새 파일을 추가하면 여기도 같이 고쳐야 한다.
          git add -A data/serpapi_market.json data/serpapi_usage.json \
                     data/youtube_serpapi.json 2>/dev/null || true
          if git diff --cached --quiet; then echo "변경 없음"; exit 0; fi
          git commit -q -m "SerpApi 미국 시장가·트렌드·YouTube 수집"
          for i in 1 2 3; do
            git fetch -q origin main
            git rebase -X ours origin/main >/dev/null 2>&1 || git rebase --abort || true
            if git push -q origin HEAD:main; then echo "푸시 성공"; exit 0; fi
            sleep 5
          done
          echo "푸시 실패"; exit 1
