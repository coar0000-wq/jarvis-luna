name: Shopify 영문 리스팅 카피 생성

# S등급 다이소 상품(실크롤링)의 한국어 상품명을 Gemini 로 영문 카피로 바꾸고
# Shopify 상품 임포트 CSV 를 만든다.
#
# 필요한 시크릿: GEMINI_API_KEY  (Google AI Studio 키)
# 없으면 실행하지 않고 안내만 남긴다. 가짜 카피를 만들지 않는다.

on:
  workflow_dispatch:
    inputs:
      bundle:
        description: '배송비 분담 전제 (1개_묶음배송 / 3개_묶음배송 / 5개_묶음배송)'
        required: false
        default: '5개_묶음배송'
      vendor:
        description: 'Shopify Vendor 명'
        required: false
        default: 'MD family'

concurrency:
  group: shopify-listing-copy
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 시크릿 확인
        id: guard
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "GEMINI_API_KEY 시크릿이 없습니다." >> $GITHUB_STEP_SUMMARY
            echo "Settings > Secrets and variables > Actions 에서 등록하세요." >> $GITHUB_STEP_SUMMARY
            echo "ready=false" >> $GITHUB_OUTPUT
          else
            echo "ready=true" >> $GITHUB_OUTPUT
          fi

      - name: 환율 갱신
        if: steps.guard.outputs.ready == 'true'
        continue-on-error: true
        run: python -c "import sync_channels as s; s.fetch_and_update_fx_status()"

      - name: OliveYoung US 시장가 수집
        if: steps.guard.outputs.ready == 'true'
        continue-on-error: true
        run: python scripts/collect_oliveyoung_us.py

      - name: 실배송 원가 모델 계산
        if: steps.guard.outputs.ready == 'true'
        run: python scripts/pricing_model.py

      - name: Gemini 영문 카피 생성
        if: steps.guard.outputs.ready == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: python scripts/gemini_listing_copy.py

      - name: Shopify 임포트 CSV 생성
        if: steps.guard.outputs.ready == 'true'
        env:
          SHOPIFY_BUNDLE: ${{ github.event.inputs.bundle || '5개_묶음배송' }}
          SHOPIFY_VENDOR: ${{ github.event.inputs.vendor || 'MD family' }}
        run: python scripts/build_shopify_import_csv.py

      - name: 결과 요약
        if: steps.guard.outputs.ready == 'true'
        run: |
          python - <<'PY' >> $GITHUB_STEP_SUMMARY
          import json, csv
          from pathlib import Path
          d = json.loads(Path("data/shopify_listing_copy.json").read_text(encoding="utf-8"))
          print(f"### 영문 카피 {d['ok']}/{d['total']}건 생성 (모델 {d.get('model','?')})\n")
          rows = list(csv.DictReader(open("data/shopify_import.csv", encoding="utf-8")))
          print(f"Shopify 임포트 CSV: {len(rows)}행\n")
          print("| 한국어 원본 | 영문 제목 | 판매가 | 착지원가 | 순익 |")
          print("|---|---|---|---|---|")
          idx = {r["SKU"]: r for r in rows}
          for it in d["items"]:
              c = it.get("copy")
              r = idx.get(f"DAISO-{it['pd_no']}")
              if c and r:
                  s_, c_ = float(r["Price"]), float(r["Cost per item"])
                  net = s_ - c_ - (s_ * 0.029 + 0.06)
                  print(f"| {it['name_ko']} | {c['title']} | ${s_:.2f} | ${c_:.2f} | ${net:+.2f} |")
              elif c:
                  print(f"| {it['name_ko']} | {c['title']} | 제외됨 | - | - |")
              else:
                  print(f"| {it['name_ko']} | 실패: {it.get('error','')[:50]} | - | - | - |")
          rep = json.loads(Path("data/shopify_import_report.json").read_text(encoding="utf-8"))
          print(f"\n환율 {rep['exchange_rate']}\n")
          print(f"원가 모델: {rep['pricing_model']}\n")
          print(f"{rep['가격_근거']}\n")
          print("게시 전 확인사항")
          for x in rep["게시전_확인사항"]:
              print(f"- {x}")
          PY

      # 2026-09-09: 커밋 블록을 .github/actions/publish 로 옮겼다.
      #   전에는 이랬다.
      #     git checkout -B publish origin/main
      #     git checkout $MINE -- <경로>
      #   원격 최신을 베이스로 두는 것까지는 맞다. 그런데 둘째 줄이
      #   경로 전체를 자기 스냅샷으로 덮어서, 내가 건드리지도 않은 파일을
      #   내 실행이 시작할 때 값으로 되돌렸다.
      #
      #   실제로 그 일이 났다. Deep Analysis #443 이 만든 45개 파일을
      #   같은 방식으로 만든 커밋 하나가 통째로 되돌렸다.
      #   이 워크플로는 2시간마다 도니까 그럴 기회가 하루 열두 번 있다.
      #
      #   이제 이번 실행이 실제로 바꾼 파일만 얹는다. 대시보드는
      #   밀어넣을 그 트리에서 다시 만들고, 감사도 거기서 돌린다.
      - name: 산출물 발행 (원격 최신 위에 이번 변경만)
        uses: ./.github/actions/publish
        with:
          paths: data/shopify_listing_copy.json data/shopify_import.csv data/shopify_import_report.json data/pricing_model.json data/daiso_real/collection_status.json
          message: Shopify 영문 리스팅 카피 및 임포트 CSV 갱신

