name: Shopify 영문 리스팅 카피 생성

# S등급 다이소 상품(실크롤링)의 한국어 상품명을 Gemini 로 영문 카피로 바꾸고
# Shopify 상품 임포트 CSV 를 만든다.
#
# 필요한 시크릿: GEMINI_API_KEY  (Google AI Studio 키)
# 없으면 실행하지 않고 안내만 남긴다. 가짜 카피를 만들지 않는다.

on:
  workflow_dispatch:
    inputs:
      bundle:
        description: '배송비 분담 전제 (1개_묶음배송 / 3개_묶음배송 / 5개_묶음배송)'
        required: false
        default: '5개_묶음배송'
      vendor:
        description: 'Shopify Vendor 명'
        required: false
        default: 'MD family'

concurrency:
  group: shopify-listing-copy
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 시크릿 확인
        id: guard
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "GEMINI_API_KEY 시크릿이 없습니다." >> $GITHUB_STEP_SUMMARY
            echo "Settings > Secrets and variables > Actions 에서 등록하세요." >> $GITHUB_STEP_SUMMARY
            echo "ready=false" >> $GITHUB_OUTPUT
          else
            echo "ready=true" >> $GITHUB_OUTPUT
          fi

      - name: 환율 갱신
        if: steps.guard.outputs.ready == 'true'
        continue-on-error: true
        run: python -c "import sync_channels as s; s.fetch_and_update_fx_status()"

      - name: OliveYoung US 시장가 수집
        if: steps.guard.outputs.ready == 'true'
        continue-on-error: true
        run: python scripts/collect_oliveyoung_us.py

      - name: 실배송 원가 모델 계산
        if: steps.guard.outputs.ready == 'true'
        run: python scripts/pricing_model.py

      - name: Gemini 영문 카피 생성
        if: steps.guard.outputs.ready == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: python scripts/gemini_listing_copy.py

      - name: Shopify 임포트 CSV 생성
        if: steps.guard.outputs.ready == 'true'
        env:
          SHOPIFY_BUNDLE: ${{ github.event.inputs.bundle || '5개_묶음배송' }}
          SHOPIFY_VENDOR: ${{ github.event.inputs.vendor || 'MD family' }}
        run: python scripts/build_shopify_import_csv.py

      - name: 결과 요약
        if: steps.guard.outputs.ready == 'true'
        run: |
          python - <<'PY' >> $GITHUB_STEP_SUMMARY
          import json, csv
          from pathlib import Path
          d = json.loads(Path("data/shopify_listing_copy.json").read_text(encoding="utf-8"))
          print(f"### 영문 카피 {d['ok']}/{d['total']}건 생성 (모델 {d.get('model','?')})\n")
          rows = list(csv.DictReader(open("data/shopify_import.csv", encoding="utf-8")))
          print(f"Shopify 임포트 CSV: {len(rows)}행\n")
          print("| 한국어 원본 | 영문 제목 | 판매가 | 착지원가 | 순익 |")
          print("|---|---|---|---|---|")
          idx = {r["SKU"]: r for r in rows}
          for it in d["items"]:
              c = it.get("copy")
              r = idx.get(f"DAISO-{it['pd_no']}")
              if c and r:
                  s_, c_ = float(r["Price"]), float(r["Cost per item"])
                  net = s_ - c_ - (s_ * 0.029 + 0.06)
                  print(f"| {it['name_ko']} | {c['title']} | ${s_:.2f} | ${c_:.2f} | ${net:+.2f} |")
              elif c:
                  print(f"| {it['name_ko']} | {c['title']} | 제외됨 | - | - |")
              else:
                  print(f"| {it['name_ko']} | 실패: {it.get('error','')[:50]} | - | - | - |")
          rep = json.loads(Path("data/shopify_import_report.json").read_text(encoding="utf-8"))
          print(f"\n환율 {rep['exchange_rate']}\n")
          print(f"원가 모델: {rep['pricing_model']}\n")
          print(f"{rep['가격_근거']}\n")
          print("게시 전 확인사항")
          for x in rep["게시전_확인사항"]:
              print(f"- {x}")
          PY

      - name: 커밋 및 푸시
        if: steps.guard.outputs.ready == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # 이번 실행이 만든 산출물을 임시 커밋으로 고정
          for pth in data/shopify_listing_copy.json data/shopify_import.csv data/shopify_import_report.json data/pricing_model.json data/daiso_real/collection_status.json; do
            git add -A -- "$pth" 2>/dev/null || true
          done
          if git diff --cached --quiet; then
            echo "생성된 변경 없음"
            exit 0
          fi
          git commit -q -m "wip"
          MINE=$(git rev-parse HEAD)

          # 원격 최신을 베이스로 두고 그 위에 우리 산출물만 얹는다.
          # rebase 를 쓰지 않으므로 add/add 충돌이 구조적으로 발생하지 않는다.
          # (2026-09-01: rebase 방식이 manual_channels.json 충돌로 계속 실패해 교체)
          for i in 1 2 3 4 5; do
            git fetch -q origin main
            git checkout -q -B publish origin/main
              RESTORED=0
              for pth in data/shopify_listing_copy.json data/shopify_import.csv data/shopify_import_report.json data/pricing_model.json data/daiso_real/collection_status.json; do
                # git checkout <커밋> -- 경로 는 덮어쓰기만 하고 그 커밋에 없는 파일을
                # 지우지 않는다. 그래서 재생성형 폴더(obsidian/Records 등)에 옛 파일이
                # 무한히 쌓였다. 2026-09-04 확인: 1,113개여야 할 노트가 18,174개.
                # 먼저 지우고 통째로 복원한다.
                if git cat-file -e "$MINE:$pth" 2>/dev/null || git ls-tree -d "$MINE" "$pth" >/dev/null 2>&1; then
                  rm -rf "$pth"
                fi
                if git checkout -q "$MINE" -- "$pth" 2>/dev/null; then
                  RESTORED=$((RESTORED+1))
                fi
                git add -A -- "$pth" 2>/dev/null || true
              done
            if [ "$RESTORED" -eq 0 ]; then
              echo "산출물 복원 실패 - 중단"
              exit 1
            fi
            if git diff --cached --quiet; then
              echo "원격과 동일 - 푸시 불필요"
              exit 0
            fi
            git commit -q -m "Shopify 영문 리스팅 카피 및 임포트 CSV 갱신"
            if git push -q origin HEAD:main; then
              echo "push 성공 (시도 $i, 복원 경로 ${RESTORED}개)"
              exit 0
            fi
            echo "push 거절됨, 재시도 $i"
            git reset -q --hard "$MINE"
            sleep $((i * 4))
          done
          echo "5회 시도 후 push 실패"
          exit 1