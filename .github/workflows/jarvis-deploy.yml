name: JARVIS LUNA - Automatic Deployment & Evolution

on:
  schedule:
    - cron: '0 * * * *'  # 매시간 실행
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  jarvis-evolution:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests feedparser aiohttp

    - name: JARVIS Data Collection
      env:
        GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      run: |
        python scripts/jarvis_data_collection.py

    - name: Generate Performance Report
      run: |
        python scripts/generate_metrics.py

    - name: Update Dashboard
      run: |
        python scripts/update_dashboard.py

    - name: Generate Dashboard Visualization
      run: |
        mkdir -p data
        python -c "
import json
from datetime import datetime

# 대시보드 데이터 로드
try:
    with open('data/dashboard_data.json', 'r') as f:
        data = json.load(f)
except:
    data = {}

# 시간대별 통계 기록
stats = {
    'timestamp': datetime.now().isoformat(),
    'metrics': data
}

# 일일 통계 누적
try:
    with open('data/daily_dashboard_log.json', 'r') as f:
        log = json.load(f)
except:
    log = []

log.append(stats)
# 최근 24시간만 유지
log = log[-24:]

with open('data/daily_dashboard_log.json', 'w') as f:
    json.dump(log, f, indent=2)

print('✓ Dashboard visualization generated')
"

    - name: Commit & Push
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "JARVIS LUNA"
        git add -A
        git commit -m "🤖 JARVIS Evolution: $(date '+%Y-%m-%d %H:%M:%S')" || exit 0
        git push

    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./
        cname: ""
        force_orphan: false
        commit_message: "🌐 JARVIS Dashboard: $(date '+%Y-%m-%d %H:%M:%S')"

  jarvis-analysis:
    runs-on: ubuntu-latest
    needs: jarvis-evolution

    steps:
    - uses: actions/checkout@v3

    - name: Run Performance Analysis
      run: |
        python scripts/analyze_performance.py

    - name: Generate Evolution Report
      run: |
        python scripts/generate_evolution_report.py

    - name: Update Obsidian Integration
      run: |
        python scripts/sync_obsidian.py

  jarvis-notification:
    runs-on: ubuntu-latest
    needs: jarvis-analysis
    if: always()

    steps:
    - uses: actions/checkout@v3

    - name: Send Status Report
      run: |
        echo "JARVIS LUNA Status Report"
        echo "=========================="
        echo "Execution Time: $(date)"
        echo "Status: Success"
