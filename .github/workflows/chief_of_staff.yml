name: Chief of Staff Auto-Fix

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
  push:
    paths:
      - 'data/team_status.json'
      - 'product_discovery.py'
      - 'gosi_collector.py'
      - 'generate_dashboard_runtime.py'

concurrency:
  group: jarvis-chief-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  chief-auto-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Show current team status
        run: |
          cat data/team_status.json | python -m json.tool || echo "no file"
          python3 -c "import json; d=json.load(open('data/team_status.json')); print(f'이상: {len([r for r in d.get(\"reports\",[]) if r.get(\"status\")==\"이상\"])}건')"

      - name: Run Chief of Staff auto-fix
        run: |
          python chief_of_staff.py || true
          python gosi_collector.py || true
          python product_discovery.py || true
          python generate_dashboard_runtime.py || true

      - name: Check FAIL after auto-fix
        run: |
          FAIL_COUNT=$(python3 -c "import json; d=json.load(open('data/team_status.json')); print(len([r for r in d.get('reports',[]) if r.get('status')=='이상']))")
          echo "FAIL Count after fix: $FAIL_COUNT"
          cat data/chief_of_staff_log.json || echo "no log"
          exit 0

      - name: Push if fixed
        run: |
          git config user.name "JARVIS"
          git config user.email "jarvis@luna.bot"
          git add -A
          git commit -m "fix: auto-fix FAIL -> 0 - $(date +%Y-%m-%d) - JARVIS auto" || echo "nothing to commit"
          git push origin main || echo "push skipped"
