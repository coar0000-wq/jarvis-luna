name: Chief of Staff Auto-Fix

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

concurrency:
  group: jarvis-main-writer-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  chief-auto-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Show current team status
        run: |
          if [ -f data/team_status.json ]; then
            cat data/team_status.json | python -m json.tool || true
            python3 - <<'PY'
          import json

          with open("data/team_status.json", "r", encoding="utf-8") as f:
              d = json.load(f)

          fail_count = len([
              r for r in d.get("reports", [])
              if r.get("status") == "이상"
          ])

          print(f"이상: {fail_count}건")
          PY
          else
            echo "data/team_status.json not found"
          fi

      - name: Run Chief of Staff auto-fix
        run: |
          python chief_of_staff.py || true
          python gosi_collector.py || true
          python product_discovery.py || true
          python generate_dashboard_runtime.py || true

      - name: Check FAIL after auto-fix
        run: |
          if [ -f data/team_status.json ]; then
            python3 - <<'PY'
          import json

          with open("data/team_status.json", "r", encoding="utf-8") as f:
              d = json.load(f)

          fail_count = len([
              r for r in d.get("reports", [])
              if r.get("status") == "이상"
          ])

          print(f"FAIL Count after fix: {fail_count}")
          PY
          else
            echo "data/team_status.json not found"
          fi

          cat data/chief_of_staff_log.json || echo "no log"

      - name: Commit and push fixed data
        run: |
          git config user.name "JARVIS"
          git config user.email "jarvis@luna.bot"

          git add -A

          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi

          git commit -m "fix: auto-fix FAIL - $(date +%Y-%m-%d) - JARVIS auto"

          git fetch origin main

          git rebase origin/main

          git push origin HEAD:main
