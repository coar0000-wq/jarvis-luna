name: 참모장 자동 수정

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

# 자동 발행 작업은 한 번에 하나만 실행한다.
# 새 실행은 기존 실행이 끝날 때까지 대기한다.
concurrency:
  group: main-publish
  cancel-in-progress: false

jobs:
  chief-auto-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip

      - name: 최신 main 동기화
        shell: bash
        run: |
          git fetch origin main
          git reset --hard origin/main
          git clean -fd

      # 규칙을 바꿨으면 이미 쌓인 자료도 그 규칙으로 맞춘다 (2026-09-13)
      #
      # 2026-09-13 에 FDA 의약품 네 갈래를 category_map.json 의 exclude 에
      # 넣었다. 불소치약·구강, 항균세정, 비듬·탈모, 땀억제데오 다.
      # 큐는 그 규칙으로 걸렀는데 이미 수집된 products.json 222건은 그대로 뒀다.
      #
      # 그래서 푸시 직전 감사가 막았다.
      #   FAIL 제외 대상이 상품 목록에 10건 남아 있다
      #   Error: 원격 main에는 아직 푸시하지 않는다
      # 워크플로 네 개가 전부 그 관문에서 멈췄다.
      #
      # 규칙 바꾸는 사람과 자료 쌓는 기계가 따로 놀면 같은 일이 또 난다.
      # 그래서 매 회차에 사전으로 한 번 훑는다.
      #
      # 지울 목록을 여기 적지 않는다. category_map.json 을 읽어 거른다.
      # 사전을 고치면 이 단계가 알아서 따라간다.
      # 걸리는 것이 없으면 파일을 건드리지 않으므로 빈 커밋이 안 생긴다.
      - name: 제외 규칙으로 상품 목록 정리
        shell: bash
        run: |
          python -u scripts/daiso/prune_excluded_products.py --apply

          # 목록이 실제로 바뀌었을 때만 점수를 다시 낸다.
          # 매번 다시 내면 generated_at 만 바뀐 커밋이 30분마다 쌓인다.
          if ! git diff --quiet -- data/daiso_real/products.json; then
            echo "상품 목록이 바뀌었다. 점수를 다시 계산한다."
            python -u scripts/daiso/score_shopify_demand.py
          else
            echo "걸린 상품이 없다. 점수는 그대로 둔다."
          fi

      - name: 등록 게이트 1차 재계산
        shell: bash
        run: |
          python scripts/build_listing_gate.py

          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("data/listing_gate.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          counts = data.get("counts") or {}

          print("===== 현재 등록 게이트 =====")
          print(f"S등급 전체 : {data.get('total', 0)}")
          print(f"등록 가능  : {data.get('ready', 0)}")
          print(f"카피       : {counts.get('copy', 0)}")
          print(f"고시       : {counts.get('gosi', 0)}")
          print(f"가격       : {counts.get('price', 0)}")
          print(f"법률       : {counts.get('legal', 0)}")
          print(f"병목       : {data.get('blockers') or {}}")
          print("============================")
          PY

      - name: Shopify 카피 자동 보완
        shell: bash
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          NEED_COPY=$(python - <<'PY'
          import json
          from pathlib import Path

          try:
              data = json.loads(
                  Path("data/listing_gate.json").read_text(
                      encoding="utf-8"
                  )
              )
              print(
                  1 if (data.get("blockers") or {}).get("copy", 0) > 0
                  else 0
              )
          except Exception:
              print(0)
          PY
          )

          if [ "$NEED_COPY" = "1" ]; then
            echo "카피 병목 발견"
            if [ -z "${GEMINI_API_KEY:-}" ]; then
              echo "::warning::GEMINI_API_KEY가 없어 카피 보완을 건너뜁니다."
            else
              python -u scripts/gemini_listing_copy.py || true
            fi
          else
            echo "카피 병목 없음"
          fi

      - name: 고시 정보 수집 및 라벨 동기화
        shell: bash
        run: |
          NEED_GOSI=$(python - <<'PY'
          import json
          from pathlib import Path

          try:
              data = json.loads(
                  Path("data/listing_gate.json").read_text(
                      encoding="utf-8"
                  )
              )
              print(
                  1 if (data.get("blockers") or {}).get("gosi", 0) > 0
                  else 0
              )
          except Exception:
              print(1)
          PY
          )

          if [ "$NEED_GOSI" = "1" ]; then
            echo "고시 병목 발견"

            # 고시 수집기는 data/gosi.json을 갱신한다.
            python -u scripts/collect_daiso_gosi.py || true

            # 수집 결과를 data/daiso_real/daiso_us_labels.json에 병합한다.
            python -u scripts/sync_gosi_to_us_labels.py

            if [ -n "${GEMINI_API_KEY:-}" ]; then
              echo "Gemini 비전 추출 시작"
              VISION_BUDGET_SEC=900 \
                python -u scripts/extract_gosi_vision.py || true

              # 비전 추출 이후 추가된 값도 다시 병합한다.
              python -u scripts/sync_gosi_to_us_labels.py
            else
              echo "::warning::GEMINI_API_KEY가 없어 비전 추출을 건너뜁니다."
            fi
          else
            echo "고시 병목 없음"
          fi

      - name: 법률 자동 점검 갱신
        shell: bash
        run: |
          python -u scripts/check_legal_products.py

      - name: 등록 게이트 최종 재계산
        shell: bash
        run: |
          python scripts/build_listing_gate.py

          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(
              Path("data/listing_gate.json").read_text(
                  encoding="utf-8"
              )
          )
          counts = data.get("counts") or {}

          print("===== 최종 등록 게이트 =====")
          print(f"등록 가능 {data.get('ready', 0)}/{data.get('total', 0)}")
          print(
              f"카피 {counts.get('copy', 0)} / "
              f"고시 {counts.get('gosi', 0)} / "
              f"가격 {counts.get('price', 0)} / "
              f"법률 {counts.get('legal', 0)}"
          )
          print(f"병목: {data.get('blockers') or {}}")
          print("============================")
          PY

      - name: 대시보드 최종 생성
        shell: bash
        run: |
          python scripts/generate_dashboard_runtime.py

      - name: 변경사항 확인 (기록용)
        shell: bash
        run: |
          echo "===== 작업 폴더 상태 ====="
          git status --short
          echo "=========================="

      # 손으로 만든 커밋·푸시 루프를 발행 액션으로 바꿨다 (2026-09-13)
      #
      # 이 워크플로만 자기 루프를 갖고 있었다. 나머지 아홉 개는
      # .github/actions/publish 를 쓴다. 그 액션은 정확히 이 문제를
      # 풀려고 만든 것이다. 원격이 움직이는 중에 발행하는 문제다.
      #
      # 증상은 이랬다. 실행은 30분(실제로는 스로틀링되어 2~3시간)마다
      # 성공으로 끝나는데 커밋이 09-13 00:32 이후로 끊겼다.
      # 09:30 실행 로그를 보면 변경 6개와 새 이미지 10장이 스테이징됐는데
      # Commit & Push 단계가 2초 만에 끝나고 커밋이 남지 않았다.
      #
      # 옛 루프의 문제는 두 가지였다.
      #
      #   푸시가 거절되면 reset --hard 로 원격을 받은 뒤 스크립트를 다시
      #   돌린다. 그런데 그 사이 다른 워크플로가 같은 스크립트를 이미
      #   돌려 같은 결과를 올려 놨으면 "변경사항 없음" 으로 조용히 끝난다.
      #   이번 회차가 한 일이 통째로 사라지고 로그에는 성공만 남는다.
      #
      #   무슨 일이 있었는지 로그에 거의 안 남는다. 그래서 위 증상을
      #   눈으로 보고도 원인을 못 짚었다. 추측만 두 번 틀렸다.
      #
      # 발행 액션은 다르다. 이번 실행이 기준 커밋 대비 바꾼 파일만
      # 골라서 최신 원격 위에 얹는다. 남이 바꾼 것은 안 건드린다.
      # 몇 개를 얹었는지, 푸시가 됐는지 로그에 찍는다.
      # 화장품 고시 보호도 그 안에 들어 있다.
      - name: 산출물 발행 (원격 최신 위에 이번 변경만)
        if: always()
        uses: ./.github/actions/publish
        with:
          paths: >-
            data/listing_gate.json
            data/shopify_listing_copy.json
            data/gosi.json
            data/daiso_real/daiso_us_labels.json
            data/daiso_real/us_label_sync_report.json
            data/legal_products.json
            data/daiso_real/gosi_img
            data/daiso_real/products.json
            data/daiso_real/excluded_products.json
            data/daiso_real/shopify_demand_score.json
            data/daiso_real/shopify_s_recommendations.json
          message: 참모장 · 고시 라벨과 등록 게이트 갱신

      - name: 최종 요약
        if: always()
        shell: bash
        run: |
          if [ -f data/listing_gate.json ]; then
            python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(
              Path("data/listing_gate.json").read_text(
                  encoding="utf-8"
              )
          )

          print("===================================")
          print("       JARVIS 참모장 최종 보고")
          print("===================================")
          print(
              f"등록 가능: {data.get('ready', 0)}/{data.get('total', 0)}"
          )
          print(f"병목: {data.get('blockers') or {}}")

          for item in data.get("items") or []:
              if item.get("blocked_by"):
                  print(
                      f"- {item.get('pd_no')} "
                      f"{item.get('name')}: "
                      f"{', '.join(item.get('blocked_by') or [])}"
                  )

          print("===================================")
          PY
          else
            echo "listing_gate.json 없음"
          fi
