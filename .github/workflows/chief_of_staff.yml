name: 참모장 자동 수정

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

jobs:
  chief-auto-fix:
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip

      - name: Auto Fix 실행
        run: |
          python scripts/generate_dashboard_runtime.py || true

      - name: Commit & Push (JSON 충돌 자동 해결)
        shell: bash
        run: |
          git config user.name "JARVIS"
          git config user.email "actions@github.com"

          git add .

          if git diff --cached --quiet; then
            echo "변경사항 없음"
            exit 0
          fi

          git commit -m "fix: auto-fix $(date +'%Y-%m-%d %H:%M')"

          git fetch origin main

          # 충돌이 자주 나는 생성 파일은 항상 원격 최신 사용
          git checkout origin/main -- dashboard_runtime.json || true
          git checkout origin/main -- data/gosi.json || true
          git checkout origin/main -- data/products.json || true

          git add dashboard_runtime.json data/gosi.json data/products.json

          git rebase origin/main || {
            git rebase --abort
            echo "Rebase 충돌 → 원격 기준으로 재시도"

            git reset --soft HEAD~1

            git checkout origin/main -- dashboard_runtime.json
            git checkout origin/main -- data/gosi.json
            git checkout origin/main -- data/products.json

            git add .
            git commit -m "fix: auto-fix $(date +'%Y-%m-%d %H:%M')"
          }

          git push origin HEAD:main
