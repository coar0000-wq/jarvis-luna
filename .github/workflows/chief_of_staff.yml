name: 참모장 자동 수정

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

# 자동 발행 작업은 한 번에 하나만 실행한다.
# 새 실행은 기존 실행이 끝날 때까지 대기한다.
concurrency:
  group: main-publish
  cancel-in-progress: false

jobs:
  chief-auto-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip

      - name: 최신 main 동기화
        shell: bash
        run: |
          git fetch origin main
          git reset --hard origin/main
          git clean -fd

      # 규칙을 바꿨으면 이미 쌓인 자료도 그 규칙으로 맞춘다 (2026-09-13)
      #
      # category_map.json의 exclude 규칙을 기준으로
      # 이미 쌓인 상품도 매 회차 감사한다.
      # 걸리는 것이 없으면 파일을 건드리지 않는다.
      - name: 제외 규칙으로 상품 목록 정리
        shell: bash
        run: |
          python -u scripts/daiso/prune_excluded_products.py --apply

          # 목록이 실제로 바뀌었을 때만 점수를 다시 낸다.
          # 매번 다시 내면 generated_at만 바뀌는 커밋이 쌓인다.
          if ! git diff --quiet -- data/daiso_real/products.json; then
            echo "상품 목록이 바뀌었다. 점수를 다시 계산한다."
            python -u scripts/daiso/score_shopify_demand.py
          else
            echo "걸린 상품이 없다. 점수는 그대로 둔다."
          fi

      - name: 등록 게이트 1차 재계산
        shell: bash
        run: |
          python scripts/build_listing_gate.py

          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("data/listing_gate.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          counts = data.get("counts") or {}

          print("===== 현재 등록 게이트 =====")
          print(f"S등급 전체 : {data.get('total', 0)}")
          print(f"등록 가능  : {data.get('ready', 0)}")
          print(f"카피       : {counts.get('copy', 0)}")
          print(f"고시       : {counts.get('gosi', 0)}")
          print(f"가격       : {counts.get('price', 0)}")
          print(f"법률       : {counts.get('legal', 0)}")
          print(f"병목       : {data.get('blockers') or {}}")
          print("============================")
          PY

      - name: Shopify 카피 자동 보완
        shell: bash
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          NEED_COPY=$(python - <<'PY'
          import json
          from pathlib import Path

          try:
              data = json.loads(
                  Path("data/listing_gate.json").read_text(
                      encoding="utf-8"
                  )
              )
              print(
                  1 if (data.get("blockers") or {}).get("copy", 0) > 0
                  else 0
              )
          except Exception:
              print(0)
          PY
          )

          if [ "$NEED_COPY" = "1" ]; then
            echo "카피 병목 발견"
            if [ -z "${GEMINI_API_KEY:-}" ]; then
              echo "::warning::GEMINI_API_KEY가 없어 카피 보완을 건너뜁니다."
            else
              python -u scripts/gemini_listing_copy.py || true
            fi
          else
            echo "카피 병목 없음"
          fi

      - name: 고시 정보 수집 및 라벨 동기화
        shell: bash
        run: |
          NEED_GOSI=$(python - <<'PY'
          import json
          from pathlib import Path

          try:
              data = json.loads(
                  Path("data/listing_gate.json").read_text(
                      encoding="utf-8"
                  )
              )
              print(
                  1 if (data.get("blockers") or {}).get("gosi", 0) > 0
                  else 0
              )
          except Exception:
              print(1)
          PY
          )

          if [ "$NEED_GOSI" = "1" ]; then
            echo "고시 병목 발견"

            # 다이소 상품 고시는 data/gosi.json만 사용한다.
            python -u scripts/collect_daiso_gosi.py || true

            # 수집 결과를 미국 라벨 데이터에 병합한다.
            python -u scripts/sync_gosi_to_us_labels.py

            if [ -n "${GEMINI_API_KEY:-}" ]; then
              echo "Gemini 비전 추출 시작"
              VISION_BUDGET_SEC=900 \
                python -u scripts/extract_gosi_vision.py || true

              # 비전 추출 이후 추가된 값도 다시 병합한다.
              python -u scripts/sync_gosi_to_us_labels.py
            else
              echo "::warning::GEMINI_API_KEY가 없어 비전 추출을 건너뜁니다."
            fi
          else
            echo "고시 병목 없음"
          fi

      - name: 법률 자동 점검 갱신
        shell: bash
        run: |
          python -u scripts/check_legal_products.py

      - name: 등록 게이트 최종 재계산
        shell: bash
        run: |
          python scripts/build_listing_gate.py

          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(
              Path("data/listing_gate.json").read_text(
                  encoding="utf-8"
              )
          )
          counts = data.get("counts") or {}

          print("===== 최종 등록 게이트 =====")
          print(f"등록 가능 {data.get('ready', 0)}/{data.get('total', 0)}")
          print(
              f"카피 {counts.get('copy', 0)} / "
              f"고시 {counts.get('gosi', 0)} / "
              f"가격 {counts.get('price', 0)} / "
              f"법률 {counts.get('legal', 0)}"
          )
          print(f"병목: {data.get('blockers') or {}}")
          print("============================")
          PY

      - name: 대시보드 최종 생성
        shell: bash
        run: |
          python scripts/generate_dashboard_runtime.py

      # ============================================================
      # 에이전트 진단·우선순위 생성
      # ============================================================
      #
      # run_jarvis_agents.py 는 데이터 플레인을 수정하지 않고
      # data/agents/*.json 만 생성한다.
      #
      # 30분 주기 참모장에서는 정상 상태에서도 강제로 다시 작성한다.
      # 따라서 ops_plan이 며칠 전 문장으로 남는 문제를 막는다.
      #
      # 생성:
      #   data/agents/ops_plan.json
      #   data/agents/last_run.json
      #   data/agents/collector_audit.json
      #   data/agents/signal_audit.json
      #
      # 데이터 수집·채점·CSV 자체는 건드리지 않는다.
      - name: 에이전트 진단 및 오늘 우선순위 생성
        shell: bash
        env:
          JARVIS_AGENTS_FORCE: "1"
        run: |
          python -u scripts/run_jarvis_agents.py --force

          echo "===== 에이전트 산출물 ====="

          for f in \
            data/agents/ops_plan.json \
            data/agents/last_run.json \
            data/agents/collector_audit.json \
            data/agents/signal_audit.json
          do
            if [ -f "$f" ]; then
              echo "OK: $f"
            else
              echo "::warning::에이전트 산출물 없음: $f"
            fi
          done

          echo "==========================="

      - name: 변경사항 확인 (기록용)
        shell: bash
        run: |
          echo "===== 작업 폴더 상태 ====="
          git status --short
          echo "=========================="

      # ============================================================
      # 안전 발행
      # ============================================================
      #
      # 이번 실행이 실제로 만든 파일만 최신 origin/main 위에 얹는다.
      # publish 액션 자체가 최신 원격과 충돌을 처리한다.
      #
      # 에이전트 산출물도 함께 발행한다.
      - name: 산출물 발행 (원격 최신 위에 이번 변경만)
        if: always()
        uses: ./.github/actions/publish
        with:
          paths: >-
            data/listing_gate.json
            data/shopify_listing_copy.json
            data/gosi.json
            data/daiso_real/daiso_us_labels.json
            data/daiso_real/us_label_sync_report.json
            data/legal_products.json
            data/daiso_real/gosi_img
            data/daiso_real/products.json
            data/daiso_real/excluded_products.json
            data/daiso_real/shopify_demand_score.json
            data/daiso_real/shopify_s_recommendations.json
            data/agents/ops_plan.json
            data/agents/last_run.json
            data/agents/collector_audit.json
            data/agents/signal_audit.json
          message: 참모장 · 등록 게이트 및 에이전트 산출물 갱신
          regenerate-dashboard: 'true'
          audit: 'true'

      - name: 최종 요약
        if: always()
        shell: bash
        run: |
          if [ -f data/listing_gate.json ]; then
            python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(
              Path("data/listing_gate.json").read_text(
                  encoding="utf-8"
              )
          )

          print("===================================")
          print("       JARVIS 참모장 최종 보고")
          print("===================================")
          print(
              f"등록 가능: {data.get('ready', 0)}/{data.get('total', 0)}"
          )
          print(f"병목: {data.get('blockers') or {}}")

          for item in data.get("items") or []:
              if item.get("blocked_by"):
                  print(
                      f"- {item.get('pd_no')} "
                      f"{item.get('name')}: "
                      f"{', '.join(item.get('blocked_by') or [])}"
                  )

          print("===================================")
          PY
          else
            echo "listing_gate.json 없음"
          fi
