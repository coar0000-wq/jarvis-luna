name: Chief of Staff Auto-Fix
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
  push:
    paths: ['data/team_status.json']
permissions:
  contents: write
jobs:
  chief-auto-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: python chief_of_staff.py
