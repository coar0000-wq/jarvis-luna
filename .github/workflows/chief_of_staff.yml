name: 참모장 자동 수정

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

# 참모장이 동시에 두 번 실행되어 서로의 결과를 덮지 않도록 한다.
concurrency:
  group: chief-of-staff-main
  cancel-in-progress: false

jobs:
  chief-auto-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip

      # ------------------------------------------------------------
      # 1. 항상 최신 main 기준으로 시작
      # ------------------------------------------------------------
      - name: 최신 main 동기화
        shell: bash
        run: |
          git fetch origin main
          git reset --hard origin/main
          git clean -fd

      # ------------------------------------------------------------
      # 2. 등록 게이트를 먼저 새로 계산
      #
      # 오래된 listing_gate.json 때문에
      # 실제 카피 7/7인데 카피 5/7로 표시되는 현상을 먼저 제거한다.
      # ------------------------------------------------------------
      - name: 등록 게이트 1차 재계산
        shell: bash
        run: |
          python scripts/build_listing_gate.py

          python - <<'PY'
          import json
          from pathlib import Path

          p = Path("data/listing_gate.json")
          d = json.loads(p.read_text(encoding="utf-8"))

          print()
          print("===== 현재 등록 게이트 =====")
          print(f"S등급 전체 : {d.get('total', 0)}")
          print(f"등록 가능  : {d.get('ready', 0)}")
          print(f"카피       : {(d.get('counts') or {}).get('copy', 0)}")
          print(f"고시       : {(d.get('counts') or {}).get('gosi', 0)}")
          print(f"가격       : {(d.get('counts') or {}).get('price', 0)}")
          print(f"법률       : {(d.get('counts') or {}).get('legal', 0)}")
          print(f"병목       : {d.get('blockers') or {}}")
          print("============================")
          PY

      # ------------------------------------------------------------
      # 3. 카피 병목이 실제로 남아 있을 때만 Gemini 실행
      #
      # 현재 실제 파일이 7/7이면 이 단계는 실행하지 않는다.
      # ------------------------------------------------------------
      - name: Shopify 카피 자동 보완
        shell: bash
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          NEED_COPY=$(python - <<'PY'
          import json
          from pathlib import Path

          try:
              d = json.loads(
                  Path("data/listing_gate.json").read_text(
                      encoding="utf-8"
                  )
              )
              print(
                  1 if (d.get("blockers") or {}).get("copy", 0) > 0
                  else 0
              )
          except Exception:
              print(0)
          PY
          )

          if [ "$NEED_COPY" = "1" ]; then
            echo "카피 병목 발견"

            if [ -z "${GEMINI_API_KEY:-}" ]; then
              echo "::warning::GEMINI_API_KEY가 없어 카피 자동 보완을 건너뜁니다."
            else
              echo "Gemini 카피 생성 실행"
              python -u scripts/gemini_listing_copy.py || true
            fi
          else
            echo "카피 병목 없음 - 기존 카피 유지"
          fi

      # ------------------------------------------------------------
      # 4. 고시 병목이 실제로 남아 있을 때만 고시 수집/비전 추출
      # ------------------------------------------------------------
      - name: 고시 정보 자동 보완
        shell: bash
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          NEED_GOSI=$(python - <<'PY'
          import json
          from pathlib import Path

          try:
              d = json.loads(
                  Path("data/listing_gate.json").read_text(
                      encoding="utf-8"
                  )
              )
              print(
                  1 if (d.get("blockers") or {}).get("gosi", 0) > 0
                  else 0
              )
          except Exception:
              print(0)
          PY
          )

          if [ "$NEED_GOSI" = "1" ]; then
            echo "고시 병목 발견"
            echo "다이소 고시 정보 재수집 시작"

            python -u scripts/collect_daiso_gosi.py || true

            if [ -n "${GEMINI_API_KEY:-}" ]; then
              echo "Gemini 비전 추출 시작"
              VISION_BUDGET_SEC=900 \
                python -u scripts/extract_gosi_vision.py || true
            else
              echo "::warning::GEMINI_API_KEY가 없어 비전 추출을 건너뜁니다."
            fi
          else
            echo "고시 병목 없음 - 기존 고시 정보 유지"
          fi

      # ------------------------------------------------------------
      # 5. 법률 점검은 자동 갱신
      #
      # SPF/OTC 같은 항목은 자동으로 '통과'시키지 않는다.
      # 대신 최신 점검 결과를 만들어 비서실장이 판단할 수 있게 한다.
      # ------------------------------------------------------------
      - name: 법률 자동 점검 갱신
        shell: bash
        run: |
          python -u scripts/check_legal_products.py || true

      # ------------------------------------------------------------
      # 6. 모든 자동 처리가 끝난 뒤 등록 게이트 재계산
      # ------------------------------------------------------------
      - name: 등록 게이트 최종 재계산
        shell: bash
        run: |
          python scripts/build_listing_gate.py

          python - <<'PY'
          import json
          from pathlib import Path

          d = json.loads(
              Path("data/listing_gate.json").read_text(
                  encoding="utf-8"
              )
          )

          print()
          print("===== 최종 등록 게이트 =====")
          print(
              f"등록 가능 {d.get('ready', 0)}/{d.get('total', 0)}"
          )
          print(
              f"카피 {(d.get('counts') or {}).get('copy', 0)}"
              f" / 고시 {(d.get('counts') or {}).get('gosi', 0)}"
              f" / 가격 {(d.get('counts') or {}).get('price', 0)}"
              f" / 법률 {(d.get('counts') or {}).get('legal', 0)}"
          )
          print(f"병목: {d.get('blockers') or {}}")
          print("============================")
          PY

      # ------------------------------------------------------------
      # 7. 최종 대시보드 생성
      # ------------------------------------------------------------
      - name: 대시보드 최종 생성
        shell: bash
        run: |
          python scripts/generate_dashboard_runtime.py

      # ------------------------------------------------------------
      # 8. 실제 변경이 있는 파일만 발행
      #
      # gosi / products 전체를 참모장이 무조건 다시 커밋하지 않는다.
      # 이번 실행에서 실제 수정된 산출물만 올린다.
      # ------------------------------------------------------------
      - name: 변경사항 확인
        shell: bash
        run: |
          git status --short

          git add \
            data/listing_gate.json \
            data/shopify_listing_copy.json \
            data/gosi.json \
            data/legal_products.json \
            data/dashboard_runtime.json \
            data/daiso_real/gosi_img 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "변경사항 없음"
            exit 0
          fi

          echo "===== 커밋 예정 변경 ====="
          git diff --cached --stat
          echo "=========================="

      # ------------------------------------------------------------
      # 9. 원격이 바뀌어도 rebase 충돌을 만들지 않는 push
      #
      # 핵심:
      # - rebase를 하지 않는다.
      # - push가 거절되면 최신 main으로 다시 시작한다.
      # - 다시 계산 후 다시 push한다.
      # ------------------------------------------------------------
      - name: Commit & Push
        shell: bash
        run: |
          set -u

          if git diff --cached --quiet; then
            echo "커밋할 변경사항 없음"
            exit 0
          fi

          git config user.name "JARVIS"
          git config user.email "actions@github.com"

          git commit -m "fix: chief of staff resolve listing state"

          for attempt in 1 2 3 4 5; do
            echo "===== PUSH ATTEMPT ${attempt}/5 ====="

            if git push origin HEAD:main; then
              echo "push 성공"
              exit 0
            fi

            echo "원격 main 변경 감지"
            echo "최신 main에서 다시 생성합니다."

            git fetch origin main
            git reset --hard origin/main
            git clean -fd

            # 최신 원격 상태에서 다시 계산한다.
            python scripts/build_listing_gate.py || true
            python scripts/check_legal_products.py || true
            python scripts/generate_dashboard_runtime.py

            git add \
              data/listing_gate.json \
              data/shopify_listing_copy.json \
              data/gosi.json \
              data/legal_products.json \
              data/dashboard_runtime.json \
              data/daiso_real/gosi_img 2>/dev/null || true

            if git diff --cached --quiet; then
              echo "최신 main 기준으로 변경사항 없음"
              exit 0
            fi

            git commit -m "fix: chief of staff refresh listing state"
          done

          echo "5회 push 시도 후 실패"
          exit 1

      # ------------------------------------------------------------
      # 10. 사람이 봐야 하는 병목만 요약
      # ------------------------------------------------------------
      - name: 최종 요약
        if: always()
        shell: bash
        run: |
          if [ -f data/listing_gate.json ]; then
            python - <<'PY'
          import json
          from pathlib import Path

          d = json.loads(
              Path("data/listing_gate.json").read_text(
                  encoding="utf-8"
              )
          )

          print()
          print("===================================")
          print("       JARVIS 참모장 최종 보고")
          print("===================================")
          print(
              f"등록 가능: {d.get('ready', 0)}/{d.get('total', 0)}"
          )
          print(f"병목: {d.get('blockers') or {}}")

          items = d.get("items") or []

          for item in items:
              if item.get("blocked_by"):
                  print(
                      f"- {item.get('pd_no')} "
                      f"{item.get('name')}: "
                      f"{', '.join(item.get('blocked_by'))}"
                  )

          print("===================================")
          PY
          else
            echo "listing_gate.json 없음"
          fi
