name: 참모장 자동 수정

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

# 자동 발행 작업은 한 번에 하나만 실행한다.
# 새 실행은 기존 실행이 끝날 때까지 대기한다.
concurrency:
  group: main-publish
  cancel-in-progress: false

jobs:
  chief-auto-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip

      - name: 최신 main 동기화
        shell: bash
        run: |
          git fetch origin main
          git reset --hard origin/main
          git clean -fd

      - name: 등록 게이트 1차 재계산
        shell: bash
        run: |
          python scripts/build_listing_gate.py

          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("data/listing_gate.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          counts = data.get("counts") or {}

          print("===== 현재 등록 게이트 =====")
          print(f"S등급 전체 : {data.get('total', 0)}")
          print(f"등록 가능  : {data.get('ready', 0)}")
          print(f"카피       : {counts.get('copy', 0)}")
          print(f"고시       : {counts.get('gosi', 0)}")
          print(f"가격       : {counts.get('price', 0)}")
          print(f"법률       : {counts.get('legal', 0)}")
          print(f"병목       : {data.get('blockers') or {}}")
          print("============================")
          PY

      - name: Shopify 카피 자동 보완
        shell: bash
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          NEED_COPY=$(python - <<'PY'
          import json
          from pathlib import Path

          try:
              data = json.loads(
                  Path("data/listing_gate.json").read_text(
                      encoding="utf-8"
                  )
              )
              print(
                  1 if (data.get("blockers") or {}).get("copy", 0) > 0
                  else 0
              )
          except Exception:
              print(0)
          PY
          )

          if [ "$NEED_COPY" = "1" ]; then
            echo "카피 병목 발견"
            if [ -z "${GEMINI_API_KEY:-}" ]; then
              echo "::warning::GEMINI_API_KEY가 없어 카피 보완을 건너뜁니다."
            else
              python -u scripts/gemini_listing_copy.py || true
            fi
          else
            echo "카피 병목 없음"
          fi

      - name: 고시 정보 수집 및 라벨 동기화
        shell: bash
        run: |
          NEED_GOSI=$(python - <<'PY'
          import json
          from pathlib import Path

          try:
              data = json.loads(
                  Path("data/listing_gate.json").read_text(
                      encoding="utf-8"
                  )
              )
              print(
                  1 if (data.get("blockers") or {}).get("gosi", 0) > 0
                  else 0
              )
          except Exception:
              print(1)
          PY
          )

          if [ "$NEED_GOSI" = "1" ]; then
            echo "고시 병목 발견"

            # 고시 수집기는 data/gosi.json을 갱신한다.
            python -u scripts/collect_daiso_gosi.py || true

            # 수집 결과를 data/daiso_real/daiso_us_labels.json에 병합한다.
            python -u scripts/sync_gosi_to_us_labels.py

            if [ -n "${GEMINI_API_KEY:-}" ]; then
              echo "Gemini 비전 추출 시작"
              VISION_BUDGET_SEC=900 \
                python -u scripts/extract_gosi_vision.py || true

              # 비전 추출 이후 추가된 값도 다시 병합한다.
              python -u scripts/sync_gosi_to_us_labels.py
            else
              echo "::warning::GEMINI_API_KEY가 없어 비전 추출을 건너뜁니다."
            fi
          else
            echo "고시 병목 없음"
          fi

      - name: 법률 자동 점검 갱신
        shell: bash
        run: |
          python -u scripts/check_legal_products.py

      - name: 등록 게이트 최종 재계산
        shell: bash
        run: |
          python scripts/build_listing_gate.py

          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(
              Path("data/listing_gate.json").read_text(
                  encoding="utf-8"
              )
          )
          counts = data.get("counts") or {}

          print("===== 최종 등록 게이트 =====")
          print(f"등록 가능 {data.get('ready', 0)}/{data.get('total', 0)}")
          print(
              f"카피 {counts.get('copy', 0)} / "
              f"고시 {counts.get('gosi', 0)} / "
              f"가격 {counts.get('price', 0)} / "
              f"법률 {counts.get('legal', 0)}"
          )
          print(f"병목: {data.get('blockers') or {}}")
          print("============================")
          PY

      - name: 대시보드 최종 생성
        shell: bash
        run: |
          python scripts/generate_dashboard_runtime.py

      - name: 변경사항 확인
        shell: bash
        run: |
          git status --short

          git add \
            data/listing_gate.json \
            data/shopify_listing_copy.json \
            data/gosi.json \
            data/daiso_real/daiso_us_labels.json \
            data/legal_products.json \
            data/dashboard_runtime.json \
            data/daiso_real/gosi_img 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "변경사항 없음"
            exit 0
          fi

          git diff --cached --stat

      - name: Commit & Push
        shell: bash
        run: |
          set -u

          if git diff --cached --quiet; then
            echo "커밋할 변경사항 없음"
            exit 0
          fi

          git config user.name "JARVIS"
          git config user.email "actions@github.com"
          git commit -m "fix: refresh gosi labels and listing gate"

          for attempt in 1 2 3 4 5; do
            echo "===== PUSH ATTEMPT ${attempt}/5 ====="

            if git push origin HEAD:main; then
              echo "push 성공"
              exit 0
            fi

            echo "원격 main 변경 감지"
            git fetch origin main
            git reset --hard origin/main
            git clean -fd

            python scripts/collect_daiso_gosi.py || true
            python scripts/sync_gosi_to_us_labels.py
            python scripts/check_legal_products.py
            python scripts/build_listing_gate.py
            python scripts/generate_dashboard_runtime.py

            git add \
              data/listing_gate.json \
              data/shopify_listing_copy.json \
              data/gosi.json \
              data/daiso_real/daiso_us_labels.json \
              data/legal_products.json \
              data/dashboard_runtime.json \
              data/daiso_real/gosi_img 2>/dev/null || true

            if git diff --cached --quiet; then
              echo "최신 main 기준 변경사항 없음"
              exit 0
            fi

            git commit -m "fix: refresh gosi labels after remote update"
          done

          echo "5회 push 시도 후 실패"
          exit 1

      - name: 최종 요약
        if: always()
        shell: bash
        run: |
          if [ -f data/listing_gate.json ]; then
            python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(
              Path("data/listing_gate.json").read_text(
                  encoding="utf-8"
              )
          )

          print("===================================")
          print("       JARVIS 참모장 최종 보고")
          print("===================================")
          print(
              f"등록 가능: {data.get('ready', 0)}/{data.get('total', 0)}"
          )
          print(f"병목: {data.get('blockers') or {}}")

          for item in data.get("items") or []:
              if item.get("blocked_by"):
                  print(
                      f"- {item.get('pd_no')} "
                      f"{item.get('name')}: "
                      f"{', '.join(item.get('blocked_by') or [])}"
                  )

          print("===================================")
          PY
          else
            echo "listing_gate.json 없음"
          fi
