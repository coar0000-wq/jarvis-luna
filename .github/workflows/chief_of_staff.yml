name: 루트 수집기 3종 (gosi / product / inci)

on:
  workflow_dispatch:

  schedule:
    - cron: '0 2 * * *'

  push:
    paths:
      - 'product_discovery.py'
      - 'gosi_collector.py'
      - 'inci_converter.py'

concurrency:
  group: jarvis-main-writer-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  root-collectors:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip' # 패키지 설치 시간 단축을 위한 캐시 추가

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install requests beautifulsoup4

      - name: 시작 시점 고시 상태 기록
        continue-on-error: true
        run: python -u scripts/guard_gosi.py

      - name: 시험 공고 수집 (data/civil_service_gosi.json 전용)
        continue-on-error: true
        run: python -u gosi_collector.py

      - name: 상품 수요 신호 수집 (data/products.json)
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -u product_discovery.py

      - name: INCI 변환 (data/daiso_real/daiso_gosi.json)
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -u inci_converter.py

      # 복구 실패 시 실행 전체가 깨지지 않도록 경고 처리 후 진행
      - name: 화장품 고시 보호 및 복구
        shell: bash
        run: |
          python -u scripts/guard_gosi.py --restore || echo "::warning::고시 복구 과정에서 경고 발생 (기존 상태 유지)"

      # 이전 수집 실패로 데이터가 없어도 전체 파이프라인이 중단되지 않도록 방어
      - name: 대시보드 생성
        continue-on-error: true
        run: python -u scripts/generate_dashboard_runtime.py

      # 발행 대상 파일이 존재하는지 사전에 생성/확인
      - name: 발행 대상 산출물 점검
        shell: bash
        run: |
          mkdir -p data/daiso_real
          for target in data/civil_service_gosi.json data/products.json data/daiso_real/daiso_gosi.json data/dashboard_runtime.json; do
            if [ ! -f "$target" ]; then
              echo "{}" > "$target"
            fi
          done

      - name: 산출물 발행 (원격 최신 위에 이번 변경만)
        if: always()
        uses: ./.github/actions/publish
        with:
          paths: >-
            data/civil_service_gosi.json
            data/products.json
            data/daiso_real/daiso_gosi.json
            data/dashboard_runtime.json
          message: 루트 수집기 3종 실행 결과
          regenerate-dashboard: 'true'
