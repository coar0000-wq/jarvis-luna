name: Chief of Staff Auto-Fix

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

concurrency:
  group: jarvis-main-writer-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  chief-auto-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Show current team status
        run: |
          if [ -f data/team_status.json ]; then
            cat data/team_status.json | python -m json.tool || true
            python3 -c "import json; d=json.load(open('data/team_status.json', encoding='utf-8')); print('이상:', len([r for r in d.get('reports', []) if r.get('status') == '이상']))"
          else
            echo "data/team_status.json not found"
          fi

      - name: Run Chief of Staff auto-fix
        run: |
          python chief_of_staff.py || true
          python gosi_collector.py || true
          python product_discovery.py || true
          python generate_dashboard_runtime.py || true

      - name: Check FAIL after auto-fix
        run: |
          if [ -f data/team_status.json ]; then
            python3 -c "import json; d=json.load(open('data/team_status.json', encoding='utf-8')); print('FAIL Count after fix:', len([r for r in d.get('reports', []) if r.get('status') == '이상']))"
          else
            echo "data/team_status.json not found"
          fi

          if [ -f data/chief_of_staff_log.json ]; then
            cat data/chief_of_staff_log.json
          else
            echo "no log"
          fi

      - name: Commit and push fixed data
        run: |
          git config user.name "JARVIS"
          git config user.email "jarvis@luna.bot"

          git add -A

          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi

          git commit -m "fix: auto-fix FAIL - $(date +%Y-%m-%d) - JARVIS auto"

          git fetch origin main
          git rebase origin/main

          git push origin HEAD:main
