name: 참모장 자동 수정

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

# 같은 참모장 작업이 동시에 실행되어 서로의 커밋을 덮지 않게 한다.
concurrency:
  group: chief-of-staff-main
  cancel-in-progress: false

jobs:
  chief-auto-fix:
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip

      - name: Auto Fix 실행
        run: |
          python scripts/generate_dashboard_runtime.py

      - name: Commit & Push (원격 우선 재생성 방식)
        shell: bash
        run: |
          set -u

          git config user.name "JARVIS"
          git config user.email "actions@github.com"

          # 생성 파일만 커밋한다.
          # gosi.json / products.json 은 다른 수집기가 관리하므로
          # 참모장이 같이 커밋하지 않는다.
          for attempt in 1 2 3 4 5; do
            echo "===== push attempt ${attempt} ====="

            # 매 시도마다 최신 main에서 다시 시작한다.
            git fetch origin main
            git reset --hard origin/main

            # 최신 원격 상태에서 런타임을 다시 생성한다.
            python scripts/generate_dashboard_runtime.py

            git add data/dashboard_runtime.json

            if git diff --cached --quiet; then
              echo "변경사항 없음"
              exit 0
            fi

            git commit -m "fix: auto-fix $(date +'%Y-%m-%d %H:%M')"

            if git push origin HEAD:main; then
              echo "push 성공"
              exit 0
            fi

            echo "원격 main 이 이동했습니다. 최신 main 에서 다시 생성합니다."
          done

          echo "5회 시도 후에도 push 실패"
          exit 1
