name: JARVIS Real Knowledge Sync

on:
  workflow_dispatch:
  schedule:
    - cron: "17 0,6,12,18 * * *"

permissions:
  contents: write

concurrency:
  group: jarvis-real-knowledge
  cancel-in-progress: false

jobs:
  collect-and-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      YOUTUBE_CHANNEL_IDS: ${{ secrets.YOUTUBE_CHANNEL_IDS }}
      GOOGLE_CSE_API_KEY: ${{ secrets.GOOGLE_CSE_API_KEY }}
      GOOGLE_CSE_ID: ${{ secrets.GOOGLE_CSE_ID }}
      KNOWLEDGE_QUERIES: ${{ vars.KNOWLEDGE_QUERIES }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas requests scikit-learn
          python -c "import numpy, pandas, requests, sklearn; print('deps OK')"

      - name: Check secrets/vars (optional – warn only)
        run: |
          missing=()
          [[ -z "$YOUTUBE_CHANNEL_IDS" ]] && missing+=("YOUTUBE_CHANNEL_IDS")
          [[ -z "$GOOGLE_CSE_API_KEY" ]] && missing+=("GOOGLE_CSE_API_KEY")
          [[ -z "$GOOGLE_CSE_ID" ]] && missing+=("GOOGLE_CSE_ID")
          [[ -z "$KNOWLEDGE_QUERIES" ]] && missing+=("KNOWLEDGE_QUERIES")
          if (( ${#missing[@]} )); then
            echo "::warning::Missing optional secrets/vars: ${missing[*]}"
            echo "스크립트가 기본값/폴백으로 계속 진행합니다."
          else
            echo "All secrets/vars present."
          fi

      - name: Collect real public sources
        run: python real_knowledge_sync.py

      - name: Prepare transparent training corpus
        run: python prepare_real_training_corpus.py

      - name: Normalize Obsidian links (if available)
        run: |
          if [ -f scripts/normalize_obsidian_links.py ]; then
            python scripts/normalize_obsidian_links.py
          else
            echo "normalize_obsidian_links.py 없음 – 건너뜀"
          fi

      - name: Rebuild Obsidian graph (if available)
        run: |
          if [ -f organize_obsidian_graph.py ]; then
            python organize_obsidian_graph.py
          fi
          if [ -f expand_obsidian_graph.py ]; then
            python expand_obsidian_graph.py
          fi

      - name: Train real-data knowledge router
        run: python train_real_knowledge.py

      - name: Tune MoE (if available)
        run: |
          if [ -f tune_real_knowledge_moe.py ]; then
            python tune_real_knowledge_moe.py \
              --experts 3 \
              --learning-rates 1.2 \
              --l2-values 0.0001 \
              --temperatures 0.9 \
              --steps 500 \
              --promote || echo "tune step soft-failed"
          else
            echo "tune_real_knowledge_moe.py 없음 – 건너뜀"
          fi

      - name: Generate dashboard_runtime.json for GitHub Pages
        run: python scripts/generate_dashboard_runtime.py

      - name: Validate generated artefacts
        run: |
          set -euo pipefail
          python -m json.tool data/knowledge/real_sources.json >/dev/null
          python -m json.tool data/knowledge/training_status.json >/dev/null
          python -m json.tool data/dashboard_runtime.json >/dev/null
          test -f data/knowledge/real_knowledge_router.npz
          test -f "obsidian/JARVIS_LUNA/Knowledge/JARVIS Real Knowledge Index.md"
          echo "All required files present and valid JSON."

      - name: Commit & push (knowledge + dashboard for Pages)
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # 이번 실행이 만든 산출물을 임시 커밋으로 고정
          for pth in data/knowledge obsidian; do
            git add -A -- "$pth" 2>/dev/null || true
          done
          if git diff --cached --quiet; then
            echo "생성된 변경 없음"
            exit 0
          fi
          git commit -q -m "wip"
          MINE=$(git rev-parse HEAD)

          # 원격 최신을 베이스로 두고 그 위에 우리 산출물만 얹는다.
          # rebase 를 쓰지 않으므로 add/add 충돌이 구조적으로 발생하지 않는다.
          # (2026-09-01: rebase 방식이 manual_channels.json 충돌로 계속 실패해 교체)
          for i in 1 2 3 4 5; do
            git fetch -q origin main
            git checkout -q -B publish origin/main
            RESTORED=0
            for pth in data/knowledge obsidian; do
              if git checkout -q "$MINE" -- "$pth" 2>/dev/null; then
                RESTORED=$((RESTORED+1))
              fi
              git add -A -- "$pth" 2>/dev/null || true
            done
            if [ "$RESTORED" -eq 0 ]; then
              echo "산출물 복원 실패 - 중단"
              exit 1
            fi
            if git diff --cached --quiet; then
              echo "원격과 동일 - 푸시 불필요"
              exit 0
            fi
            git commit -q -m "실지식 동기화 갱신"
            if git push -q origin HEAD:main; then
              echo "push 성공 (시도 $i, 복원 경로 ${RESTORED}개)"
              exit 0
            fi
            echo "push 거절됨, 재시도 $i"
            git reset -q --hard "$MINE"
            sleep $((i * 4))
          done
          echo "5회 시도 후 push 실패"
          exit 1