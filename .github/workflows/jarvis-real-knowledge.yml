name: JARVIS Real Knowledge Sync

on:
  workflow_dispatch:
  schedule:
    - cron: "37 0,6,12,18 * * *"

permissions:
  contents: write

concurrency:
  # 모든 main 자동 발행 워크플로가 공유하는 잠금 그룹
  group: main-publish
  # 실행 중인 데이터 생성은 중단하지 않고 다음 실행을 대기시킨다.
  cancel-in-progress: false
jobs:
  collect-and-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      YOUTUBE_CHANNEL_IDS: ${{ secrets.YOUTUBE_CHANNEL_IDS }}
      GOOGLE_CSE_API_KEY: ${{ secrets.GOOGLE_CSE_API_KEY }}
      GOOGLE_CSE_ID: ${{ secrets.GOOGLE_CSE_ID }}
      KNOWLEDGE_QUERIES: ${{ vars.KNOWLEDGE_QUERIES }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # actions/setup-python@v7.0.0
        with:
          python-version: '3.11'
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements/requirements-knowledge.txt
          python -c "import numpy, requests; print('locked deps OK')"

      - name: Check secrets/vars (optional – warn only)
        run: |
          missing=()
          [[ -z "$YOUTUBE_CHANNEL_IDS" ]] && missing+=("YOUTUBE_CHANNEL_IDS")
          [[ -z "$GOOGLE_CSE_API_KEY" ]] && missing+=("GOOGLE_CSE_API_KEY")
          [[ -z "$GOOGLE_CSE_ID" ]] && missing+=("GOOGLE_CSE_ID")
          [[ -z "$KNOWLEDGE_QUERIES" ]] && missing+=("KNOWLEDGE_QUERIES")
          if (( ${#missing[@]} )); then
            echo "::warning::Missing optional secrets/vars: ${missing[*]}"
            echo "스크립트가 기본값/폴백으로 계속 진행합니다."
          else
            echo "All secrets/vars present."
          fi

      - name: Collect real public sources
        run: python real_knowledge_sync.py

      - name: Prepare transparent training corpus
        run: python prepare_real_training_corpus.py

      - name: Normalize Obsidian links (if available)
        run: |
          if [ -f scripts/normalize_obsidian_links.py ]; then
            python scripts/normalize_obsidian_links.py
          else
            echo "normalize_obsidian_links.py 없음 – 건너뜀"
          fi

      - name: Rebuild Obsidian graph (if available)
        run: |
          if [ -f organize_obsidian_graph.py ]; then
            python organize_obsidian_graph.py
          fi
          if [ -f expand_obsidian_graph.py ]; then
            python expand_obsidian_graph.py
          fi

      # Only evaluated candidates may replace live weights. Direct train would
      # overwrite the old model before tuning validation, so it is not scheduled.
      - name: Evaluate MoE candidate and promote only after baseline gate
        id: model_evaluation
        run: |
          python tune_real_knowledge_moe.py \
            --experts 3 \
            --learning-rates 5.0 \
            --l2-values 0.0001 \
            --temperatures 0.9 \
            --steps 300 \
            --promote

      - name: Generate dashboard_runtime.json for GitHub Pages
        run: python scripts/generate_dashboard_runtime.py

      - name: Validate generated artefacts
        run: |
          set -euo pipefail
          python -m json.tool data/knowledge/real_sources.json >/dev/null
          python -m json.tool data/knowledge/training_status.json >/dev/null
          python -m json.tool data/dashboard_runtime.json >/dev/null
          test -f data/knowledge/real_knowledge_router.npz
          test -f "obsidian/JARVIS_LUNA/Knowledge/JARVIS Real Knowledge Index.md"
          echo "All required files present and valid JSON."

      # Required failures block publication. The shared transaction replays
      # source deltas on latest main and validates both candidate/final quality.
      # 2026-09-09: 커밋 블록을 .github/actions/publish 로 옮겼다.
      #   전에는 이랬다.
      #     git checkout -B publish origin/main
      #     git checkout $MINE -- <경로>
      #   원격 최신을 베이스로 두는 것까지는 맞다. 그런데 둘째 줄이
      #   경로 전체를 자기 스냅샷으로 덮어서, 내가 건드리지도 않은 파일을
      #   내 실행이 시작할 때 값으로 되돌렸다.
      #
      #   실제로 그 일이 났다. Deep Analysis #443 이 만든 45개 파일을
      #   같은 방식으로 만든 커밋 하나가 통째로 되돌렸다.
      #   현재 주기는 UTC 00:37/06:37/12:37/18:37 (KST 09:37/15:37/21:37/03:37)이다.
      #
      #   이제 이번 실행이 실제로 바꾼 파일만 얹는다. 대시보드는
      #   밀어넣을 그 트리에서 다시 만들고, 감사도 거기서 돌린다.
      - name: 순위 스냅샷 교체 사유 기록 (가드 유지, 선언된 순위 목록만)
        run: python -B scripts/collector_snapshot_history.py data/knowledge/real_sources.json

      - name: 산출물 발행 (원격 최신 위에 이번 변경만)
        uses: ./.github/actions/publish
        with:
          # data/obsidian_record_names.json 도 넣는다. (2026-09-17)
          #
          # expand_obsidian_graph.py 는 레코드마다 노트 이름을 정해 그 장부에
          # 적어둔다. 이름이 회차마다 바뀌지 않게 하려는 장치다.
          #
          # 그런데 장부가 data/knowledge 밖이라 이 워크플로가 발행하지
          # 않았다. 노트는 올라가는데 그 이름을 정한 근거는 버려졌다.
          # 다음 회차는 예전 장부를 읽고 일부 레코드에 다른 이름을 준다.
          # 인덱스는 새 이름을 가리키고 노트는 옆 이름으로 있으니 링크가 끊긴다.
          #
          # 2026-09-17 에 끊어진 링크 112건이 그것이었다.
          # 워크플로는 계속 success 였다. 실패한 적이 없으니 아무도 못 봤다.
          paths: >-
            data/knowledge
            data/publish_deletions.json
            data/obsidian_record_names.json
            data/dashboard_runtime.json
            obsidian
          message: 실지식 동기화 갱신

      - name: 앞 단계 실패 확인
        if: always()
        run: |
          if [ "${{ job.status }}" != "success" ]; then
            echo "::error::필수 처리 또는 발행 검사 실패. 마지막 정상 main/배포본을 유지한다."
            exit 1
          fi
          echo "모든 단계 정상"
