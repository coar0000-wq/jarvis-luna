name: JARVIS Real Knowledge Sync

on:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *"

permissions:
  contents: write

concurrency:
  group: jarvis-real-knowledge
  cancel-in-progress: false

jobs:
  collect-and-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      YOUTUBE_CHANNEL_IDS: ${{ secrets.YOUTUBE_CHANNEL_IDS }}
      GOOGLE_CSE_API_KEY:  ${{ secrets.GOOGLE_CSE_API_KEY }}
      GOOGLE_CSE_ID:       ${{ secrets.GOOGLE_CSE_ID }}
      KNOWLEDGE_QUERIES:   ${{ vars.KNOWLEDGE_QUERIES }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas requests scikit-learn
          python -c "import numpy, pandas, requests, sklearn; print('deps OK')"

     - name: Check secrets/vars (optional – warn only)
  run: |
    missing=()
    [[ -z "$YOUTUBE_CHANNEL_IDS" ]] && missing+=("YOUTUBE_CHANNEL_IDS")
    [[ -z "$GOOGLE_CSE_API_KEY" ]] && missing+=("GOOGLE_CSE_API_KEY")
    [[ -z "$GOOGLE_CSE_ID" ]] && missing+=("GOOGLE_CSE_ID")
    [[ -z "$KNOWLEDGE_QUERIES" ]] && missing+=("KNOWLEDGE_QUERIES")
    if (( ${#missing[@]} )); then
      echo "::warning::Missing optional secrets/vars: ${missing[*]}"
      echo "스크립트가 기본값/폴백으로 계속 진행합니다."
    else
      echo "All secrets/vars present."
    fi

      - name: Collect real public sources
        run: python real_knowledge_sync.py

      - name: Prepare transparent training corpus
        run: python prepare_real_training_corpus.py

      - name: Train real-data knowledge router
        run: python train_real_knowledge.py

      - name: Validate generated artefacts
        run: |
          set -euo pipefail
          python -m json.tool data/knowledge/real_sources.json >/dev/null
          python -m json.tool data/knowledge/training_status.json >/dev/null
          test -f data/knowledge/real_knowledge_router.npz
          test -f "obsidian/JARVIS_LUNA/Knowledge/JARVIS Real Knowledge Index.md"
          echo "All required files present and valid JSON."

      - name: Commit & push (only if something changed)
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/knowledge \
                  "obsidian/JARVIS_LUNA/Knowledge"

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "🧠 Train real knowledge router and sync Obsidian graph"
          git push origin HEAD:main
