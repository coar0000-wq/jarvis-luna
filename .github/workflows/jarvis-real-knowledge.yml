name: JARVIS Real Knowledge Sync

on:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *"

permissions:
  contents: write

jobs:
  collect-and-sync:
    runs-on: ubuntu-latest

    env:
      YOUTUBE_CHANNEL_IDS: ${{ secrets.YOUTUBE_CHANNEL_IDS }}
      GOOGLE_CSE_API_KEY: ${{ secrets.GOOGLE_CSE_API_KEY }}
      GOOGLE_CSE_ID: ${{ secrets.GOOGLE_CSE_ID }}
      KNOWLEDGE_QUERIES: ${{ vars.KNOWLEDGE_QUERIES }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip

      - name: Install Python packages
        run: |
          pip install numpy pandas requests scikit-learn

      - name: Collect real public sources and update Obsidian notes
        run: python real_knowledge_sync.py

      - name: Prepare transparent real-data training corpus
        run: python prepare_real_training_corpus.py

      - name: Train the real-data knowledge router
        run: python train_real_knowledge.py

      - name: Validate generated files
        shell: bash
        run: |
          set -e

          python -m json.tool data/knowledge/real_sources.json >/dev/null
          python -m json.tool data/knowledge/training_status.json >/dev/null

          test -f data/knowledge/real_knowledge_router.npz
          test -f obsidian/JARVIS_LUNA/Knowledge/JARVIS\ Real\ Knowledge\ Index.md

      - name: Commit and push safely
        shell: bash
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            data/knowledge \
            obsidian/JARVIS_LUNA/Knowledge \
            real_knowledge_sync.py \
            prepare_real_training_corpus.py \
            train_real_knowledge.py \
            .github/workflows/jarvis-real-knowledge.yml

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "🧠 Train real knowledge router and sync Obsidian graph"

          echo "Sync with latest origin/main..."
          git fetch origin main
          git rebase origin/main

          echo "Push to GitHub..."
          git push origin HEAD:main
