name: Shopify 1084687 비공개 초안 복구

# Explicit dispatch only. No create, price/media/variant changes or activation.
# Dry-run proof SHA is mandatory before applying to the one owner-requested draft.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: '1=read-only proof, 0=repair exact existing draft'
        type: choice
        options: ['1', '0']
        default: '1'
        required: true
      expected_before_sha256:
        description: 'Apply only: before_sha256 from the latest dry-run report'
        type: string
        default: ''
        required: false

concurrency:
  group: daiso-daily-beauty-shopify
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checked-in exact repair scope
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # actions/checkout@v4
      - name: Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Existing pinned Shopify dependencies
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements/requirements-shopify.txt
      - name: Offline safety tests without credentials or network
        run: |
          python -B - <<'PY'
          import socket, unittest
          def blocked(*args, **kwargs):
              raise AssertionError('Network disabled for offline repair tests')
          socket.create_connection = blocked
          socket.socket.connect = blocked
          socket.socket.connect_ex = blocked
          suite = unittest.defaultTestLoader.discover('tests', pattern='test_shopify_repair_manual_draft.py', top_level_dir='tests')
          result = unittest.TextTestRunner().run(suite)
          raise SystemExit(0 if result.wasSuccessful() else 1)
          PY
      - name: Read proof or apply only this draft
        env:
          SHOPIFY_STORE: ${{ secrets.SHOPIFY_STORE }}
          SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
          REPAIR_DRY_RUN: ${{ inputs.dry_run }}
          EXPECTED_BEFORE_SHA256: ${{ inputs.expected_before_sha256 }}
        run: |
          args=(--pd-no 1084687 --dry-run "$REPAIR_DRY_RUN" --output out/shopify_manual_draft_repair.json)
          if [ "$REPAIR_DRY_RUN" = '0' ]; then
            args+=(--expected-before-sha256 "$EXPECTED_BEFORE_SHA256")
          fi
          python -B scripts/shopify_repair_manual_draft.py "${args[@]}"
      - name: Preserve proof and unique before-state backup
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # actions/upload-artifact@v4
        with:
          name: shopify-manual-draft-1084687
          path: out/shopify_manual_draft_repair*.json
          if-no-files-found: ignore
          retention-days: 7
