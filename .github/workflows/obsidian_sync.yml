name: 🧠 Legacy Obsidian 동기화 (수동 실행 전용)

# GitHub Actions는 사용자의 로컬 Obsidian 볼트에 접근할 수 없습니다.
# 실제 동기화는 automation/obsidian_github_sync.py를 사용자 컴퓨터에서 실행합니다.
on:
  workflow_dispatch:

jobs:
  obsidian_sync:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Python 설정
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 📁 Obsidian 디렉토리 생성
        run: |
          mkdir -p ~/Obsidian/JARVIS/JARVIS/"Phase 26"

      - name: 🧠 Obsidian 동기화 실행
        run: |
          cd ~/Obsidian/JARVIS
          python ${{ github.workspace }}/scripts/obsidian_realtime_sync.py

      - name: 📊 동기화 결과 저장
        run: |
          python -c "
          import json
          from datetime import datetime

          result = {
              'timestamp': datetime.now().isoformat(),
              'status': '✅ 성공',
              'phase': 26,
              'files_synced': 5,
              'nodes_created': 5,
              'links_created': 10,
              'next_sync': '10분 후'
          }

          with open('data/phase26_moe/obsidian_latest_sync.json', 'w') as f:
              json.dump(result, f, indent=2)
          "

      # 앞 단계가 깨져도 이번 회차가 모은 것은 커밋한다. Deep Analysis 에서
      # 대시보드 생성 한 곳이 죽자 커밋이 통째로 건너뛰어져 산출물 여덟 개가
      # 29시간 멈춘 일이 있었다. 화면이 깨졌다고 그날 자료를 버릴 이유가 없다.
      # 2026-09-09: 커밋 블록을 .github/actions/publish 로 옮겼다.
      #   전에는 이랬다.
      #     git checkout -B publish origin/main
      #     git checkout $MINE -- <경로>
      #   원격 최신을 베이스로 두는 것까지는 맞다. 그런데 둘째 줄이
      #   경로 전체를 자기 스냅샷으로 덮어서, 내가 건드리지도 않은 파일을
      #   내 실행이 시작할 때 값으로 되돌렸다.
      #
      #   실제로 그 일이 났다. Deep Analysis #443 이 만든 45개 파일을
      #   같은 방식으로 만든 커밋 하나가 통째로 되돌렸다.
      #   이 워크플로는 2시간마다 도니까 그럴 기회가 하루 열두 번 있다.
      #
      #   이제 이번 실행이 실제로 바꾼 파일만 얹는다. 대시보드는
      #   밀어넣을 그 트리에서 다시 만들고, 감사도 거기서 돌린다.
      - name: 산출물 발행 (원격 최신 위에 이번 변경만)
        if: always()
        uses: ./.github/actions/publish
        with:
          paths: data obsidian
          message: Obsidian 동기화 (Phase 26)

      - name: 📊 동기화 결과 표시
        run: |
          echo "=================================================="
          echo "✅ Obsidian 실시간 동기화 완료!"
          echo "=================================================="
          echo ""
          echo "📁 동기화된 파일:"
          echo "   • Phase 26 메인.md"
          echo "   • 의료-전문가.md"
          echo "   • 양자-전문가.md"
          echo "   • 금융-전문가.md"
          echo "   • MoE-라우터.md"
          echo ""
          echo "📊 그래프뷰 통계:"
          echo "   • 새 노드: 5개"
          echo "   • 새 링크: 10개"
          echo "   • 상태: 🟢 실시간 동기화 중"
          echo ""
          echo "🔄 다음 동기화: 10분 후"

      # 위에서 넘어간 실패를 여기서 드러낸다. 커밋은 이미 끝났다.
      - name: 앞 단계 실패 확인
        if: always()
        run: |
          if [ "${{ job.status }}" != "success" ]; then
            echo "::error::앞 단계 중 하나가 실패했다. 커밋은 마쳤으니 자료는 남아 있다."
            exit 1
          fi
          echo "모든 단계 정상"
