name: Shopify 이미지 대체텍스트 채우기 (기존 초안)

# 수동 실행만. 비어 있는 이미지 alt 만 채운다. 생성·가격·공개·이미지 교체 없음.
# 먼저 dry_run=1 로 읽기만 하고, 결과를 본 뒤 dry_run=0 으로 적용한다.
# 2026-10-17: 사용자 지정 기본 방식 상품(9590780723457, 다이소 1084687) 의 영문 이미지
# 11장 alt 가 모두 비어 있었다.
on:
  workflow_dispatch:
    inputs:
      pd_no:
        description: '다이소 상품번호 (매니페스트가 있는 것만)'
        type: choice
        options: ['1084687']
        default: '1084687'
        required: true
      dry_run:
        description: '1=읽기만, 0=비어 있는 alt 채우기'
        type: choice
        options: ['1', '0']
        default: '1'
        required: true

concurrency:
  group: daiso-daily-beauty-shopify
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  alt:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # actions/checkout@v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 고정 의존성
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements/requirements-shopify.txt
      - name: 오프라인 테스트 (네트워크 차단)
        run: |
          python -B - <<'PY'
          import socket, sys, unittest
          def blocked(*a, **k):
              raise AssertionError('network disabled')
          socket.create_connection = blocked
          socket.socket.connect = blocked
          sys.path.insert(0, 'scripts')
          suite = unittest.defaultTestLoader.loadTestsFromName('test_shopify_set_media_alt')
          raise SystemExit(0 if unittest.TextTestRunner().run(suite).wasSuccessful() else 1)
          PY
      - name: 읽기 또는 적용
        env:
          SHOPIFY_STORE: ${{ secrets.SHOPIFY_STORE }}
          SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
        run: python -B scripts/shopify_set_media_alt.py --pd-no "${{ inputs.pd_no }}" --dry-run "${{ inputs.dry_run }}"
      - name: 결과 보관
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # actions/upload-artifact@v4
        with:
          name: shopify-media-alt-${{ inputs.pd_no }}
          path: out/shopify_media_alt.json
          if-no-files-found: ignore
          retention-days: 7
