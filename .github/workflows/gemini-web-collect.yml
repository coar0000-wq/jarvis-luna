name: Gemini url_context 웹 채널 수집

# 결정적 파싱이 안 되는 사이트(Ulta/Sephora)를 Gemini url_context 로 수집한다.
# 이 데이터는 LLM 추출이라 신뢰 등급이 낮다. 가격 정책에는 쓰지 않는다.

on:
  workflow_dispatch:
  schedule:
    - cron: '40 20 * * *'   # 매일 05:40 KST

concurrency:
  group: gemini-web-collect
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 시크릿 확인
        id: guard
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "GEMINI_API_KEY 시크릿이 없습니다." >> $GITHUB_STEP_SUMMARY
            echo "ready=false" >> $GITHUB_OUTPUT
          else
            echo "ready=true" >> $GITHUB_OUTPUT
          fi

      - name: Gemini url_context 수집
        if: steps.guard.outputs.ready == 'true'
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # 저장소에 이 변수가 없으면 빈 문자열이 들어간다. 스크립트가
          # 빈 값을 받으면 API 에 모델 목록을 물어 고르도록 고쳤지만,
          # 애초에 빈 값을 넘기지 않는 편이 낫다.
          GEMINI_URL_MODEL: ${{ vars.GEMINI_URL_MODEL || '' }}
        run: python scripts/collect_via_gemini.py

      - name: 결과 요약
        if: always()
        run: |
          python - <<'PY' >> $GITHUB_STEP_SUMMARY
          import json
          from pathlib import Path
          f = Path("data/gemini_web_channels.json")
          if not f.exists():
              print("### 산출물 없음 - 수집이 실행되지 않았습니다.")
              raise SystemExit
          d = json.loads(f.read_text(encoding="utf-8"))
          print(f"### Gemini url_context 수집 결과 (모델 {d.get('model')})\n")
          print(f"총 {d['total']}건\n")
          for k, c in d["channels"].items():
              print(f"**{c['label']}** — {c['count']}건 / {c['status']}")
              if c["reason"]:
                  print(f"  - 사유: {c['reason'][:200]}")
              if c.get("url_context_result"):
                  print(f"  - url_context: {c['url_context_result'][:200]}")
              for p in c["products"][:5]:
                  print(f"  - {p['brand']} {p['product'][:50]} ${p['price_usd']}")
              print()
          print(f"\n> {d['trust_note']}")
          PY

      # 2026-09-09: 커밋 블록을 .github/actions/publish 로 옮겼다.
      #   전에는 이랬다.
      #     git checkout -B publish origin/main
      #     git checkout $MINE -- <경로>
      #   원격 최신을 베이스로 두는 것까지는 맞다. 그런데 둘째 줄이
      #   경로 전체를 자기 스냅샷으로 덮어서, 내가 건드리지도 않은 파일을
      #   내 실행이 시작할 때 값으로 되돌렸다.
      #
      #   실제로 그 일이 났다. Deep Analysis #443 이 만든 45개 파일을
      #   같은 방식으로 만든 커밋 하나가 통째로 되돌렸다.
      #   이 워크플로는 2시간마다 도니까 그럴 기회가 하루 열두 번 있다.
      #
      #   이제 이번 실행이 실제로 바꾼 파일만 얹는다. 대시보드는
      #   밀어넣을 그 트리에서 다시 만들고, 감사도 거기서 돌린다.
      - name: 산출물 발행 (원격 최신 위에 이번 변경만)
        uses: ./.github/actions/publish
        with:
          paths: data/gemini_web_channels.json
          message: Gemini url_context 웹 채널 수집 갱신

