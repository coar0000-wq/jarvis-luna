name: Gemini url_context 웹 채널 수집

# 결정적 파싱이 안 되는 사이트(Ulta/Sephora)를 Gemini url_context 로 수집한다.
# 이 데이터는 LLM 추출이라 신뢰 등급이 낮다. 가격 정책에는 쓰지 않는다.

on:
  workflow_dispatch:
  schedule:
    - cron: '40 20 * * *'   # 매일 05:40 KST

concurrency:
  group: gemini-web-collect
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 시크릿 확인
        id: guard
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "GEMINI_API_KEY 시크릿이 없습니다." >> $GITHUB_STEP_SUMMARY
            echo "ready=false" >> $GITHUB_OUTPUT
          else
            echo "ready=true" >> $GITHUB_OUTPUT
          fi

      - name: Gemini url_context 수집
        if: steps.guard.outputs.ready == 'true'
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_URL_MODEL: ${{ vars.GEMINI_URL_MODEL }}
        run: python scripts/collect_via_gemini.py

      - name: 결과 요약
        if: always()
        run: |
          python - <<'PY' >> $GITHUB_STEP_SUMMARY
          import json
          from pathlib import Path
          f = Path("data/gemini_web_channels.json")
          if not f.exists():
              print("### 산출물 없음 - 수집이 실행되지 않았습니다.")
              raise SystemExit
          d = json.loads(f.read_text(encoding="utf-8"))
          print(f"### Gemini url_context 수집 결과 (모델 {d.get('model')})\n")
          print(f"총 {d['total']}건\n")
          for k, c in d["channels"].items():
              print(f"**{c['label']}** — {c['count']}건 / {c['status']}")
              if c["reason"]:
                  print(f"  - 사유: {c['reason'][:200]}")
              if c.get("url_context_result"):
                  print(f"  - url_context: {c['url_context_result'][:200]}")
              for p in c["products"][:5]:
                  print(f"  - {p['brand']} {p['product'][:50]} ${p['price_usd']}")
              print()
          print(f"\n> {d['trust_note']}")
          PY

      - name: 커밋 및 푸시
        if: steps.guard.outputs.ready == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # 이번 실행이 만든 산출물을 임시 커밋으로 고정
          for pth in data/gemini_web_channels.json; do
            git add -A -- "$pth" 2>/dev/null || true
          done
          if git diff --cached --quiet; then
            echo "생성된 변경 없음"
            exit 0
          fi
          git commit -q -m "wip"
          MINE=$(git rev-parse HEAD)

          # 원격 최신을 베이스로 두고 그 위에 우리 산출물만 얹는다.
          # rebase 를 쓰지 않으므로 add/add 충돌이 구조적으로 발생하지 않는다.
          # (2026-09-01: rebase 방식이 manual_channels.json 충돌로 계속 실패해 교체)
          for i in 1 2 3 4 5; do
            git fetch -q origin main
            git checkout -q -B publish origin/main
              RESTORED=0
              for pth in data/gemini_web_channels.json; do
                if git checkout -q "$MINE" -- "$pth" 2>/dev/null; then
                  RESTORED=$((RESTORED+1))
                fi
                git add -A -- "$pth" 2>/dev/null || true
              done
            if [ "$RESTORED" -eq 0 ]; then
              echo "산출물 복원 실패 - 중단"
              exit 1
            fi
            if git diff --cached --quiet; then
              echo "원격과 동일 - 푸시 불필요"
              exit 0
            fi
            git commit -q -m "Gemini url_context 웹 채널 수집 갱신"
            if git push -q origin HEAD:main; then
              echo "push 성공 (시도 $i, 복원 경로 ${RESTORED}개)"
              exit 0
            fi
            echo "push 거절됨, 재시도 $i"
            git reset -q --hard "$MINE"
            sleep $((i * 4))
          done
          echo "5회 시도 후 push 실패"
          exit 1