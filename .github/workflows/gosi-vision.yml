name: DAISO GOSI Vision

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

concurrency:
  # 모든 main 자동 발행 워크플로가 공유하는 잠금 그룹
  group: main-publish
  # 동시에 들어온 실행을 최대 100개까지 대기열에 보관한다.
  queue: max
  # 실행 중인 데이터 생성은 중단하지 않고 다음 실행을 대기시킨다.
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 lxml

      - name: Collect DAISO GOSI
        run: |
          python scripts/collect_daiso_gosi.py

      - name: Commit updated gosi.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/gosi.json

          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update DAISO GOSI"
            git push
          fi
