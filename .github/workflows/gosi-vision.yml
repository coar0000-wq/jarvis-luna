name: 고시 수집·비전 추출

# 다이소 고시 항목과 상세 이미지를 받고, 이미지 안의 표를 Gemini 로 읽는다.
# Deep Analysis 안에도 같은 단계가 있지만 따로 돌려 확인할 수 있게 둔다.
on:
  workflow_dispatch:
  # Deep Analysis 에서 옮겨왔다. 다이소 Crawl-delay 를 지키느라 수집이 5분,
  # 이미지 판독이 최대 12분이라 30분 주기 job 안에 둘 수 없다.
  # 새로 들어온 상품만 읽으므로 대개 몇 초에 끝난다.
  schedule:
    - cron: "40 1,13 * * *"

permissions:
  contents: write

concurrency:
  group: gosi-vision
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 고시 항목·상세 이미지 수집
        continue-on-error: true
        run: python -u scripts/collect_daiso_gosi.py

      - name: 이미지에서 고시 표 읽기 (Gemini)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # 이 단계가 39분을 먹은 적이 있다. 예산을 넘으면 남은 건
          # 다음 회차로 미룬다.
          VISION_BUDGET_SEC: "900"
        run: python -u scripts/extract_gosi_vision.py

      - name: 등록 게이트 재계산
        run: python -u scripts/build_listing_gate.py

      - name: 결과 요약
        run: |
          python - <<'PY' >> $GITHUB_STEP_SUMMARY
          import json
          from pathlib import Path
          g = json.loads(Path("data/gosi.json").read_text(encoding="utf-8"))
          it = g.get("items") or {}
          req = ("ingredients", "volume", "maker", "origin")
          done = [k for k, v in it.items() if all(str(v.get(f) or "").strip() for f in req)]
          print("## 고시 추출\n")
          print(f"- 상태: {g.get('vision_status')}")
          print(f"- 필수 4항목 완료: **{len(done)}/{len(it)}**")
          print(f"- 실패: {len(g.get('vision_failures') or [])}건\n")
          print("| 상품 | 용량 | 전성분 길이 | 제조업자 |")
          print("|---|---|---|---|")
          for k, v in it.items():
              ing = str(v.get("ingredients") or "")
              print(f"| {str(v.get('name'))[:20]} | {str(v.get('volume') or '-')[:12]} "
                    f"| {len(ing)}자 | {str(v.get('maker') or '-')[:18]} |")
          gate = json.loads(Path("data/listing_gate.json").read_text(encoding="utf-8"))
          print(f"\n등록 가능 **{gate.get('ready')}/{gate.get('total')}** · "
                f"{gate.get('counts')}")
          PY

      # 앞 단계가 깨져도 이번 회차가 모은 것은 커밋한다. Deep Analysis 에서
      # 대시보드 생성 한 곳이 죽자 커밋이 통째로 건너뛰어져 산출물 여덟 개가
      # 29시간 멈춘 일이 있었다. 화면이 깨졌다고 그날 자료를 버릴 이유가 없다.
      # 2026-09-09: 커밋 블록을 .github/actions/publish 로 옮겼다.
      #   전에는 이랬다.
      #     git checkout -B publish origin/main
      #     git checkout $MINE -- <경로>
      #   원격 최신을 베이스로 두는 것까지는 맞다. 그런데 둘째 줄이
      #   경로 전체를 자기 스냅샷으로 덮어서, 내가 건드리지도 않은 파일을
      #   내 실행이 시작할 때 값으로 되돌렸다.
      #
      #   실제로 그 일이 났다. Deep Analysis #443 이 만든 45개 파일을
      #   같은 방식으로 만든 커밋 하나가 통째로 되돌렸다.
      #   이 워크플로는 2시간마다 도니까 그럴 기회가 하루 열두 번 있다.
      #
      #   이제 이번 실행이 실제로 바꾼 파일만 얹는다. 대시보드는
      #   밀어넣을 그 트리에서 다시 만들고, 감사도 거기서 돌린다.
      - name: 산출물 발행 (원격 최신 위에 이번 변경만)
        uses: ./.github/actions/publish
        with:
          paths: data/gosi.json data/listing_gate.json data/daiso_real/gosi_img
          message: 고시 표 비전 추출 및 게이트 재계산

      - name: 앞 단계 실패 확인
        if: always()
        run: |
          if [ "${{ job.status }}" != "success" ]; then
            echo "::error::앞 단계 중 하나가 실패했다. 커밋은 마쳤으니 자료는 남아 있다."
            exit 1
          fi
          echo "모든 단계 정상"
