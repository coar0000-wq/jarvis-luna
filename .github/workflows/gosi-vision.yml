name: 고시 수집·비전 추출

# 1) 다이소 API + 상세 이미지 다운로드
# 2) Gemini 비전으로 전성분·제조사·용량 읽기
# 3) gosi.json + 이미지 커밋
#
# 필요 시크릿: GEMINI_API_KEY
# (없으면 이미지 수집까지만 하고 비전은 건너뜀)

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

concurrency:
  group: main-publish
  cancel-in-progress: false

jobs:
  collect:
    name: Collect images + vision extract
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 lxml

      - name: Collect DAISO GOSI images
        run: python scripts/collect_daiso_gosi.py

      - name: Vision extract (ingredients / maker / volume)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          VISION_BUDGET_SEC: "1200"
        run: python scripts/extract_gosi_vision.py

      - name: Summary
        if: always()
        run: |
          python3 <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          p = Path("data/gosi.json")
          if not p.exists():
              print("gosi.json 없음")
              raise SystemExit
          d = json.loads(p.read_text(encoding="utf-8-sig"))
          items = d.get("items") or {}
          if isinstance(items, list):
              items = {str(i.get("pd_no")): i for i in items if isinstance(i, dict)}
          need = ("ingredients", "volume", "maker", "origin")
          done = sum(
              1 for r in items.values()
              if isinstance(r, dict) and all(str(r.get(f) or "").strip() for f in need)
          )
          print(f"## 고시 수집 결과")
          print(f"- 상품 {len(items)}건 · 필수 4항목 완료 **{done}/{len(items)}**")
          print(f"- vision_status: `{d.get('vision_status', '-')}`")
          print(f"- vision_note: {d.get('vision_note', '')[:200]}")
          fails = d.get("vision_failures") or []
          if fails:
              print(f"- 실패 {len(fails)}건")
              for f in fails[:8]:
                  print(f"  - {f.get('pd_no')}: {f.get('reason')}")
          print("")
          print("| pd_no | volume | maker | origin | ingredients |")
          print("|---|---|---|---|---|")
          for k, r in list(items.items())[:12]:
              if not isinstance(r, dict):
                  continue
              ing = str(r.get("ingredients") or "")
              print(
                  f"| {k} | {str(r.get('volume') or '')[:20]} | "
                  f"{str(r.get('maker') or '')[:24]} | "
                  f"{str(r.get('origin') or '')[:10]} | "
                  f"{len(ing)}자 |"
              )
          PY

      # 손으로 만든 커밋·푸시를 발행 액션으로 바꿨다 (2026-09-13)
      #
      # 마지막 남은 하나였다. 나머지 열 개는 이미 발행 액션을 쓴다.
      #
      # 옛 방식은 rebase 로 원격을 따라잡았다. 그런데 이 저장소는
      # 윈도우에서 대소문자만 다른 경로가 생기면 작업 폴더가 영구히
      # dirty 가 되어 rebase 가 막힌다. 오늘 그것 때문에 로컬에서
      # 푸시가 막혀 배관 명령으로 우회했다. 러너에서는 안 나지만
      # 같은 방식을 열한 곳에 두 가지로 두는 것 자체가 위험하다.
      #
      # 발행 액션은 rebase 를 쓰지 않는다. 최신 원격 위에 이번 실행이
      # 바꾼 파일만 골라 얹는다. 그리고 화장품 고시 보호가 들어 있다.
      # 이 워크플로가 바로 gosi.json 을 쓰는 곳이라 그 보호가 특히 맞다.
      - name: 산출물 발행 (원격 최신 위에 이번 변경만)
        if: always()
        uses: ./.github/actions/publish
        with:
          paths: >-
            data/gosi.json
            data/daiso_real/gosi_img
          message: 고시 이미지 수집 + 비전 추출 (전성분/제조사/용량)
