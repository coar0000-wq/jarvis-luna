name: DAISO GOSI Vision

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

concurrency:
  group: daiso-gosi
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 lxml

      - name: Collect DAISO GOSI
        run: |
          python scripts/collect_daiso_gosi.py

      - name: Commit updated gosi.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/gosi.json

          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update DAISO GOSI"
            git push
          fi
