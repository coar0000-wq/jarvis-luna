name: Daiso Candidate Metadata Recovery

# Metadata-only replay is NOT a new source collector and grants no fresh
# source-procedure authority. Its normal publish action DOES perform guarded
# local owner operations, so retain and authenticate that operations history.
# The source checkpoint is only a forensic copy of genuine-caller evidence.

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: 'Completed original candidate capture run (no recollection)'
        required: true
        type: string
      artifact_id:
        description: 'Digest-bound daiso-attempt artifact from that exact run'
        required: true
        type: string

concurrency:
  group: main-publish
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements/requirements-daiso.txt
      - name: Restore durable source safety before recovery
        id: source_safety
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -u scripts/restore_source_safety.py --root "$GITHUB_WORKSPACE"
      - name: Restore immutable operations safety before recovery
        id: operations_safety
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -u scripts/restore_operations_safety.py --root "$GITHUB_WORKSPACE"
      - name: Authenticate and retain original candidate capture bytes
        id: recovery
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          SOURCE_ARTIFACT_ID: ${{ inputs.artifact_id }}
        run: |
          python -u scripts/recover_daiso_candidates.py \
            --run-id "$SOURCE_RUN_ID" --artifact-id "$SOURCE_ARTIFACT_ID"
      - name: Publish verified recovered candidate metadata
        uses: ./.github/actions/publish
        env:
          JARVIS_SOURCE_CONTINUITY: ${{ steps.source_safety.outputs.continuity }}
          JARVIS_OPERATIONS_CONTINUITY: ${{ steps.operations_safety.outputs.operations_continuity }}
        with:
          paths: >-
            data/daiso_real/collection_status.json
            data/daiso_real/candidate_pool.json
            data/daiso_real/candidate_pool_history
            data/daiso_real/candidate_comparison.json
            data/agents/daiso_pipeline_receipts.json
            data/agents/daiso_pipeline_history
            data/agents/daiso_candidate_recovery.json
            data/publish_deletions.json
          message: '다이소 검증된 비교 후보 산출물 복구 발행 [source-recovery-offline]'
          regenerate-dashboard: 'false'
          audit: 'false'
      - name: Retain candidate recovery evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: daiso-candidate-recovery-${{ github.run_id }}
          path: |
            data/agents/daiso_candidate_recovery.json
            data/publish_deletions.json
          if-no-files-found: warn
          retention-days: 14
      - name: Pack durable source safety
        if: always() && steps.source_safety.outputs.continuity == 'verified'
        run: |
          python -u scripts/source_safety_checkpoint.py pack --root "$GITHUB_WORKSPACE" \
            --output "$RUNNER_TEMP/source-safety.zip" --repository "$GITHUB_REPOSITORY" \
            --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" --commit "$GITHUB_SHA"
      - name: Retain source safety checkpoint
        if: always() && steps.source_safety.outputs.continuity == 'verified'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: source-safety-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/source-safety.zip
          if-no-files-found: error
          retention-days: 14
      - name: Retain immutable operations safety history
        if: always() && steps.operations_safety.outputs.operations_continuity == 'verified'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: operations-safety-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            data/operations/state.json
            data/operations/state
            data/operations/reports
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30  # 3일이면 체인이 3일만 멈춰도 이력이 만료돼 영구 교착(2026-10-12~17). 공개 저장소라 보관 무료
