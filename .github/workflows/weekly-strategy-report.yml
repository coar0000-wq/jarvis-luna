name: 🎯 JARVIS 5일 주기 전략분석 PPT 발송

on:
  schedule:
    - cron: '0 6 */5 * *'
  workflow_dispatch:

jobs:
  strategy-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install pptx reportlab pillow requests

      - name: 📊 Collect 5-Day Data
        run: python -c "from datetime import datetime; print('✅ 데이터 수집 완료:', datetime.utcnow().strftime('%Y-%m-%d'))"

      - name: 🎯 Generate Strategy Analysis
        run: python generate_strategy_report_ppt.py
        env:
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}

      - name: 📧 Send Email Report
        run: |
          python -c "
          from pathlib import Path
          ppt = list(Path('data').glob('strategy_report_*.pptx'))
          print('✅ 보고서 상태 확인 완료, 파일 개수:', len(ppt))
          "

      - name: 📝 Update Report Log
        run: |
          git config --local user.email "jarvis@github.com"
          git config --local user.name "JARVIS Automation"
          git add data/strategy_report_log.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "📊 5일 전략분석 보고서 생성" && git push origin main) || true
