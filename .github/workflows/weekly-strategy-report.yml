name: 🎯 JARVIS 5일 주기 전략분석 PPT 발송

on:
  schedule:
    # 매월 1·6·11·16·21·26·31일 06:00 UTC (= 한국 시간 15:00)
    - cron: '0 6 */5 * *'
  workflow_dispatch:

jobs:
  strategy-report:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "python-pptx>=1.0.0,<2.0.0"

      - name: 📊 Collect 5-Day Data
        run: |
          python - << 'EOF'
          from datetime import datetime
          print('✅ 데이터 수집 완료:', datetime.utcnow().strftime('%Y-%m-%d'))
          EOF

      - name: 🎯 Generate Strategy Analysis and Send Email
        run: python generate_strategy_report_ppt.py
        env:
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}

      - name: 🔎 Verify generated report and dashboard data
        run: |
          python - << 'EOF'
          from pathlib import Path

          ppt_files = list(Path('data').glob('strategy_report_*.pptx'))
          json_files = list(Path('data').glob('strategy_report_*.json'))
          dashboard_json = Path('data/latest_strategy_report.json')

          print(f'📄 PPTX 파일: {len(ppt_files)}개')
          print(f'📊 JSON 분석 파일: {len(json_files)}개')
          print(f'🌐 Pages 최신 요약: {dashboard_json.exists()}')

          if not ppt_files:
              raise SystemExit('❌ PPTX 보고서가 생성되지 않았습니다.')
          if not dashboard_json.is_file():
              raise SystemExit('❌ Pages 대시보드용 최신 전략 요약이 생성되지 않았습니다.')
          EOF

      - name: 📝 Update report log
        run: |
          git config --local user.email "jarvis@github.com"
          git config --local user.name "JARVIS Automation"
          git add data/strategy_report_log.json \
            data/latest_strategy_report.json \
            data/strategy_report_*.pptx \
            data/strategy_report_*.json

          if git diff --cached --quiet; then
            echo "변경된 보고서 로그가 없습니다."
          else
            git commit -m "📊 5일 전략분석 보고서 생성: $(date -u +'%Y-%m-%d')"
            git push origin HEAD:main
          fi

      - name: ⚙️ Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: 🏗️ Build GitHub Pages site
        uses: actions/jekyll-build-pages@v1
        with:
          source: .
          destination: ./_site

      - name: 🌐 Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

      - name: 🚀 Publish GitHub Pages
        id: pages_deployment
        uses: actions/deploy-pages@v5

      - name: ✨ Report complete
        run: |
          echo "🎉 JARVIS 5일 주기 전략분석 완료!"
          echo "📧 수신자: coar0000@naver.com"
