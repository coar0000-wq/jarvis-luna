          python -m json.tool data/agents/autofix_report.json >/dev/null
          python -m json.tool data/agents/remediation_state.json >/dev/null
          python - <<'PY'
          import json
          from pathlib import Path

          state = json.loads(Path("data/agents/remediation_state.json").read_text(encoding="utf-8"))
          assert state.get("schema_version") == 1
          assert state.get("check_interval") == "2_hours"
          allowed = {
              "auto_remediable", "revalidate_only", "human_approval_required",
              "external_dependency", "informational",
          }
          for issue in (state.get("issues") or {}).values():
              assert issue.get("classification") in allowed
