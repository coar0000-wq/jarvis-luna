      # ------------------------------------------------------------
      # S등급 고시 누락 자동 복구
      #
      # 점수 변경으로 새 S등급이 생기면 별도 일일 고시 워크플로를 기다리지
      # 않는다. 2시간 비서실장 회차가 직접 누락을 감지하고, 누락이 있을
      # 때만 무료 Chromium을 설치해 렌더링된 공식 alt 원문을 읽는다.
      # 결제·유료 API·추정 생성은 없고 robots Crawl-delay를 지킨다.
      # ------------------------------------------------------------
      - name: S등급 고시 필수 항목 누락 감지
        id: s_gosi_gap
        run: |
          cat > "$RUNNER_TEMP/deep_35.sh" <<'RELEASE_STAGE_deep_35'
          python - <<'PY'
          import json, os
          from pathlib import Path
          data = Path("data")
          sdoc = json.loads((data / "daiso_real/shopify_s_recommendations.json").read_text(encoding="utf-8-sig"))
          gdoc = json.loads((data / "gosi.json").read_text(encoding="utf-8-sig"))
          items = gdoc.get("items") or {}
          need = ("ingredients", "volume", "maker", "origin")
          missing = []
          for p in sdoc.get("recommendations") or []:
              if p.get("grade") != "S":
                  continue
              pid = str(p.get("pd_no") or "")
              row = items.get(pid) if isinstance(items, dict) else {}
              if not isinstance(row, dict) or not all(str(row.get(k) or "").strip() for k in need):
                  missing.append(pid)
          print(f"S등급 고시 자동복구 대상 {len(missing)}건: {', '.join(missing) or '-'}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"count={len(missing)}\n")
          PY
          RELEASE_STAGE_deep_35
          python scripts/collector_result.py run --name deep_35 --required \
            --output "$RUNNER_TEMP/release-results/deep_35.json" -- bash -e "$RUNNER_TEMP/deep_35.sh"
      - name: 고시 원문 수집용 무료 브라우저 준비
