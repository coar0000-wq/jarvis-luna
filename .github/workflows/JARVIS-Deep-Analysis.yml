        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements/requirements-browser.txt
          playwright install --with-deps chromium

      - name: 렌더링된 공식 alt에서 S등급 고시 자동 복구
        if: steps.s_gosi_gap.outputs.count != '0'
