      # 고시·라벨·법률이 늦게 풀려 agent_ready 가 된 상품은 카피가
      # 비어 있다. 예전에는 S등급 정본이 바뀔 때만 카피 워크플로가 돌아
      # 그 칸이 몇 주씩 비어 있었다. 2시간마다 여기서 채운다.
      # 유료 모델은 부르지 않는다. 검증된 카피는 덮지 않는다.
