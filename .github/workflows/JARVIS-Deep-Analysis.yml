name: JARVIS Deep Analysis

on:
  schedule:
    - cron: '0,30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: jarvis-deep-analysis-main
  cancel-in-progress: false

jobs:
  deep-analysis:
    name: Collect, normalize, graph, train and publish runtime state
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
    # 단계 순서 = 데이터가 만들어지는 순서.
    # 예전에는 대시보드를 25번째에 만들고 점수·가격·마케팅·채널을 27~31번째에
    # 만들었다. 그래서 화면은 언제나 한 회차 전 숫자를 보여줬다. 소싱 S 5 와
    # 마케팅 S 12 가 어긋나 보인 것도, 채널이 계속 0/0 이던 것도 이 순서 탓이다.
    # 학습 전 대시보드 스냅샷은 없앴다. 어차피 뒤에서 덮어쓰는데 2만 8천개
    # 노트를 한 번 더 훑느라 시간만 먹었다.
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          fi
          if [ -f requirements-moe.txt ]; then
            python -m pip install -r requirements-moe.txt
          else
            python -m pip install numpy requests beautifulsoup4 lxml
          fi

      # =========================
      # REAL KNOWLEDGE
      # =========================

      - name: Collect robotics sources (arXiv cs.RO + robot media RSS)
        continue-on-error: true
        run: python scripts/collect_robotics.py

      - name: Collect institution reports and papers (35 orgs)
        continue-on-error: true
        run: python scripts/collect_institutions.py

      # 디자인 레퍼런스. 서버가 데이터를 그대로 주는 곳만 쓴다.
      # coolors·imweb·refero 를 왜 뺐는지는 산출물 rejected 에 적혀 있다.
      - name: 디자인 소스 수집 (폰트·팔레트·기사)
        continue-on-error: true
        timeout-minutes: 5
        run: python -u scripts/collect_design_sources.py

      - name: Build design team board (checklist + references)
        continue-on-error: true
        run: python scripts/build_design_team.py

      # 고시 수집(5분)과 Gemini 비전(39분)은 gosi-vision.yml 로 옮겼다.
      # 이 job 은 timeout-minutes 60 인데 그 둘이 44분을 먹어서 MoE 튜닝
      # 도중 한도에 걸렸고, 그 뒤 9단계(점수 재계산·가격 모델·대시보드
      # 최종 생성·커밋)가 전부 skipped 되었다. 대시보드가 갱신되지 않던
      # 이유 중 하나다. 느린 수집은 따로 돌린다.

      # 사람이 찾아낸 영상. data/manual/youtube_links.txt 에 URL 을 넣으면
      # 받아온다. robots.txt 가 /watch 는 막지 않아 개별 영상은 가능하다.
      # 지켜볼 채널. robots.txt 가 /@ 와 /channel/ 은 막지 않는다.
      # 검색 결과를 긁는 게 아니라 지정된 채널만 하나씩 본다.
      - name: 지정 YouTube 채널 수집 (최신 영상 목록)
        continue-on-error: true
        timeout-minutes: 8
        run: python -u scripts/ingest_youtube_channels.py

      - name: 지정 YouTube 영상 수집 (사람이 넣은 링크)
        continue-on-error: true
        timeout-minutes: 5
        run: python -u scripts/ingest_youtube_links.py

      - name: Build per-team feeds (route pools + FDA for legal)
        continue-on-error: true
        run: python -u scripts/build_team_feeds.py

      - name: Collect real public sources
        continue-on-error: true
        run: python real_knowledge_sync.py
        env:
          YOUTUBE_CHANNEL_IDS: ${{ secrets.YOUTUBE_CHANNEL_IDS }}
          GOOGLE_CSE_API_KEY: ${{ secrets.GOOGLE_CSE_API_KEY }}
          GOOGLE_CSE_ID: ${{ secrets.GOOGLE_CSE_ID }}
          KNOWLEDGE_QUERIES: ${{ vars.KNOWLEDGE_QUERIES }}

      # =========================
      # DAISO + US BEAUTY PIPELINE
      # =========================

      # 2026-08-31: 가짜 데이터 생성 단계 제거
      #   - oliveyoung_us_discovery.py : 하드코딩 15건 (archive 로 이동)
      #   - build_shopify_demand_matching.py : demand_score 등 조작값
      # 실제 다이소 수집은 daiso-real-collection.yml 이 담당한다.

      - name: Collect US Beauty Market
        continue-on-error: true
        run: python scripts/collect_us_beauty_data.py

      - name: Collect Open Beauty Facts (오픈데이터, 인증 불필요)
        continue-on-error: true
        run: python scripts/collect_open_beauty_facts.py

      - name: Collect OliveYoung US 베스트셀러 (실수집)
        continue-on-error: true
        run: python scripts/collect_oliveyoung_us.py

      - name: Collect Reddit beauty RSS (AsianBeauty 등, 키 불필요)
        continue-on-error: true
        run: python scripts/collect_reddit_beauty_rss.py

      - name: Collect public trend RSS (HN + Google News)
        continue-on-error: true
        run: python scripts/collect_public_trend_rss.py

      - name: Collect Google Trends beauty-only
        continue-on-error: true
        run: |
          if [ -f scripts/collect_google_trends_beauty.py ]; then
            python scripts/collect_google_trends_beauty.py
          else
            echo "beauty trends collector missing — skip"
          fi

      - name: Collect Google CSE (시크릿 있을 때만)
        continue-on-error: true
        env:
          GOOGLE_CSE_API_KEY: ${{ secrets.GOOGLE_CSE_API_KEY }}
          GOOGLE_CSE_ID: ${{ secrets.GOOGLE_CSE_ID }}
          KNOWLEDGE_QUERIES: ${{ vars.KNOWLEDGE_QUERIES }}
        run: python scripts/collect_google_cse.py

      - name: 수동 입력 채널 반영 (data/manual/)
        continue-on-error: true
        run: python scripts/ingest_manual_channels.py

      # =========================
      # TRAINING
      # =========================

      - name: Prepare transparent real-data corpus
        run: python prepare_real_training_corpus.py

      - name: Normalize Obsidian wikilinks
        continue-on-error: true
        run: |
          test -f scripts/normalize_obsidian_links.py
          # non-strict: ambiguous links are auto-resolved; unresolved only warns
          python scripts/normalize_obsidian_links.py

      - name: Rebuild Obsidian graph from real records
        run: |
          python organize_obsidian_graph.py
          if [ -f expand_obsidian_graph.py ]; then
            python expand_obsidian_graph.py
          fi

      - name: Train real-data 3-expert MoE
        continue-on-error: true
        timeout-minutes: 12
        run: python train_real_knowledge.py

      - name: Tune and promote 3-expert MoE
        continue-on-error: true
        timeout-minutes: 15
        run: |
          python tune_real_knowledge_moe.py \
            --experts 3 \
            --learning-rates 1.2 \
            --l2-values 0.0001 \
            --temperatures 0.9 \
            --steps 500 \
            --promote

      - name: Sync Global Channels and Fix Dashboard UI
        run: |
          if [ -f sync_channels.py ]; then
            python sync_channels.py
          fi
      # 미국 매체가 K뷰티를 어떻게 다루는지 센다. 판매 데이터가 아니라
      # 매체 노출 신호라 점수에는 넣지 않고, 어떤 상품군을 더 모을지
      # 정하는 근거로 쓴다. 첫 수집에서 스킨케어 언급이 85.9% 였다.
      - name: K뷰티 미국 기사 수집 (상품군·성분 언급 집계)
        continue-on-error: true
        timeout-minutes: 5
        run: python -u scripts/collect_kbeauty_news.py

      - name: 공개 소스 4종 수집 (Trends/Wikipedia/Allure/openFDA)
        continue-on-error: true
        run: python scripts/collect_public_signals.py

      - name: Score Shopify demand (다이소 실측 지표 기반)
        continue-on-error: true
        run: python scripts/daiso/score_shopify_demand.py

      - name: 한국→미국 실배송 원가 모델 계산
        continue-on-error: true
        run: python scripts/pricing_model.py

      - name: Legal auto-check (claims / functional / OTC / label)
        continue-on-error: true
        run: python -u scripts/check_legal_products.py

      - name: Build listing gate (copy/gosi/price/legal)
        continue-on-error: true
        run: python scripts/build_listing_gate.py

      # 법률팀이 "5항목 대기" 로 멈춰 있었는데 그중 넷은 이미 저장소에
      # 있는 값으로 채울 수 있었다. HS 코드는 미국 공식 HTS 에서 받는다.
      - name: 수출 서류 자동 준비 (HS코드·라벨 시안)
        continue-on-error: true
        timeout-minutes: 5
        run: python -u scripts/prepare_legal_export.py

      # 스토어 개설은 사람이 하지만 준비물은 미리 만들어 둔다.
      # 사용자가 만든 사이트를 브랜드 기준으로 삼는다.
      # 브랜드 키트보다 먼저 돌아야 그 값을 쓸 수 있다.
      - name: 내 사이트 수집 (브랜드 기준)
        continue-on-error: true
        timeout-minutes: 3
        run: python -u scripts/ingest_own_site.py

      - name: 브랜드 키트 준비 (색·글꼴·규격·정책)
        continue-on-error: true
        timeout-minutes: 3
        run: python -u scripts/prepare_brand_kit.py

      - name: 마케팅 조사 분석팀 보드 생성
        continue-on-error: true
        run: python scripts/build_market_team.py

      - name: 신규 수집 채널 발굴 (제안만, 자동 등록 안 함)
        continue-on-error: true
        run: python scripts/discover_channels.py

      # =========================
      # VALIDATION
      # =========================

      # 흩어진 실패 기록을 한 곳에 모은다. 막힘·고장·대기·보류를 나눈다.
      # 대시보드가 이걸 읽으므로 대시보드 생성보다 먼저 돌아야 한다.
      # 수집원을 직접 찔러본다. 메모가 아니라 결과를 남긴다.
      # 샌드박스는 FDA 에 차단당해 404 를 받는데 러너에서는 정상이다.
      # 그래서 러너에서 확인해야 한다.
      - name: 수집원 생존 확인 (러너에서 직접 호출)
        continue-on-error: true
        timeout-minutes: 5
        run: python -u scripts/check_source_health.py

      - name: 에러 보고서 생성 (막힘·고장·대기·보류)
        continue-on-error: true
        timeout-minutes: 3
        run: python -u scripts/build_error_report.py

      - name: Generate final dashboard snapshot
        timeout-minutes: 10
        run: python scripts/generate_dashboard_runtime.py

      # 팀이 보고한 숫자를 원본 파일과 대조한다. 스크립트가 오류 없이
      # 끝나도 숫자가 틀릴 수 있고, 실제로 이틀 동안 네 번 그랬다.
      # 여기서 빨갛게 뜨는 편이 조용히 틀린 값을 띄우는 것보다 낫다.
      - name: 팀 보고 숫자 감사 (카드 vs 원본 파일)
        timeout-minutes: 3
        run: python -u scripts/audit_team_reports.py

      - name: Validate real-data artifacts
        run: |
          python -m json.tool data/knowledge/real_sources.json >/dev/null
          python -m json.tool data/knowledge/training_status.json >/dev/null
          python -m json.tool data/dashboard_runtime.json >/dev/null

          test -f data/dashboard_runtime.json
          test -f data/knowledge/training_status.json

          python - <<'PY'
          import json
          from pathlib import Path

          runtime = json.loads(Path("data/dashboard_runtime.json").read_text(encoding="utf-8"))
          training = json.loads(Path("data/knowledge/training_status.json").read_text(encoding="utf-8"))

          assert "global_channels" in runtime
          assert "global_channels_status" in runtime, "채널 상태 메타가 없음"

          # 채널이 비어 있는 것은 정상이다. 비었는데 사유가 없으면 실패로 본다.
          for name, meta in runtime["global_channels_status"].items():
              if meta.get("count", 0) == 0:
                  assert meta.get("status") in ("empty", "disabled", "failed"), \
                      f"{name}: 빈 채널인데 상태가 {meta.get('status')}"
                  assert meta.get("reason"), f"{name}: 빈 채널인데 사유가 없음"

          assert "training" in runtime
          assert "graph" in runtime
          assert training["training_performed"] is True

          print("Validation OK")
          PY

      # =========================
      # COMMIT & PUSH
      # =========================

      - name: Commit generated knowledge and dashboard state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # 이번 실행이 만든 산출물을 임시 커밋으로 고정
          for pth in data obsidian; do
            git add -A -- "$pth" 2>/dev/null || true
          done
          if git diff --cached --quiet; then
            echo "생성된 변경 없음"
            exit 0
          fi
          git commit -q -m "wip"
          MINE=$(git rev-parse HEAD)

          # 원격 최신을 베이스로 두고 그 위에 우리 산출물만 얹는다.
          # rebase 를 쓰지 않으므로 add/add 충돌이 구조적으로 발생하지 않는다.
          # (2026-09-01: rebase 방식이 manual_channels.json 충돌로 계속 실패해 교체)
          for i in 1 2 3 4 5; do
            git fetch -q origin main
            git checkout -q -B publish origin/main
              RESTORED=0
              for pth in data obsidian; do
                if git checkout -q "$MINE" -- "$pth" 2>/dev/null; then
                  RESTORED=$((RESTORED+1))
                fi
                git add -A -- "$pth" 2>/dev/null || true
              done
            if [ "$RESTORED" -eq 0 ]; then
              echo "산출물 복원 실패 - 중단"
              exit 1
            fi
            if git diff --cached --quiet; then
              echo "원격과 동일 - 푸시 불필요"
              exit 0
            fi
            git commit -q -m "Run JARVIS Daiso + US Beauty Shopify Pipeline & Sync Channels"
            if git push -q origin HEAD:main; then
              echo "push 성공 (시도 $i, 복원 경로 ${RESTORED}개)"
              exit 0
            fi
            echo "push 거절됨, 재시도 $i"
            git reset -q --hard "$MINE"
            sleep $((i * 4))
          done
          echo "5회 시도 후 push 실패"
          exit 1
      - name: Complete summary
        if: always()
        run: |
          echo "JARVIS Deep Analysis finished."
          echo "Workflow: ${{ job.status }}"
