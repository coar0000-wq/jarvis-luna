          python scripts/collector_result.py run --name deep_47 --optional \
            --output "$RUNNER_TEMP/release-results/deep_47.json" -- bash -e "$RUNNER_TEMP/deep_47.sh"

      - name: Observe actual Actions freshness (read-only)
        env:
          GITHUB_TOKEN: ${{ github.token }}
