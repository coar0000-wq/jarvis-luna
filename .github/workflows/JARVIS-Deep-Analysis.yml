name: JARVIS Deep Analysis

on:
  schedule:
    # 실측 실행 간격을 고려해 2시간 주기
    - cron: '17 */2 * * *'

  workflow_dispatch:
    inputs:
      agents:
        description: '다중 에이전트 진단 실행'
        required: false
        default: true
        type: boolean

      autofix:
        description: 'Safe Auto-Fix 실행'
        required: false
        default: true
        type: boolean

permissions:
  contents: write
  # 끝에서 이번 실행의 개별 단계 결과를 읽으려면 필요하다.
  actions: read

concurrency:
  # 모든 main 자동 발행 워크플로가 공유하는 잠금 그룹
  group: main-publish
  # 실행 중인 데이터 생성은 중단하지 않고 다음 실행을 대기시킨다.
  cancel-in-progress: false
jobs:
  deep-analysis:
    name: Collect, normalize, graph, train and publish runtime state
    runs-on: ubuntu-latest
    timeout-minutes: 60

    # Jev(TypeSafe System One) 보조 판정을 무료 크레딧 한도 안에서만 쓴다.
    # 시크릿이 없으면 호출 없이 로컬 advisory 로 가므로 그대로 두어도 된다.
    # 크레딧 구매·자동충전은 하지 않는다. 한도에 닿거나 402·429 를 받으면
    # 그 회차는 거기서 멈추고 나머지는 무료 로컬 판정을 쓴다.
    env:
      TYPESAFE_ENABLED: '1'
      TYPESAFE_FREE_CREDITS_ONLY: '1'
      TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
      # Jev/로컬 판정이 부족하다고 구조적으로 확인된 회차에만 1회 호출한다.
      # 결과는 진단 advisory뿐이며 외부 실행·게시·결제에는 사용하지 않는다.
      GEMINI_FALLBACK_ENABLED: '1'
      GEMINI_FREE_TIER_ONLY: '1'
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

    steps:

      # =========================
      # CHECKOUT / PYTHON
      # =========================

      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install runtime dependencies
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements/requirements-deep.txt

      # =========================
      # REAL KNOWLEDGE
      # =========================

      - name: Collect robotics sources (arXiv cs.RO + robot media RSS)
        continue-on-error: true
        run: |
          cat > "$RUNNER_TEMP/deep_01.sh" <<'RELEASE_STAGE_deep_01'
          python scripts/collect_robotics.py
          RELEASE_STAGE_deep_01
          python scripts/collector_result.py run --name deep_01 --optional \
            --output "$RUNNER_TEMP/release-results/deep_01.json" -- bash -e "$RUNNER_TEMP/deep_01.sh"

      - name: Collect institution reports and papers (35 orgs)
        continue-on-error: true
        run: |
          cat > "$RUNNER_TEMP/deep_02.sh" <<'RELEASE_STAGE_deep_02'
          python scripts/collect_institutions.py
          RELEASE_STAGE_deep_02
          python scripts/collector_result.py run --name deep_02 --optional \
            --output "$RUNNER_TEMP/release-results/deep_02.json" -- bash -e "$RUNNER_TEMP/deep_02.sh"

      - name: 디자인 소스 수집 (폰트·팔레트·기사)
        continue-on-error: true
        timeout-minutes: 5
        run: |
          cat > "$RUNNER_TEMP/deep_03.sh" <<'RELEASE_STAGE_deep_03'
          python -u scripts/collect_design_sources.py
          RELEASE_STAGE_deep_03
          python scripts/collector_result.py run --name deep_03 --optional \
            --output "$RUNNER_TEMP/release-results/deep_03.json" -- bash -e "$RUNNER_TEMP/deep_03.sh"

      - name: Build design team board (checklist + references)
        continue-on-error: true
        run: |
          cat > "$RUNNER_TEMP/deep_04.sh" <<'RELEASE_STAGE_deep_04'
          python scripts/build_design_team.py
          RELEASE_STAGE_deep_04
          python scripts/collector_result.py run --name deep_04 --optional \
            --output "$RUNNER_TEMP/release-results/deep_04.json" -- bash -e "$RUNNER_TEMP/deep_04.sh"

      - name: 지정 YouTube 채널 수집 (최신 영상 목록)
        continue-on-error: true
        timeout-minutes: 8
        run: |
          cat > "$RUNNER_TEMP/deep_05.sh" <<'RELEASE_STAGE_deep_05'
          python -u scripts/ingest_youtube_channels.py
          RELEASE_STAGE_deep_05
          python scripts/collector_result.py run --name deep_05 --optional \
            --output "$RUNNER_TEMP/release-results/deep_05.json" -- bash -e "$RUNNER_TEMP/deep_05.sh"

      - name: 지정 YouTube 영상 수집 (사람이 넣은 링크)
        continue-on-error: true
        timeout-minutes: 5
        run: |
          cat > "$RUNNER_TEMP/deep_06.sh" <<'RELEASE_STAGE_deep_06'
          python -u scripts/ingest_youtube_links.py
          RELEASE_STAGE_deep_06
          python scripts/collector_result.py run --name deep_06 --optional \
            --output "$RUNNER_TEMP/release-results/deep_06.json" -- bash -e "$RUNNER_TEMP/deep_06.sh"

      - name: 논문 수집 (사람 지정)
        continue-on-error: true
        timeout-minutes: 10
        run: |
          cat > "$RUNNER_TEMP/deep_07.sh" <<'RELEASE_STAGE_deep_07'
          python -u scripts/ingest_papers.py
          RELEASE_STAGE_deep_07
          python scripts/collector_result.py run --name deep_07 --optional \
            --output "$RUNNER_TEMP/release-results/deep_07.json" -- bash -e "$RUNNER_TEMP/deep_07.sh"

      - name: Build per-team feeds (route pools + FDA for legal)
        continue-on-error: true
        run: |
          cat > "$RUNNER_TEMP/deep_08.sh" <<'RELEASE_STAGE_deep_08'
          python -u scripts/build_team_feeds.py
          RELEASE_STAGE_deep_08
          python scripts/collector_result.py run --name deep_08 --optional \
            --output "$RUNNER_TEMP/release-results/deep_08.json" -- bash -e "$RUNNER_TEMP/deep_08.sh"

      - name: Collect real public sources
        continue-on-error: true
        run: |
          cat > "$RUNNER_TEMP/deep_09.sh" <<'RELEASE_STAGE_deep_09'
          python real_knowledge_sync.py
          RELEASE_STAGE_deep_09
          python scripts/collector_result.py run --name deep_09 --optional \
            --output "$RUNNER_TEMP/release-results/deep_09.json" -- bash -e "$RUNNER_TEMP/deep_09.sh"
        env:
          YOUTUBE_CHANNEL_IDS: ${{ secrets.YOUTUBE_CHANNEL_IDS }}
          GOOGLE_CSE_API_KEY: ${{ secrets.GOOGLE_CSE_API_KEY }}
          GOOGLE_CSE_ID: ${{ secrets.GOOGLE_CSE_ID }}
          KNOWLEDGE_QUERIES: ${{ vars.KNOWLEDGE_QUERIES }}

      # =========================
      # DAISO + US BEAUTY PIPELINE
      # =========================

      - name: Collect Open Beauty Facts (오픈데이터, 인증 불필요)
        continue-on-error: true
        run: |
          cat > "$RUNNER_TEMP/deep_10.sh" <<'RELEASE_STAGE_deep_10'
          python scripts/collect_open_beauty_facts.py
          RELEASE_STAGE_deep_10
          python scripts/collector_result.py run --name deep_10 --optional \
            --output "$RUNNER_TEMP/release-results/deep_10.json" -- bash -e "$RUNNER_TEMP/deep_10.sh"

      - name: Collect OliveYoung US 베스트셀러 (실수집)
        continue-on-error: true
        run: |
          cat > "$RUNNER_TEMP/deep_11.sh" <<'RELEASE_STAGE_deep_11'
          python scripts/collect_oliveyoung_us.py
          RELEASE_STAGE_deep_11
          python scripts/collector_result.py run --name deep_11 --optional \
            --output "$RUNNER_TEMP/release-results/deep_11.json" -- bash -e "$RUNNER_TEMP/deep_11.sh"

      - name: Collect Reddit beauty RSS (AsianBeauty 등, 키 불필요)
        continue-on-error: true
        run: |
          cat > "$RUNNER_TEMP/deep_12.sh" <<'RELEASE_STAGE_deep_12'
          python scripts/collect_reddit_beauty_rss.py
          RELEASE_STAGE_deep_12
          python scripts/collector_result.py run --name deep_12 --optional \
            --output "$RUNNER_TEMP/release-results/deep_12.json" -- bash -e "$RUNNER_TEMP/deep_12.sh"

      - name: Collect public trend RSS (HN + Google News)
        continue-on-error: true
        run: |
          cat > "$RUNNER_TEMP/deep_13.sh" <<'RELEASE_STAGE_deep_13'
          python scripts/collect_public_trend_rss.py
          RELEASE_STAGE_deep_13
          python scripts/collector_result.py run --name deep_13 --optional \
            --output "$RUNNER_TEMP/release-results/deep_13.json" -- bash -e "$RUNNER_TEMP/deep_13.sh"

      - name: Collect Google Trends beauty-only
        continue-on-error: true
        run: |
          cat > "$RUNNER_TEMP/deep_14.sh" <<'RELEASE_STAGE_deep_14'
          if [ -f scripts/collect_google_trends_beauty.py ]; then
            python scripts/collect_google_trends_beauty.py
          else
            echo "beauty trends collector missing — skip"
          fi
          RELEASE_STAGE_deep_14
          python scripts/collector_result.py run --name deep_14 --optional \
            --output "$RUNNER_TEMP/release-results/deep_14.json" -- bash -e "$RUNNER_TEMP/deep_14.sh"
      - name: Collect Google CSE (시크릿 있을 때만)
        continue-on-error: true
        env:
          GOOGLE_CSE_API_KEY: ${{ secrets.GOOGLE_CSE_API_KEY }}
          GOOGLE_CSE_ID: ${{ secrets.GOOGLE_CSE_ID }}
          KNOWLEDGE_QUERIES: ${{ vars.KNOWLEDGE_QUERIES }}
        run: |
          cat > "$RUNNER_TEMP/deep_15.sh" <<'RELEASE_STAGE_deep_15'
          python scripts/collect_google_cse.py
          RELEASE_STAGE_deep_15
          python scripts/collector_result.py run --name deep_15 --optional \
            --output "$RUNNER_TEMP/release-results/deep_15.json" -- bash -e "$RUNNER_TEMP/deep_15.sh"

      - name: 수동 입력 채널 반영 (data/manual/)
        continue-on-error: true
        run: |
          cat > "$RUNNER_TEMP/deep_16.sh" <<'RELEASE_STAGE_deep_16'
          python scripts/ingest_manual_channels.py
          RELEASE_STAGE_deep_16
          python scripts/collector_result.py run --name deep_16 --optional \
            --output "$RUNNER_TEMP/release-results/deep_16.json" -- bash -e "$RUNNER_TEMP/deep_16.sh"

      # =========================
      # TRAINING / OBSIDIAN
      # =========================

      - name: Prepare transparent real-data corpus
        run: |
          cat > "$RUNNER_TEMP/deep_17.sh" <<'RELEASE_STAGE_deep_17'
          python prepare_real_training_corpus.py
          RELEASE_STAGE_deep_17
          python scripts/collector_result.py run --name deep_17 --required \
            --output "$RUNNER_TEMP/release-results/deep_17.json" -- bash -e "$RUNNER_TEMP/deep_17.sh"

      # 팀 자기개선 루프 (2026-09-28)
      # 측정 -> 후보 -> 그림자 평가 -> 채택/보류 -> 실측 악화 시 자동 롤백.
      # 무료·외부 호출 없음·data/self_improve 정책 파일만 바꾼다.
      # 그래프 재생성 앞에 둔다. 채택한 분류 키워드가 같은 회차에 바로 반영된다.
      # 한 루프가 죽어도 발행은 막지 않는다. status.json 에 error 로 남는다.
      - name: 팀 자기개선 루프
        continue-on-error: true
        run: |
          cat > "$RUNNER_TEMP/deep_18.sh" <<'RELEASE_STAGE_deep_18'
          python -u scripts/self_improve.py
          RELEASE_STAGE_deep_18
          python scripts/collector_result.py run --name deep_18 --optional \
            --output "$RUNNER_TEMP/release-results/deep_18.json" -- bash -e "$RUNNER_TEMP/deep_18.sh"

      - name: Normalize Obsidian wikilinks
        continue-on-error: true
        run: |
          cat > "$RUNNER_TEMP/deep_19.sh" <<'RELEASE_STAGE_deep_19'
          if [ -f scripts/normalize_obsidian_links.py ]; then
            python scripts/normalize_obsidian_links.py
          else
            echo "normalize_obsidian_links.py missing — skip"
          fi
          RELEASE_STAGE_deep_19
          python scripts/collector_result.py run --name deep_19 --optional \
            --output "$RUNNER_TEMP/release-results/deep_19.json" -- bash -e "$RUNNER_TEMP/deep_19.sh"
      - name: Rebuild Obsidian graph from real records
        run: |
          cat > "$RUNNER_TEMP/deep_20.sh" <<'RELEASE_STAGE_deep_20'
          python organize_obsidian_graph.py

          if [ -f expand_obsidian_graph.py ]; then
            python expand_obsidian_graph.py
          fi
          RELEASE_STAGE_deep_20
          python scripts/collector_result.py run --name deep_20 --required \
            --output "$RUNNER_TEMP/release-results/deep_20.json" -- bash -e "$RUNNER_TEMP/deep_20.sh"
      - name: 팀 허브 생성 (그래프 층 나누기)
        continue-on-error: true
        timeout-minutes: 5
        run: |
          cat > "$RUNNER_TEMP/deep_21.sh" <<'RELEASE_STAGE_deep_21'
          python -u scripts/build_team_hubs.py
          RELEASE_STAGE_deep_21
          python scripts/collector_result.py run --name deep_21 --optional \
            --output "$RUNNER_TEMP/release-results/deep_21.json" -- bash -e "$RUNNER_TEMP/deep_21.sh"

      # =========================
      # MoE
      # =========================

      - name: MoE 튜닝 후 승격 (실측 말뭉치만)
        continue-on-error: true
        timeout-minutes: 10
        run: |
          cat > "$RUNNER_TEMP/deep_22.sh" <<'RELEASE_STAGE_deep_22'
          python -u tune_real_knowledge_moe.py \
            --experts 3,4 \
            --learning-rates 5.0 \
            --l2-values 0.0001 \
            --temperatures 0.9 \
            --steps 300 \
            --promote
          RELEASE_STAGE_deep_22
          python scripts/collector_result.py run --name deep_22 --required \
            --output "$RUNNER_TEMP/release-results/deep_22.json" -- bash -e "$RUNNER_TEMP/deep_22.sh"
      # MoE 팀 배정기 (2026-09-28): 자료·영상이 어느 팀 일인지 배운다.
      # 출처가 확실한 정답만 쓰고, 다수 클래스 기준선을 못 넘으면 승격하지 않는다.
      # 다음 회차의 영상 팀 배정(team_routing.py)과 주간 검토 큐가 이 모델을 쓴다.
      - name: MoE 팀 배정기 학습·조건부 승격
        continue-on-error: true
        timeout-minutes: 8
        run: |
          cat > "$RUNNER_TEMP/deep_23.sh" <<'RELEASE_STAGE_deep_23'
          python -u scripts/team_router_moe.py --train
          RELEASE_STAGE_deep_23
          python scripts/collector_result.py run --name deep_23 --required \
            --output "$RUNNER_TEMP/release-results/deep_23.json" -- bash -e "$RUNNER_TEMP/deep_23.sh"

      # 모든 팀 YouTube 학습 (2026-09-28)
      # 주간 자막 검토 큐를 만들고 팀별 학습 보드를 갱신한다. 검토 자체는
      # Aside 정기 루틴이 Gemini Notebook 으로 하고 ingest_notebook_review.py 로 합친다.
      - name: YouTube 검토 큐·팀 학습 보드
        continue-on-error: true
        run: |
          cat > "$RUNNER_TEMP/deep_24.sh" <<'RELEASE_STAGE_deep_24'
          python -u scripts/build_youtube_review_queue.py
          python -u scripts/build_team_learning.py
          RELEASE_STAGE_deep_24
          python scripts/collector_result.py run --name deep_24 --optional \
            --output "$RUNNER_TEMP/release-results/deep_24.json" -- bash -e "$RUNNER_TEMP/deep_24.sh"
      # =========================
      # GLOBAL CHANNELS
      # =========================

      # 미국 K뷰티 편집숍 판매 목록 (2026-09-28, 공개 상품 JSON · robots 허용)
      - name: Collect Soko Glam (미국 K뷰티 편집숍)
        continue-on-error: true
        run: |
          cat > "$RUNNER_TEMP/deep_25.sh" <<'RELEASE_STAGE_deep_25'
          python -u scripts/collect_sokoglam.py
          RELEASE_STAGE_deep_25
          python scripts/collector_result.py run --name deep_25 --optional \
            --output "$RUNNER_TEMP/release-results/deep_25.json" -- bash -e "$RUNNER_TEMP/deep_25.sh"

      - name: Sync Global Channels and Fix Dashboard UI
        run: |
          cat > "$RUNNER_TEMP/deep_26.sh" <<'RELEASE_STAGE_deep_26'
          if [ -f sync_channels.py ]; then
            python sync_channels.py
          fi
          RELEASE_STAGE_deep_26
          python scripts/collector_result.py run --name deep_26 --required \
            --output "$RUNNER_TEMP/release-results/deep_26.json" -- bash -e "$RUNNER_TEMP/deep_26.sh"
      - name: K뷰티 미국 기사 수집 (상품군·성분 언급 집계)
        continue-on-error: true
        timeout-minutes: 5
        run: |
          cat > "$RUNNER_TEMP/deep_27.sh" <<'RELEASE_STAGE_deep_27'
          python -u scripts/collect_kbeauty_news.py
          RELEASE_STAGE_deep_27
          python scripts/collector_result.py run --name deep_27 --optional \
            --output "$RUNNER_TEMP/release-results/deep_27.json" -- bash -e "$RUNNER_TEMP/deep_27.sh"

      - name: 공개 소스 4종 수집 (Trends/Wikipedia/Allure/openFDA)
        continue-on-error: true
        run: |
          cat > "$RUNNER_TEMP/deep_28.sh" <<'RELEASE_STAGE_deep_28'
          python scripts/collect_public_signals.py
          RELEASE_STAGE_deep_28
          python scripts/collector_result.py run --name deep_28 --optional \
            --output "$RUNNER_TEMP/release-results/deep_28.json" -- bash -e "$RUNNER_TEMP/deep_28.sh"

      # =========================
      # FX / SCORE
      # =========================

      - name: 환율 갱신 (USD/KRW)
        continue-on-error: true
        timeout-minutes: 3
        run: |
          cat > "$RUNNER_TEMP/deep_29.sh" <<'RELEASE_STAGE_deep_29'
          python -u scripts/fetch_fx_rate.py
          RELEASE_STAGE_deep_29
          python scripts/collector_result.py run --name deep_29 --optional \
            --output "$RUNNER_TEMP/release-results/deep_29.json" -- bash -e "$RUNNER_TEMP/deep_29.sh"

      - name: Build product master (canonical_product_id)
        continue-on-error: true
        run: |
          cat > "$RUNNER_TEMP/deep_30.sh" <<'RELEASE_STAGE_deep_30'
          python scripts/build_product_master.py --inject-s
          RELEASE_STAGE_deep_30
          python scripts/collector_result.py run --name deep_30 --optional \
            --output "$RUNNER_TEMP/release-results/deep_30.json" -- bash -e "$RUNNER_TEMP/deep_30.sh"

      - name: Score Shopify demand (다이소 실측 지표 기반)
        continue-on-error: true
        run: |
          cat > "$RUNNER_TEMP/deep_31.sh" <<'RELEASE_STAGE_deep_31'
          python scripts/daiso/score_shopify_demand.py
          python scripts/build_product_master.py --inject-s
          RELEASE_STAGE_deep_31
          python scripts/collector_result.py run --name deep_31 --optional \
            --output "$RUNNER_TEMP/release-results/deep_31.json" -- bash -e "$RUNNER_TEMP/deep_31.sh"
      - name: 한국→미국 실배송 원가 모델 계산
        continue-on-error: true
        run: |
          cat > "$RUNNER_TEMP/deep_32.sh" <<'RELEASE_STAGE_deep_32'
          python scripts/pricing_model.py
          RELEASE_STAGE_deep_32
          python scripts/collector_result.py run --name deep_32 --optional \
            --output "$RUNNER_TEMP/release-results/deep_32.json" -- bash -e "$RUNNER_TEMP/deep_32.sh"

      # ------------------------------------------------------------
      # 손익이 안 나는 상품은 수집 대상에서 뻐다.
      #
      # 사용자가 말했다.  "손익분기 미달이면 수집하지마"
      #
      # category_map.json 은 이름으로 받기 전에 거른다. 그것과 같은
      # 이야기를 돈으로 하는 단계다. 다만 무게·용량·시장가를 알아야
      # 착지원가가 나오므로 한 번은 받아야 한다. 그 뒤로는 안 받는다.
      #
      # 가격 모델 뒤에 둔다. 그 결과를 보고 판단하기 때문이다.
      # 뺀 뒤에는 점수와 가격을 한 번 더 돌려 숫자를 맞춘다.
      # 빼는 일은 줄이기만 하므로 한 번이면 끝난다.
      # ------------------------------------------------------------
      - name: 손익 미달 상품 제외
        continue-on-error: true
        run: |
          cat > "$RUNNER_TEMP/deep_33.sh" <<'RELEASE_STAGE_deep_33'
          python -u scripts/daiso/exclude_unprofitable.py --apply

          # 환율·배송비·시장가가 바뀜어 다시 파는 것은 되돌린다.
          python -u scripts/daiso/exclude_unprofitable.py --restore --apply
          RELEASE_STAGE_deep_33
          python scripts/collector_result.py run --name deep_33 --optional \
            --output "$RUNNER_TEMP/release-results/deep_33.json" -- bash -e "$RUNNER_TEMP/deep_33.sh"
      - name: 제외 반영해 점수·원가 다시 계산
        run: |
          cat > "$RUNNER_TEMP/deep_34.sh" <<'RELEASE_STAGE_deep_34'
          python -u scripts/build_product_master.py --inject-s
          python -u scripts/daiso/score_shopify_demand.py
          python -u scripts/build_product_master.py --inject-s
          python -u scripts/pricing_model.py
          RELEASE_STAGE_deep_34
