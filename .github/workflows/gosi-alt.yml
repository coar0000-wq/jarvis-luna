# 고시를 렌더링된 페이지의 img alt 에서 글자로 꺼낸다
#
# 왜 이 워크플로가 따로 필요한가 (2026-09-13)
#
#   고시는 모든 다이소 제품에 있다. 자리는 두 곳이다.
#     ① 「상품정보 제공 고시」 표 — 11항목인데 대부분 "상세페이지 참조"
#     ② img 의 alt — ①이 가리키는 그 상세페이지. 실제 내용이 여기 있다.
#
#   그런데 ②는 HTTP 로 받은 원본 HTML 에 없다. 상품 3개로 쟀다.
#     HTML 43,799자 · 200자 넘는 alt 0개 · editor-content 영역 없음
#   스크립트가 그리기 때문이다. 그래서 브라우저가 필요하다.
#
#   대신 좋은 점이 있다. alt 가 이미 글자다.
#   이미지를 내려받아 비전 모델로 읽을 필요가 없다.
#   GEMINI_API_KEY 도 필요 없다. gosi-vision.yml 이 그 키가 없어
#   매번 "비전 추출을 건너뜁니다" 경고를 내던 문제가 여기서는 없다.
#
# robots.txt (2026-09-13 확인)
#   /pd/pdr/ 은 Allow. Crawl-delay 30 을 지킨다.
#   그래서 한 회차에 많이 보지 않는다. 기본 12건이다.

name: 고시 alt 수집 (브라우저)

on:
  workflow_dispatch:
    inputs:
      pd_no:
        description: '특정 상품번호만 (비우면 고시 없는 S등급 전체)'
        required: false
        default: ''
      max_items:
        description: '한 번에 볼 최대 개수'
        required: false
        default: '12'

  schedule:
    # 하루 한 번. Crawl-delay 30 이라 12건이면 6분쯤 걸린다.
    - cron: '40 18 * * *'

permissions:
  contents: write

concurrency:
  group: main-publish
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 브라우저 설치
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install --with-deps chromium

      - name: 수집 전 고시 상태
        continue-on-error: true
        run: python -u scripts/guard_gosi.py

      - name: alt 에서 고시 꺼내기
        env:
          DAISO_DELAY: '30'
          DAISO_GOSI_MAX: ${{ inputs.max_items || '12' }}
        run: |
          if [ -n "${{ inputs.pd_no }}" ]; then
            python -u scripts/daiso/collect_gosi_alt.py "${{ inputs.pd_no }}"
          else
            python -u scripts/daiso/collect_gosi_alt.py
          fi

      # 고시가 채워졌으면 영문 라벨까지 이어서 간다.
      # 여기서 안 이으면 다음 참모장 회차를 기다려야 한다.
      # 사용자가 "순서에 맞게 착착" 이라고 한 것이 이것이다.
      - name: 영문 라벨로 옮기기
        run: python -u scripts/sync_gosi_to_us_labels.py

      # 2026-09-16: 여기에 법률 점검이 빠져 있었다.
      #
      # 법률 자동 점검 항목 중에 label_required(영문 라벨 필수 항목
      # 구비)가 있다. 바로 위에서 라벨을 채워 놓고 법률을 다시 안
      # 돌리면, 게이트는 라벨이 비었던 시절의 판정을 그대로 읽는다.
      #
      # 실제로 그랬다. 고시 5건을 채우고 라벨까지 만들었는데
      # legal 이 "자동 점검 미통과: label_fields" 로 막고 있었다.
      # check_legal_products.py 를 다시 돌리니 5건 모두 풀렸다.
      # 막힌 것이 아니라 낡은 판정이었다.
      #
      # 순서를 지킨다.  고시 -> 라벨 -> 법률 -> 게이트
      - name: 법률 자동 점검 갱신
        run: python -u scripts/check_legal_products.py

      - name: 등록 게이트와 파생 보드 재계산
        run: |
          python -u scripts/build_legal_full.py
          python -u scripts/build_listing_gate.py
          python -u scripts/build_product_master.py --inject-s
          python -u scripts/build_market_team.py
          python -u scripts/export_shopify_operational.py

      - name: 화장품 고시 보호 (덮였으면 복구, 못 하면 중단)
        run: python -u scripts/guard_gosi.py --restore

      - name: 결과 요약
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path

          g = json.loads(Path("data/gosi.json").read_text(encoding="utf-8"))
          meta = g.get("alt_수집") or {}
          print("## 고시 alt 수집")
          print(f"- 대상 {meta.get('대상')}건 · 채움 {meta.get('채움')}건 "
                f"· 못 찾음 {len(meta.get('못찾음') or [])}건")
          print()
          print("| 상품 | alt 길이 | 찾은 항목 | 채운 칸 |")
          print("|---|---|---|---|")
          for r in (meta.get("상품별") or [])[:20]:
              print(f"| {r.get('pd_no')} | {r.get('alt_len')} | "
                    f"{', '.join(r.get('찾음') or []) or '-'} | "
                    f"{', '.join(r.get('채움') or []) or '-'} |")

          gate = json.loads(Path("data/listing_gate.json").read_text(encoding="utf-8"))
          print()
          print(f"등록 가능 {gate.get('ready')}/{gate.get('total')} "
                f"· 막힘 {gate.get('blockers')}")
          PY

      - name: 산출물 발행 (원격 최신 위에 이번 변경만)
        if: always()
        uses: ./.github/actions/publish
        with:
          # legal_products.json 도 넣는다. (2026-09-16)
          # 이 워크플로가 법률 자동 점검을 다시 돌리는데 그 결과가 경로에
          # 없으면 발행되지 않아 원거 main 이 낡은 판정을 유지한다.
          paths: >-
            data/gosi.json
            data/daiso_real/daiso_us_labels.json
            data/daiso_real/us_label_sync_report.json
            data/legal_products.json
            data/legal_full.json
            data/listing_gate.json
            data/daiso_real/shopify_s_recommendations.json
            data/product_master.json
            data/market_team.json
            data/marketing_priority.csv
            data/shopify_exports
            data/dashboard_runtime.json
          message: 고시를 렌더링된 페이지 alt 에서 꺼낸다
