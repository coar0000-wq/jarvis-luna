name: Image localization OCR regression

on:
  pull_request:
    paths:
      - 'scripts/daiso/localize_detail_images.py'
      - 'scripts/test_localize_detail_images.py'
      - '.github/workflows/image-ocr-tests.yml'
      - 'requirements/requirements-shopify.txt'
  push:
    branches: [main]
    paths:
      - 'scripts/daiso/localize_detail_images.py'
      - 'scripts/test_localize_detail_images.py'
      - '.github/workflows/image-ocr-tests.yml'
      - 'requirements/requirements-shopify.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  korean-ocr:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # actions/setup-python@v7.0.0
        with:
          python-version: '3.11'
      - name: Install existing locked image dependencies
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements/requirements-shopify.txt
      - name: Install Korean OCR from Ubuntu repositories
        timeout-minutes: 4
        run: |
          # Hosted runners include unrelated third-party APT sources. OCR only
          # needs Ubuntu packages; do not wait on those other repository indexes.
          apt_options=(
            -o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu.sources
            -o Dir::Etc::sourceparts=-
            -o Acquire::Retries=2
            -o Acquire::http::Timeout=20
            -o Acquire::https::Timeout=20
            -o APT::Update::Error-Mode=any
          )
          sudo apt-get "${apt_options[@]}" update
          # Nanum supplies the Korean fixture font without the 61 MB pan-CJK bundle.
          sudo apt-get "${apt_options[@]}" install --no-install-recommends -y tesseract-ocr tesseract-ocr-kor tesseract-ocr-eng fonts-nanum
      - name: Run offline OCR tests and require real Korean integration
        run: |
          python -B - <<'PY'
          import socket, sys, unittest
          sys.path.insert(0, 'scripts')
          import test_localize_detail_images as tests
          assert tests.has_korean_ocr(), 'Korean OCR must be installed; skipping is not verification'
          assert tests.korean_font(), 'Korean font must be installed; skipping is not verification'
          tests.ldi.ensure_ocr_ready()
          def blocked(*args, **kwargs):
              raise AssertionError('Network disabled during OCR regression tests')
          socket.create_connection = blocked
          socket.socket.connect = blocked
          socket.socket.connect_ex = blocked
          result = unittest.TextTestRunner(verbosity=2).run(unittest.defaultTestLoader.loadTestsFromModule(tests))
          if not result.wasSuccessful() or result.skipped:
              raise SystemExit(1)
          PY
