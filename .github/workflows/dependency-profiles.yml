name: Locked dependency profiles

on:
  pull_request:
    paths:
      - 'requirements/**'
      - 'scripts/test_dependency_pins.py'
      - '.github/workflows/dependency-profiles.yml'
  push:
    branches: [main]
    paths:
      - 'requirements/**'
      - 'scripts/test_dependency_pins.py'
      - '.github/workflows/dependency-profiles.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-profiles:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # actions/checkout@v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Check actual supported runtime
        run: python -c 'import sys; assert (3, 11, 5) <= sys.version_info[:3] < (3, 12, 0), sys.version'
      - name: Install locked validator dependencies
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements/requirements-verification.txt
      - name: Validate every lock against reviewed manifest
        run: python scripts/test_dependency_pins.py
      - name: Install all profiles with required hashes and binary wheels
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements/requirements-verification.txt -r requirements/requirements-core.txt -r requirements/requirements-daiso.txt -r requirements/requirements-deep.txt -r requirements/requirements-knowledge.txt -r requirements/requirements-browser.txt -r requirements/requirements-vision.txt -r requirements/requirements-pdf.txt -r requirements/requirements-shopify.txt
      - name: Verify installed dependency consistency and offline runtime smoke
        run: |
          python -m pip check
          python - <<'PY'
          import io
          import cv2
          import numpy as np
          import pyflakes
          import soupsieve
          from bs4 import BeautifulSoup
          from playwright.sync_api import sync_playwright
          from pypdf import PdfReader, PdfWriter
          assert cv2.resize(np.zeros((2, 2), dtype=np.uint8), (3, 3)).shape == (3, 3)
          assert len(soupsieve.select('p', BeautifulSoup('<p>fixture</p>', 'html.parser'))) == 1
          with sync_playwright() as playwright:
              assert playwright.chromium.name == 'chromium'
          buffer = io.BytesIO()
          writer = PdfWriter()
          writer.add_blank_page(width=72, height=72)
          writer.write(buffer)
          buffer.seek(0)
          assert len(PdfReader(buffer).pages) == 1
          print('All profile dependencies installed; updated runtime smoke passed.')
          PY
