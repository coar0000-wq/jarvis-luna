name: INCI 사전 갱신 (대한화장품협회 정본)

# 한글 성분명 -> INCI 영문명 사전을 정본에서 다시 만든다.
#
# 왜 필요한가
#   S등급 9건 중 5건이 us_label 에서 막혀 있었고 빠진 칸은 전부
#   ingredients_inci 였다. 사전이 180개였고 21개 상품을 옮기려면
#   191종이 더 필요했다.
#
# 지어내지 않는다
#   정본에 없는 성분은 넣지 않는다. 사전에 없으면 sync 가 그 상품의
#   ingredients_inci 를 비워 두고 못_옮긴_성분 에 남긴다.

on:
  schedule:
    - cron: '10 20 1 * *'

  workflow_dispatch:

concurrency:
  group: inci-dictionary
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          pip install pypdf

      - name: 정본에서 사전 다시 만들기
        shell: bash
        run: |
          python -u scripts/build_inci_dictionary.py

      - name: 영문 라벨로 옮기기
        run: python -u scripts/sync_gosi_to_us_labels.py

      - name: 법률 자동 점검 갱신
        run: python -u scripts/check_legal_products.py

      - name: 등록 게이트와 파생 보드 재계산
        run: |
          python -u scripts/build_legal_full.py
          python -u scripts/build_listing_gate.py
          python -u scripts/build_product_master.py --inject-s
          python -u scripts/build_market_team.py
          python -u scripts/export_shopify_operational.py

      # ============================================================
      # 중요:
      # legal_products / listing_gate 를 다시 만들었으면
      # dashboard_runtime.json도 같은 실행에서 다시 만들어야 한다.
      #
      # build_artifact_graph.py의 현재 FAIL:
      #   inci-dictionary.yml
      #   갱신함: legal_products.json, listing_gate.json
      #   안 돌림: generate_dashboard_runtime.py
      #
      # 그래서 이 단계를 publish 전에 명시적으로 실행한다.
      # ============================================================
      - name: 대시보드 최종 생성
        shell: bash
        run: |
          python -u scripts/generate_dashboard_runtime.py

      - name: 결과 요약
        if: always()
        shell: bash
        run: |
          echo '### INCI 사전' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

          python - <<'PY' >> "$GITHUB_STEP_SUMMARY" 2>&1
          import json
          from pathlib import Path

          d = json.loads(
              Path("data/inci_dictionary.json").read_text(
                  encoding="utf-8-sig"
              )
          )

          print(f"사전 {d.get('count', 0):,}개")

          print(
              f"  표준명 {d.get('표준명_수', 0):,} · "
              f"구명칭 {d.get('구명칭_수', 0):,} · "
              f"손입력 유지 {d.get('손입력_유지', 0)}"
          )

          print(
              f"  정본: {d.get('정본', '-')}"
          )

          conf = d.get("정본과_달랐던_항목") or {}

          if conf:
              print(
                  f"  정본과 달랐던 손입력 "
                  f"{len(conf)}건 (정본을 따름)"
              )

              for k, v in list(conf.items())[:8]:
                  print(
                      f"    {k}: "
                      f"정본 {v.get('정본')} / "
                      f"기존 {v.get('기존_손입력')}"
                  )

          rep = Path(
              "data/daiso_real/us_label_sync_report.json"
          )

          if rep.exists():
              r = json.loads(
                  rep.read_text(
                      encoding="utf-8-sig"
                  )
              )

              miss = (
                  r.get("못_옮긴_성분")
                  or r.get("missing")
                  or {}
              )

              print(
                  f"\n아직 못 옮긴 성분 "
                  f"{len(miss)}종"
              )

              for t in list(miss)[:15]:
                  print(f"    {t}")

          g = Path(
              "data/listing_gate.json"
          )

          if g.exists():
              gg = json.loads(
                  g.read_text(
                      encoding="utf-8-sig"
                  )
              )

              print(
                  f"\n등록 게이트 "
                  f"{gg.get('ready')}/"
                  f"{gg.get('total')} "
                  f"· 막는 것 "
                  f"{gg.get('blockers')}"
              )
          PY

          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: 산출물 발행 (원격 최신 위에 이번 변경만)
        uses: ./.github/actions/publish
        with:
          paths: >-
            data/inci_dictionary.json
            data/daiso_real/daiso_us_labels.json
            data/daiso_real/us_label_sync_report.json
            data/legal_products.json
            data/legal_full.json
            data/listing_gate.json
            data/daiso_real/shopify_s_recommendations.json
            data/product_master.json
            data/dashboard_runtime.json
            data/market_team.json
            data/marketing_priority.csv
            data/shopify_exports
            data/knowledge/cumulative_history.json
          message: INCI 사전 정본 갱신 (대한화장품협회 표준화명칭목록)
          regenerate-dashboard: 'true'
          audit: 'true'
