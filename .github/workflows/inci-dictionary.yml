name: INCI 사전 갱신 (대한화장품협회 정본)

# 한글 성분명 -> INCI 영문명 사전을 정본에서 다시 만든다.
#
# 왜 필요한가
#   S등급 9건 중 5건이 us_label 에서 막혀 있었고 빠진 칸은 전부
#   ingredients_inci 였다. 사전이 180개였고 21개 상품을 옮기려면
#   191종이 더 필요했다. 사람이 하나씩 채우는 구조라 신상품이 들어올
#   때마다 같은 자리에서 막힌다.
#
#   대한화장품협회 성분사전이 한글명과 INCI 영문명을 표준화해 고시한다.
#   그 표를 통째로 가져오면 사람이 채울 일이 없어진다.
#   2026-09-16 실측: 180개 -> 24,678개. 못 옮긴 성분 191종 -> 10종.
#
# 왜 자주 안 돌리나
#   정본 PDF 는 위원회 회의 주기에 맞춰 갱신된다(2026-08-31 기준판).
#   11MB 를 매번 받을 이유가 없다. 한 달에 한 번 본다.
#   급하면 수동 실행한다.
#
# 지어내지 않는다
#   정본에 없는 성분은 넣지 않는다. 사전에 없으면 sync 가 그 상품의
#   ingredients_inci 를 비워 두고 못_옮긴_성분 에 남긴다.
#   틀린 성분표는 미국에서 라벨 위반이다.

on:
  schedule:
    # 매월 2일 05:10 KST. 위원회 결과가 반영될 시간을 둔다.
    - cron: '10 20 1 * *'

  workflow_dispatch:

concurrency:
  group: inci-dictionary
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          pip install pypdf

      - name: 정본에서 사전 다시 만들기
        shell: bash
        run: |
          # 정본을 못 받거나 파싱이 깨지면 스크립트가 1 을 주고
          # 기존 사전을 그대로 둔다. 덮어써서 잃는 것이 없게 한다.
          python -u scripts/build_inci_dictionary.py

      # 사전이 늘면 그만큼 상품이 풀린다. 그 뒤까지 이어서 간다.
      # 순서:  사전 -> 라벨 -> 법률 -> 게이트
      - name: 영문 라벨로 옮기기
        run: python -u scripts/sync_gosi_to_us_labels.py

      - name: 법률 자동 점검 갱신
        run: python -u scripts/check_legal_products.py

      - name: 등록 게이트 재계산
        run: python -u scripts/build_listing_gate.py

      - name: 결과 요약
        if: always()
        shell: bash
        run: |
          echo '### INCI 사전' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

          python - <<'PY' >> "$GITHUB_STEP_SUMMARY" 2>&1
          import json
          from pathlib import Path

          d = json.loads(Path("data/inci_dictionary.json").read_text(
              encoding="utf-8-sig"))
          print(f"사전 {d.get('count', 0):,}개")
          print(f"  표준명 {d.get('표준명_수', 0):,} · "
                f"구명칭 {d.get('구명칭_수', 0):,} · "
                f"손입력 유지 {d.get('손입력_유지', 0)}")
          print(f"  정본: {d.get('정본', '-')}")
          conf = d.get("정본과_달랐던_항목") or {}
          if conf:
              print(f"  정본과 달랐던 손입력 {len(conf)}건 (정본을 따랐다)")
              for k, v in list(conf.items())[:8]:
                  print(f"    {k}: 정본 {v.get('정본')} / 기존 {v.get('기존_손입력')}")

          rep = Path("data/daiso_real/us_label_sync_report.json")
          if rep.exists():
              r = json.loads(rep.read_text(encoding="utf-8-sig"))
              miss = r.get("못_옮긴_성분") or r.get("missing") or {}
              print(f"\n아직 못 옮긴 성분 {len(miss)}종")
              for t in list(miss)[:15]:
                  print(f"    {t}")

          g = Path("data/listing_gate.json")
          if g.exists():
              gg = json.loads(g.read_text(encoding="utf-8-sig"))
              print(f"\n등록 게이트 {gg.get('ready')}/{gg.get('total')} "
                    f"· 막는 것 {gg.get('blockers')}")
          PY

          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: 산출물 발행 (원격 최신 위에 이번 변경만)
        uses: ./.github/actions/publish
        with:
          paths: >-
            data/inci_dictionary.json
            data/daiso_real/daiso_us_labels.json
            data/daiso_real/us_label_sync_report.json
            data/legal_products.json
            data/listing_gate.json
            data/dashboard_runtime.json
            data/market_team.json
            data/knowledge/cumulative_history.json
          message: INCI 사전 정본 갱신 (대한화장품협회 표준화명칭목록)
          regenerate-dashboard: 'true'
          audit: 'true'
