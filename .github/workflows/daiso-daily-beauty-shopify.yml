name: 다이소 오늘의 뷰티추천 → Shopify 일일 등록

# 매일 10:00 KST (= 01:00 UTC)에 정본 S등급에서
# 스킨케어 / 메이크업 / 바디케어 각 최대 1개를 고른다.
# 바디의 적격 정본 S가 없으면 사용자 승인 샤워/입욕 목록 순서로 비공개 초안만 최대 1개 등록한다.
# 등급은 승격하지 않는다. 명시적 body opt-in과 정확한 카테고리 승인을 매 권한 경계에서 재검증한다.
# 바디 예외의 카피/고시는 규칙 기반·기존 캐시/공개 API만 사용하고 Gemini 호출을 하지 않는다.
# 이 코드 배포는 Shopify 실행·안전/FDA 검증·공개판매 승인이 아니다.
#
# 필요한 저장소 시크릿
#   SHOPIFY_STORE           예: coarfamily.myshopify.com
#   SHOPIFY_CLIENT_ID       Dev Dashboard 앱(jarvis-daily-beauty) 클라이언트 ID
#   SHOPIFY_CLIENT_SECRET   위 앱의 클라이언트 암호
#   GEMINI_API_KEY          (선택, 이미 있음) 무료 티어 영문 카피. 없으면 한글 제목 상품은 초안으로 둔다.
#
# 유료 모델(Claude/ChatGPT)은 쓰지 않는다. 다이소 수집은 공개 API, 카피는 Gemini 무료 티어 또는 규칙 기반.
# 중복 방지는 전체 Shopify 카탈로그와 레지스트리로 한다. 레지스트리는 저장소에 동기화한다.

on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: '1 이면 Shopify 에 쓰지 않고 선택 결과만 출력'
        required: false
        default: '0'
      enrich_only:
        description: '1: existing DRAFT notice enrichment only, never create/publish'
        required: false
        default: '0'
      enrich_pd_nos:
        description: 'Optional exact source IDs, comma-separated, for enrichment only'
        required: false
        default: ''
      quarantine_blocked_public:
        description: '1이면 현재 정본 법률 hard_block이 명시된 기존 다이소 공개 상품만 DRAFT로 격리 (기본값 0)'
        required: false
        default: '0'
      backfill_banner:
        description: '1이면 기존 다이소 상품 설명에도 배너를 앞에 1회 추가 (기본값 1)'
        required: false
        default: '1'
      only_categories:
        description: '테스트용 (예: skincare,body). 비우면 3개 모두'
        required: false
        default: ''

concurrency:
  group: daiso-daily-beauty-shopify
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  register:
    runs-on: ubuntu-latest
    # 상세 이미지 영문화가 상품당 약 3분 (1084687 실측 2분 53초, 패널 12장). 3개 카테고리 기준 여유를 둔다.
    timeout-minutes: 50
    steps:
      - name: 최신 main 확인
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 이미지 처리 라이브러리
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements/requirements-shopify.txt
          python -m playwright install --with-deps chromium
          # 상세 이미지 영문화(1084687 방식)의 글줄 판독. 무료·로컬 OCR.
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-kor tesseract-ocr-eng
          tesseract --list-langs

      - name: 상세 이미지 영문화 단위 테스트
        # numpy/Pillow/OpenCV/tesseract 가 설치된 이 잡에서 돈다 (pages-verified 는 pyflakes/pyyaml 만 설치).
        run: python -B scripts/test_localize_detail_images.py

      - name: 기존 초안 고시 복구 회귀 검사
        run: |
          python -B scripts/test_draft_notice_enrichment.py
          python -B scripts/test_draft_notice_cleanup.py

      - name: 일일 등록 안전성 단위 테스트
        run: |
          python -B - <<'PY'
          import os, shutil, socket, tempfile, unittest
          from pathlib import Path
          for key in ('SHOPIFY_STORE', 'SHOPIFY_CLIENT_ID', 'SHOPIFY_CLIENT_SECRET', 'GEMINI_API_KEY', 'DRY_RUN', 'ONLY_CATEGORIES', 'BODY_FALLBACK_CATALOG_PATH', 'BACKFILL_BANNER', 'QUARANTINE_BLOCKED_PUBLIC', 'ALLOW_ORIGINAL_IMAGES', 'LOCALIZE_DETAIL_IMAGES', 'GOSI_RENDERED_ALT', 'BACKFILL_DRAFT_IMAGES'):
              os.environ.pop(key, None)
          def blocked(*args, **kwargs):
              raise AssertionError('Network disabled for isolated registrar tests')
          socket.create_connection = blocked
          socket.socket.connect = blocked
          socket.socket.connect_ex = blocked
          original = Path.cwd()
          with tempfile.TemporaryDirectory(prefix='shopify-tests-') as directory:
              shadow = Path(directory) / 'repo'
              shadow.mkdir()
              for folder in ('.github', 'config', 'data', 'scripts', 'tests'):
                  shutil.copytree(original / folder, shadow / folder, ignore=shutil.ignore_patterns('.git', '.private', '.env', '.env.*', 'out', '.venv', 'node_modules', '__pycache__'))
              try:
                  os.chdir(shadow)
                  loader = unittest.TestLoader()
                  suite = unittest.TestSuite()
                  for folder, pattern in [('tests', 'test_gallery_review.py'), ('tests', 'test_daiso_daily_beauty_to_shopify.py'), ('tests', 'test_body_category_fallback.py'), ('tests', 'test_collect_desk_catalog_order.py'), ('scripts', 'test_owner_draft_approval.py')]:
                      suite.addTests(loader.discover(folder, pattern=pattern, top_level_dir=folder))
                  result = unittest.TextTestRunner().run(suite)
                  if not result.wasSuccessful():
                      raise SystemExit(1)
              finally:
                  os.chdir(original)
          PY

      # Owner-approved body-only DRAFT exception. Registrar rechecks exact policy and scope before reservation/create.
      - name: 바디 샤워·입욕 원래 목록 순서 수집
        if: ${{ github.event.inputs.enrich_only != '1' }}
        run: python -B scripts/daiso/collect_desk_catalog.py --desk body --output out/body_shower_catalog.json

      - name: 다이소 추천 선택 후 Shopify 등록
        env:
          SHOPIFY_STORE: ${{ secrets.SHOPIFY_STORE }}
          SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DRY_RUN: ${{ github.event.inputs.dry_run || '0' }}
          ENRICH_ONLY: ${{ github.event.inputs.enrich_only || '0' }}
          ENRICH_PD_NOS: ${{ github.event.inputs.enrich_pd_nos || '' }}
          BACKFILL_DRAFT_NOTICE: '1'
          ONLY_CATEGORIES: ${{ github.event.inputs.only_categories || '' }}
          BODY_FALLBACK_CATALOG_PATH: 'out/body_shower_catalog.json'
          BACKFILL_BANNER: ${{ github.event.inputs.backfill_banner || '1' }}
          QUARANTINE_BLOCKED_PUBLIC: ${{ github.event.inputs.quarantine_blocked_public || '0' }}
          ALLOW_ORIGINAL_IMAGES: '1'
          # 사용자 지정 기본 방식(Shopify 9590780723457 / data/manual/image_localization/1084687.json):
          # 다이소 상세 이미지를 영문 패널로 바꿔 올린다. 번역은 무료 Gemini 가 패널을 보고 한다.
          LOCALIZE_DETAIL_IMAGES: '1'
          GEMINI_FREE_TIER_ONLY: '1'
          # 2026-10-17: data/gosi.json 에 없는 후보(바디 대체·메이크업 랭킹)는 고시가 늘 비었다.
          # 렌더링된 상세 이미지 alt 원문에서 읽는다 (AI 없음).
          GOSI_RENDERED_ALT: '1'
          # 2026-10-17: 이미지 0장으로 남은 비공개 초안에도 같은 영문화 방식으로 이미지를 붙인다 (상태·가격·공개는 그대로).
          BACKFILL_DRAFT_IMAGES: '1'
        run: python scripts/daiso_daily_beauty_to_shopify.py

      - name: 바디 원래 목록 수집 증거 보관
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # actions/upload-artifact@v4
        with:
          name: body-shower-catalog-source
          path: out/body_shower_catalog.json
          if-no-files-found: ignore
          retention-days: 3

      - name: shop.com 카테고리 수집 (수집 채널 현황, 읽기 전용)
        if: ${{ always() && github.event.inputs.enrich_only != '1' }}
        continue-on-error: true
        run: python scripts/collect_shop_com_categories.py

      - name: 등록 이력 저장 (중복 방지)
        if: ${{ always() && github.event.inputs.dry_run != '1' }}
        run: |
          git config user.name "jarvis-bot"
          git config user.email "jarvis-bot@users.noreply.github.com"
          git add data/shopify_daily_registry.json data/shop_com_categories.json
          if [ -d data/image_localization ]; then git add data/image_localization; fi
          if git diff --cached --quiet; then echo "no registry change"; exit 0; fi
          git commit -m "chore(shopify): 일일 등록 이력 $(date -u +%F)"
          pushed=0
          for i in 1 2 3 4 5; do
            if git pull --rebase -q origin main && git push -q origin HEAD:main; then pushed=1; break; fi
            git rebase --abort || true
            sleep 6
          done
          if [ "$pushed" -ne 1 ]; then echo "Registry push failed; manual reconciliation required" >&2; exit 1; fi

      - name: 결과 보관
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # actions/upload-artifact@v4
        with:
          name: daiso-daily-beauty-result
          path: |
            out/daiso_daily_beauty_result.json
            data/shopify_daily_registry.json
            data/shop_com_categories.json
          if-no-files-found: ignore
          retention-days: 30
