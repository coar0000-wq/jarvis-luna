name: 다이소 오늘의 뷰티추천 → Shopify 일일 등록

# 매일 10:00 KST (= 01:00 UTC)에 정본 S등급에서
# 스킨케어 / 메이크업 / 바디케어 각 최대 1개를 고른다. S등급 부재 시 건너뛴다.
#
# 필요한 저장소 시크릿
#   SHOPIFY_STORE           예: coarfamily.myshopify.com
#   SHOPIFY_CLIENT_ID       Dev Dashboard 앱(jarvis-daily-beauty) 클라이언트 ID
#   SHOPIFY_CLIENT_SECRET   위 앱의 클라이언트 암호
#   GEMINI_API_KEY          (선택, 이미 있음) 무료 티어 영문 카피. 없으면 한글 제목 상품은 초안으로 둔다.
#
# 유료 모델(Claude/ChatGPT)은 쓰지 않는다. 다이소 수집은 공개 API, 카피는 Gemini 무료 티어 또는 규칙 기반.
# 중복 방지는 전체 Shopify 카탈로그와 레지스트리로 한다. 레지스트리는 저장소에 동기화한다.

on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: '1 이면 Shopify 에 쓰지 않고 선택 결과만 출력'
        required: false
        default: '0'
      quarantine_blocked_public:
        description: '1이면 현재 정본 법률 hard_block이 명시된 기존 다이소 공개 상품만 DRAFT로 격리 (기본값 0)'
        required: false
        default: '0'
      backfill_banner:
        description: '1이면 기존 다이소 상품 설명에도 배너를 앞에 1회 추가 (기본값 1)'
        required: false
        default: '1'
      only_categories:
        description: '테스트용 (예: skincare,body). 비우면 3개 모두'
        required: false
        default: ''

concurrency:
  group: daiso-daily-beauty-shopify
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  register:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SHOPIFY_STORE: ${{ secrets.SHOPIFY_STORE }}
      SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
      SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      DRY_RUN: ${{ github.event.inputs.dry_run || '0' }}
      ONLY_CATEGORIES: ${{ github.event.inputs.only_categories || '' }}
      BACKFILL_BANNER: ${{ github.event.inputs.backfill_banner || '1' }}
      QUARANTINE_BLOCKED_PUBLIC: ${{ github.event.inputs.quarantine_blocked_public || '0' }}
      # 사용자 승인(2026-10-10): 다이소 원본 이미지를 상품 이미지로 사용해도 된다.
      ALLOW_ORIGINAL_IMAGES: '1'
    steps:
      - name: 최신 main 확인
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7.0.1

      - name: Python 설정
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # actions/setup-python@v7.0.0
        with:
          python-version: '3.11'

      - name: 이미지 처리 라이브러리
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements/requirements-shopify.txt
          python -m playwright install --with-deps chromium

      - name: 일일 등록 안전성 단위 테스트
        run: python -B -m unittest discover -s tests -p test_daiso_daily_beauty_to_shopify.py

      - name: 다이소 추천 선택 후 Shopify 등록
        run: python scripts/daiso_daily_beauty_to_shopify.py

      - name: shop.com 카테고리 수집 (수집 채널 현황, 읽기 전용)
        if: ${{ always() }}
        continue-on-error: true
        run: python scripts/collect_shop_com_categories.py

      - name: 등록 이력 저장 (중복 방지)
        if: ${{ always() && github.event.inputs.dry_run != '1' }}
        run: |
          git config user.name "jarvis-bot"
          git config user.email "jarvis-bot@users.noreply.github.com"
          git add data/shopify_daily_registry.json data/shop_com_categories.json
          if git diff --cached --quiet; then echo "no registry change"; exit 0; fi
          git commit -m "chore(shopify): 일일 등록 이력 $(date -u +%F)"
          pushed=0
          for i in 1 2 3 4 5; do
            if git pull --rebase -q origin main && git push -q origin HEAD:main; then pushed=1; break; fi
            git rebase --abort || true
            sleep 6
          done
          if [ "$pushed" -ne 1 ]; then echo "Registry push failed; manual reconciliation required" >&2; exit 1; fi

      - name: 결과 보관
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # actions/upload-artifact@v7.0.2
        with:
          name: daiso-daily-beauty-result
          path: |
            out/daiso_daily_beauty_result.json
            data/shopify_daily_registry.json
            data/shop_com_categories.json
          if-no-files-found: ignore
          retention-days: 30
