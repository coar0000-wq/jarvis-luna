name: 🤖 JARVIS Core Automation (매 10분)

on:
  schedule:
    # 매 10분마다 실행 (통합 자동화)
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  core-automation:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4.1.7
        with:
          fetch-depth: 0

      - name: 🐍 Python 3.10 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 📦 라이브러리 설치
        run: |
          pip install requests feedparser torch numpy matplotlib --break-system-packages

      # ============================================================
      # [1/4] 다이소 상품 수집 - 2026-08-31 제거
      #
      # daiso_product_discovery.py 는 실제 수집을 하지 않고
      #   "name": f"다이소 뷰티·스킨케어 후보 ({random.randint(100, 999)})"
      # 로 가짜 상품을 매 실행 3~5건씩 생성해 커밋하고 있었다.
      # 실제 다이소 수집은 daiso-real-collection.yml 이 담당한다.
      # ============================================================

      - name: 🛍️ [1/4] 다이소 상품 발굴 (제거됨)
        id: daiso_discovery
        run: |
          echo "가짜 데이터 생성 단계라 2026-08-31 제거됨. 실수집은 daiso-real-collection.yml 참조."
          echo "status=skipped" >> $GITHUB_OUTPUT

      # ============================================================
      # [2/4] Obsidian 실시간 동기화 (매 10분)
      # ============================================================

      - name: 📚 [2/4] Obsidian 동기화
        id: obsidian_sync
        run: |
          echo "📚 Obsidian 그래프 동기화..."
          if python scripts/obsidian_realtime_sync.py; then
            echo "status=success" >> $GITHUB_OUTPUT
          else
            echo "status=failed" >> $GITHUB_OUTPUT
          fi

      # ============================================================
      # [3/4] YouTube 데이터 수집 (매 10분)
      # ============================================================

      - name: 🎬 [3/4] YouTube 실수집 (RSS · 가짜 금지)
        id: youtube_collect
        run: |
          echo "🎬 YouTube Atom RSS 실수집 (Learn With Shopify 등)"
          if python scripts/youtube_dropshipping_analysis.py; then
            echo "status=success" >> $GITHUB_OUTPUT
          else
            echo "status=failed" >> $GITHUB_OUTPUT
            exit 1
          fi

      # ============================================================
      # [4/4] Google 검색 데이터 수집 (매 10분)
      # ============================================================

      - name: 🔍 [4/4] Google 검색 데이터 수집
        id: google_collect
        run: |
          echo "🔍 Google Trends 분석..."
          if python scripts/google_search_data_collection.py; then
            echo "status=success" >> $GITHUB_OUTPUT
          else
            echo "status=failed" >> $GITHUB_OUTPUT
          fi

      # ============================================================
      # [5/5] Phase 26 실시간 진행도 업데이트 (매 10분)
      # ============================================================

      - name: 🧠 [5/5] Phase 26 진행도 업데이트
        id: phase_26_progress
        run: |
          echo "🧠 Phase 26 MoE 라우터 진행도 업데이트..."
          if python phase_26_progress_realtime.py; then
            echo "status=success" >> $GITHUB_OUTPUT
          else
            echo "status=failed" >> $GITHUB_OUTPUT
          fi

      # ============================================================
      # GitHub 자동 푸시
      # ============================================================

      - name: 📤 GitHub 자동 푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # 이번 실행이 만든 산출물을 임시 커밋으로 고정
          for pth in data; do
            git add -A -- "$pth" 2>/dev/null || true
          done
          if git diff --cached --quiet; then
            echo "생성된 변경 없음"
            exit 0
          fi
          git commit -q -m "wip"
          MINE=$(git rev-parse HEAD)

          # 원격 최신을 베이스로 두고 그 위에 우리 산출물만 얹는다.
          # rebase 를 쓰지 않으므로 add/add 충돌이 구조적으로 발생하지 않는다.
          # (2026-09-01: rebase 방식이 manual_channels.json 충돌로 계속 실패해 교체)
          for i in 1 2 3 4 5; do
            git fetch -q origin main
            git checkout -q -B publish origin/main
              RESTORED=0
              for pth in data; do
                # git checkout <커밋> -- 경로 는 덮어쓰기만 하고 그 커밋에 없는 파일을
                # 지우지 않는다. 그래서 재생성형 폴더(obsidian/Records 등)에 옛 파일이
                # 무한히 쌓였다. 2026-09-04 확인: 1,113개여야 할 노트가 18,174개.
                # 먼저 지우고 통째로 복원한다.
                if git cat-file -e "$MINE:$pth" 2>/dev/null || git ls-tree -d "$MINE" "$pth" >/dev/null 2>&1; then
                  rm -rf "$pth"
                fi
                if git checkout -q "$MINE" -- "$pth" 2>/dev/null; then
                  RESTORED=$((RESTORED+1))
                fi
                git add -A -- "$pth" 2>/dev/null || true
              done
            if [ "$RESTORED" -eq 0 ]; then
              echo "산출물 복원 실패 - 중단"
              exit 1
            fi
            if git diff --cached --quiet; then
              echo "원격과 동일 - 푸시 불필요"
              exit 0
            fi
            git commit -q -m "JARVIS Core 자동화 갱신"
            if git push -q origin HEAD:main; then
              echo "push 성공 (시도 $i, 복원 경로 ${RESTORED}개)"
              exit 0
            fi
            echo "push 거절됨, 재시도 $i"
            git reset -q --hard "$MINE"
            sleep $((i * 4))
          done
          echo "5회 시도 후 push 실패"
          exit 1
      # ============================================================
      # 작업 완료 로그
      # ============================================================

      - name: ✅ 완료 로그
        if: always()
        run: |
          echo "🎯 JARVIS Core Automation 완료"
          echo "- 다이소 상품 발굴: ${{ steps.daiso_discovery.outputs.status }}"
          echo "- Obsidian 동기화: ${{ steps.obsidian_sync.outputs.status }}"
          echo "- YouTube 수집: ${{ steps.youtube_collect.outputs.status }}"
          echo "- Google 수집: ${{ steps.google_collect.outputs.status }}"
          echo "- Phase 26 진행도: ${{ steps.phase_26_progress.outputs.status }}"
