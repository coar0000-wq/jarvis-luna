name: JARVIS 워치독 (컴퓨터 꺼져도 스스로 재가동)

# 2026-10-11 사용자 목표: "ASIDE 컴퓨터 꺼져도 자비스가 스스로 작업하게 만드는 것".
# GitHub 예약 실행은 부하가 많으면 건너뛴다. 실제로 Core(2시간 예약)는 5~7시간에 한 번만 돌았다.
# 이 워치독은 30분마다 핵심 워크플로의 마지막 성공 완료 시각을 보고, 너무 오래 멈췄으면 workflow_dispatch 로 다시 띄운다.
# - main-publish 그룹 실행이 하나라도 대기/진행 중이면 아무것도 하지 않는다(대기 실행 교체·취소 방지).
# - 한 번에 하나만 띄운다. 코드·데이터는 건드리지 않는다(읽기 + 실행 요청만).

on:
  schedule:
    - cron: '11,41 * * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: jarvis-watchdog
  cancel-in-progress: true

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 멈춘 핵심 워크플로 재가동
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # main-publish 그룹 워크플로 파일
          PUBLISH="JARVIS-Core-Automation.yml JARVIS-Deep-Analysis.yml daiso-real-collection.yml jarvis-real-knowledge.yml gosi-vision.yml shopify-listing-copy.yml fx-refresh.yml gosi-alt.yml daiso-candidate-recovery.yml shopify-aeo-apply.yml"
          for wf in $PUBLISH; do
            n=$(gh run list -R "$REPO" --workflow "$wf" --limit 10 --json status -q '[.[]|select(.status!="completed")]|length')
            if [ "${n:-0}" != "0" ]; then
              echo "WATCHDOG_WAIT $wf 실행/대기 중 -> 이번 회차는 쉰다"
              echo "대기: $wf 실행/대기 중" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          done
          now=$(date -u +%s)
          # 우선순위 순서: 파일 최대공백(시간)
          for spec in "JARVIS-Core-Automation.yml:3" "JARVIS-Deep-Analysis.yml:3" "jarvis-real-knowledge.yml:7"; do
            wf="${spec%%:*}"; max_h="${spec##*:}"
            state=$(gh api "repos/$REPO/actions/workflows/$wf" --jq '.state')
            if [ "$state" != "active" ]; then
              echo "WATCHDOG_EXCLUDED $wf state=$state (비활성 워크플로는 재가동하지 않음)"
              continue
            fi
            last=$(gh run list -R "$REPO" --workflow "$wf" --branch main --status success --limit 1 --json updatedAt -q '.[0].updatedAt // ""')
            if [ -z "$last" ]; then age_seconds=3596400; else age_seconds=$((now - $(date -u -d "$last" +%s))); fi
            if [ "$age_seconds" -lt 0 ]; then echo "::error::미래 성공 시각: $wf"; exit 1; fi
            age_h=$((age_seconds / 3600))
            echo "WATCHDOG_CHECK $wf last_success=$last age_h=$age_h max_h=$max_h"
            if [ "$age_h" -ge "$max_h" ]; then
              # A recent failed attempt must not hide stale success, but avoid
              # dispatching the same failing workflow every 30 minutes.
              attempt=$(gh run list -R "$REPO" --workflow "$wf" --branch main --limit 1 --json createdAt -q '.[0].createdAt // ""')
              if [ -n "$attempt" ] && [ $((now - $(date -u -d "$attempt" +%s))) -lt 3600 ]; then
                echo "::warning::WATCHDOG_STALE $wf 성공 지연, 최근 시도 후 1시간 대기"
                echo "경고: $wf 성공 지연 (재시도 간격 대기)" >> "$GITHUB_STEP_SUMMARY"
                continue
              fi
              gh workflow run "$wf" -R "$REPO" --ref main
              echo "WATCHDOG_DISPATCH $wf (마지막 성공 완료 ${age_h}시간 전)"
              echo "재가동: $wf (마지막 성공 완료 ${age_h}시간 전)" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          done
          echo "WATCHDOG_CHECK_DONE 실행 메타데이터 확인 완료; 산출물 최신성은 workflow_freshness.json 별도 확인"
          echo "실행 메타데이터 점검 완료. 산출물 최신성은 별도 확인 필요." >> "$GITHUB_STEP_SUMMARY"
