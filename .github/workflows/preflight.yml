name: 배포 전 검증

# A clean checkout, not a developer's local working tree, is the CI evidence.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # actions/checkout@v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # actions/setup-python@v5
        with:
          python-version: '3.11'

          cache: 'pip'

      - name: Dependencies
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements/requirements-verification.txt

      - name: Offline workflow regression tests
        id: regression
        if: always()
        continue-on-error: true
        run: python scripts/test_preflight_workflow.py

      - name: Offline operational repair tests
        id: repairs
        if: always()
        shell: bash
        env:
          TYPESAFE_ENABLED: '0'
          GEMINI_FALLBACK_ENABLED: '0'
          GEMINI_ENABLED: '0'
          # Fixture-only CLI paths, no provider or source requests.
          JARVIS_SOURCE_CONTINUITY: 'verified'
          JARVIS_OPERATIONS_CONTINUITY: 'verified'
        run: |
          python scripts/test_daiso_collection_validation.py
          python scripts/test_daiso_candidates.py
          python scripts/test_recover_daiso_candidates.py
          python scripts/test_listing_copy_local.py
          python scripts/test_operational_freshness.py
          python scripts/test_workflow_status.py
          python scripts/test_verified_pages.py
          python scripts/test_operational_integration.py
          python scripts/test_product_change_ledger.py
          python scripts/test_publish_graph_contract.py
          python scripts/test_actions_release_integration.py
          python scripts/test_dependency_pins.py
          python scripts/test_public_site.py
          python scripts/test_publish_transaction.py
          python scripts/test_release_quality.py
          python scripts/test_collector_result.py
          python scripts/test_typesafe_shared.py
          python scripts/test_team_typesafe.py
          python scripts/test_typesafe_receipt.py
          python scripts/test_typesafe_wiring.py
          python scripts/test_gate_signature_portability.py
          python -B -m unittest discover -s scripts -p "test_jarvis*.py"
          python scripts/test_operations_public_projection.py
          python scripts/test_improvement_public_projection.py
          python scripts/test_team_improvement_evidence.py
          python scripts/test_build_team_improvement.py
          python scripts/test_runtime_operations_wiring.py
          python scripts/test_watch_source_adapters.py
          python scripts/test_watch_recovery_integration.py
          python scripts/test_source_collector_provenance.py
          python scripts/test_knowledge_capture_provenance.py
          python scripts/test_shortlist_observations.py
          python scripts/test_shortlist_continuity.py
          python scripts/test_source_procedure_state.py
          python scripts/test_source_safety_checkpoint.py
          python scripts/test_source_self_healing_integration.py
          python scripts/test_restore_operations_safety.py
          python scripts/test_workflow_status_publication.py
          python scripts/test_daiso_pipeline_health.py
          python scripts/test_daiso_pipeline_inputs.py
          python scripts/test_observe_daiso_pipeline.py
          python scripts/test_candidate_pool_history.py
          python scripts/test_gosi_observation_provenance.py
          python scripts/test_us_label_provenance.py
          python scripts/test_immutable_snapshot_store.py
          python scripts/test_moe_evaluation_publication.py
          python scripts/test_diagnostic_evaluation_publication.py
          python scripts/test_gemini_escalation.py
          python scripts/test_shopify_authorization_boundary.py
          python scripts/test_shopify_shortlist_guard.py
          python scripts/check_release_quality.py --phase final --report "$RUNNER_TEMP/preflight-quality-report.json"

      - name: Preflight checks
        id: pf
        if: always()
        shell: bash
        continue-on-error: true
        run: bash scripts/preflight_workflow.sh preflight

      - name: Artifact graph boundary checks
        id: graph
        if: always()
        shell: bash
        continue-on-error: true
        run: bash scripts/preflight_workflow.sh graph

      - name: Always record results
        id: summary
        if: always()
        shell: bash
        env:
          REGRESSION_OUTCOME: ${{ steps.regression.outcome }}
          REPAIR_OUTCOME: ${{ steps.repairs.outcome }}
        run: bash scripts/preflight_workflow.sh summary

      - name: Fail closed
        id: gate
        if: always()
        shell: bash
        env:
          REGRESSION_OUTCOME: ${{ steps.regression.outcome }}
          REPAIR_OUTCOME: ${{ steps.repairs.outcome }}
          PF_OUTCOME: ${{ steps.pf.outcome }}
          PF_COMPLETED: ${{ steps.pf.outputs.completed }}
          PF_RC: ${{ steps.pf.outputs.rc }}
          PF_RAW_RC: ${{ steps.pf.outputs.preflight_rc }}
          PF_TEE_RC: ${{ steps.pf.outputs.preflight_tee_rc }}
          PF_LOG_OK: ${{ steps.pf.outputs.preflight_log_ok }}
          GRAPH_OUTCOME: ${{ steps.graph.outcome }}
          GRAPH_COMPLETED: ${{ steps.graph.outputs.completed }}
          GRAPH_RC: ${{ steps.graph.outputs.rc }}
          SUMMARY_OUTCOME: ${{ steps.summary.outcome }}
        run: bash scripts/preflight_workflow.sh gate
