name: 배포 전 검증

# A clean checkout, not a developer's local working tree, is the CI evidence.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Dependencies
        run: python -m pip install --quiet pyyaml pyflakes

      - name: Offline workflow regression tests
        id: regression
        if: always()
        continue-on-error: true
        run: python scripts/test_preflight_workflow.py

      - name: Offline operational repair tests
        id: repairs
        if: always()
        shell: bash
        env:
          TYPESAFE_ENABLED: '0'
          GEMINI_FALLBACK_ENABLED: '0'
        run: |
          python scripts/test_daiso_collection_validation.py
          python scripts/test_daiso_candidates.py
          python scripts/test_listing_copy_local.py
          python scripts/test_operational_freshness.py
          python scripts/test_workflow_status.py
          python scripts/test_verified_pages.py
          python scripts/test_operational_integration.py

      - name: Preflight checks
        id: pf
        if: always()
        shell: bash
        continue-on-error: true
        run: bash scripts/preflight_workflow.sh preflight

      - name: Artifact graph boundary checks
        id: graph
        if: always()
        shell: bash
        continue-on-error: true
        run: bash scripts/preflight_workflow.sh graph

      - name: Always record results
        id: summary
        if: always()
        shell: bash
        env:
          REGRESSION_OUTCOME: ${{ steps.regression.outcome }}
          REPAIR_OUTCOME: ${{ steps.repairs.outcome }}
        run: bash scripts/preflight_workflow.sh summary

      - name: Fail closed
        id: gate
        if: always()
        shell: bash
        env:
          REGRESSION_OUTCOME: ${{ steps.regression.outcome }}
          REPAIR_OUTCOME: ${{ steps.repairs.outcome }}
          PF_OUTCOME: ${{ steps.pf.outcome }}
          PF_COMPLETED: ${{ steps.pf.outputs.completed }}
          PF_RC: ${{ steps.pf.outputs.rc }}
          PF_RAW_RC: ${{ steps.pf.outputs.preflight_rc }}
          PF_TEE_RC: ${{ steps.pf.outputs.preflight_tee_rc }}
          PF_LOG_OK: ${{ steps.pf.outputs.preflight_log_ok }}
          GRAPH_OUTCOME: ${{ steps.graph.outcome }}
          GRAPH_COMPLETED: ${{ steps.graph.outputs.completed }}
          GRAPH_RC: ${{ steps.graph.outputs.rc }}
          SUMMARY_OUTCOME: ${{ steps.summary.outcome }}
        run: bash scripts/preflight_workflow.sh gate
