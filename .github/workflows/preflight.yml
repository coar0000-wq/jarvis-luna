name: 배포 전 검증

# A clean checkout, not a developer's local working tree, is the CI evidence.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # actions/setup-python@v7.0.0
        with:
          python-version: '3.11'

          cache: 'pip'

      - name: Dependencies
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements/requirements-verification.txt

      - name: Offline workflow regression tests
        id: regression
        if: always()
        continue-on-error: true
        run: python scripts/test_preflight_workflow.py

      - name: Offline operational repair tests
        id: repairs
        if: always()
        shell: bash
        env:
          TYPESAFE_ENABLED: '0'
          GEMINI_FALLBACK_ENABLED: '0'
          GEMINI_ENABLED: '0'
          # Fixture-only CLI paths, no provider or source requests.
          JARVIS_SOURCE_CONTINUITY: 'verified'
          JARVIS_OPERATIONS_CONTINUITY: 'verified'
        run: |
          python scripts/test_preflight_static.py
          python scripts/test_daiso_collection_validation.py
          python scripts/test_daiso_candidates.py
          python -B -m unittest discover -s scripts -p "test_current_s_eligibility.py"
          python scripts/test_recover_daiso_candidates.py
          python -B -m unittest discover -s tests -p "test_product_accuracy.py"
          python -B -m unittest discover -s tests -p "test_gallery_review.py"
          python -B -m unittest discover -s scripts -p "test_active_product_gallery_plan.py"
          python -B scripts/test_apply_reviewed_product_gallery.py
          python -B scripts/test_reviewed_gallery_workflow.py
          python scripts/test_listing_copy_local.py
          python scripts/test_ai_shopping_copy.py
          python -B scripts/test_shopify_aeo_inspection.py
          python -B scripts/test_shopify_readiness_audit.py
          python -B scripts/test_shopify_readiness_snapshot.py
          python -B -m unittest discover -s scripts -p "test_listing_copy_publication.py"
          python -B -m unittest discover -s scripts -p "test_shopify_import_report_publication.py"
          python scripts/test_operational_freshness.py
          python scripts/test_workflow_status.py
          python -B scripts/test_freshness_reporting.py
          python scripts/test_verified_pages.py
          python scripts/test_operational_integration.py
          python scripts/test_product_change_ledger.py
          python scripts/test_publish_graph_contract.py
          python -B scripts/test_normalize_obsidian_links.py
          python scripts/test_actions_release_integration.py
          python scripts/test_dependency_pins.py
          python scripts/test_public_site.py
          node scripts/test_daily_pipeline_display.cjs
          python scripts/test_publish_transaction.py
          python scripts/test_collector_snapshot_history.py
          python scripts/test_channel_expansion_preservation.py
          python scripts/test_partial_source_preservation.py
          python -B scripts/test_asml_official_list.py
          python -B -m unittest discover -s scripts -p "test_operations_publish_bytes.py"
          python -B -m unittest discover -s scripts -p "test_commerce_pipeline_workflows.py"
          python -B scripts/test_document_handoffs.py
          python scripts/test_release_quality.py
          python scripts/test_collector_result.py
          python scripts/test_gosi_recovery_workflow.py
          python -B scripts/test_gosi_alt_runtime.py
          python -B scripts/test_continuity_reconciliation.py
          python -B scripts/test_gosi_safety_checkpoint.py
          python -B scripts/test_gosi_alt_parser.py
          python -B scripts/test_gosi_draft_targets.py
          python -B scripts/test_draft_notice_enrichment.py
          python -B scripts/test_plan_draft_product_copy.py
          python -B scripts/test_apply_reviewed_draft_copy.py
          python -B scripts/test_reviewed_draft_copy_workflow.py
          python -B scripts/test_dr_cpu_active_copy.py
          python scripts/test_gosi_image_sources.py
          python scripts/test_source_health_access.py
          python scripts/test_agent_draft_suggestions.py
          python scripts/test_model_replay.py
          python scripts/test_never_started_runs.py
          python scripts/test_serpapi_scoped_refresh.py
          python scripts/test_typesafe_shared.py
          python scripts/test_typesafe_decision_support.py
          python scripts/test_team_typesafe.py
          python scripts/test_team_advisory_history.py
          python scripts/test_typesafe_receipt.py
          python scripts/test_typesafe_wiring.py
          python scripts/test_gate_signature_portability.py
          python -B -m unittest discover -s scripts -p "test_brain_plane.py"
          python -B -m unittest discover -s scripts -p "test_obsidian_brain.py"
          python -B -m unittest discover -s scripts -p "test_brain_large_graph.py"
          python -B -m unittest discover -s scripts -p "test_brain_segmented_graph.py"
          python -B -m unittest discover -s scripts -p "test_brain_auth_plan_exclusion.py"
          python -B -m unittest discover -s scripts -p "test_ingest_obsidian_data.py"
          python -B -m unittest discover -s scripts -p "test_beauty_category_teams.py"
          python -B -m unittest discover -s scripts -p "test_beauty_price_strategy.py"
          python -B -m unittest discover -s scripts -p "test_checkout_price_evidence.py"
          python -B -m unittest discover -s scripts -p "test_team_briefing_feeds.py"
          python -B -m unittest discover -s scripts -p "test_us_human_sales_review.py"
          python -B -m unittest discover -s scripts -p "test_video_learning_visibility.py"
          python -B -m unittest discover -s scripts -p "test_payment_fees.py"
          python -B -m unittest discover -s scripts -p "test_operations_storage.py"
          python -B -m unittest discover -s scripts -p "test_operations_graph_storage.py"
          python -B -m unittest discover -s scripts -p "test_operations_graph_publication.py"
          python -B -m unittest discover -s scripts -p "test_operations_segments.py"
          python -B -m unittest discover -s scripts -p "test_restore_operations_segments.py"
          python -B -m unittest discover -s scripts -p "test_operations_segment_publication.py"
          python -B -m unittest discover -s scripts -p "test_operations_history_wiring.py"
          python -B -m unittest discover -s scripts -p "test_manufacturer_safety.py"
          python -B -m unittest discover -s tests -p "test_body_category_fallback.py"
          python -B -m unittest discover -s tests -p "test_collect_desk_catalog_order.py"
          python -B -m unittest discover -s tests -p "test_shopify_repair_manual_draft.py"
          python tools/local_analysis/tests/validate.py
          python -B -m unittest discover -s scripts -p "test_owner_draft_approval.py"
          python -B -m unittest discover -s scripts -p "test_fda_wording_review.py"
          python -B -m unittest discover -s tests -p "test_daiso_daily_beauty_to_shopify.py"
          python -B -m unittest discover -s scripts -p "test_mocra_scoped_safety.py"
          python -B -m unittest discover -s scripts -p "test_connect_obsidian_orphans.py"
          python -B -m unittest discover -s scripts -p "test_jarvis*.py"
          python scripts/test_operations_public_projection.py
          python scripts/test_improvement_public_projection.py
          python scripts/test_team_improvement_evidence.py
          python scripts/test_build_team_improvement.py
          python scripts/test_runtime_operations_wiring.py
          python scripts/test_watch_source_adapters.py
          python scripts/test_watch_recovery_integration.py
          python scripts/test_source_collector_provenance.py
          python scripts/test_knowledge_capture_provenance.py
          python scripts/test_shortlist_observations.py
          python scripts/test_shortlist_continuity.py
          python scripts/test_source_procedure_state.py
          python scripts/test_source_safety_checkpoint.py
          python scripts/test_source_self_healing_integration.py
          python scripts/test_restore_operations_safety.py
          python scripts/test_workflow_status_publication.py
          python scripts/test_daiso_pipeline_health.py
          python scripts/test_daiso_pipeline_inputs.py
          python scripts/test_repository_identity.py
          python scripts/test_observe_daiso_pipeline.py
          python scripts/test_candidate_pool_history.py
          python scripts/test_legal_export_history.py
          python scripts/test_gosi_observation_provenance.py
          python scripts/test_us_label_provenance.py
          python scripts/test_immutable_snapshot_store.py
          python scripts/test_moe_evaluation_publication.py
          python scripts/test_diagnostic_evaluation_publication.py
          python scripts/test_gemini_escalation.py
          python scripts/test_shopify_authorization_boundary.py
          python scripts/test_shopify_shortlist_guard.py
          python scripts/check_release_quality.py --phase final --report "$RUNNER_TEMP/preflight-quality-report.json"

      - name: Preflight checks
        id: pf
        if: always()
        shell: bash
        continue-on-error: true
        run: bash scripts/preflight_workflow.sh preflight

      - name: Artifact graph boundary checks
        id: graph
        if: always()
        shell: bash
        continue-on-error: true
        run: bash scripts/preflight_workflow.sh graph

      - name: Always record results
        id: summary
        if: always()
        shell: bash
        env:
          REGRESSION_OUTCOME: ${{ steps.regression.outcome }}
          REPAIR_OUTCOME: ${{ steps.repairs.outcome }}
        run: bash scripts/preflight_workflow.sh summary

      - name: Fail closed
        id: gate
        if: always()
        shell: bash
        env:
          REGRESSION_OUTCOME: ${{ steps.regression.outcome }}
          REPAIR_OUTCOME: ${{ steps.repairs.outcome }}
          PF_OUTCOME: ${{ steps.pf.outcome }}
          PF_COMPLETED: ${{ steps.pf.outputs.completed }}
          PF_RC: ${{ steps.pf.outputs.rc }}
          PF_RAW_RC: ${{ steps.pf.outputs.preflight_rc }}
          PF_TEE_RC: ${{ steps.pf.outputs.preflight_tee_rc }}
          PF_LOG_OK: ${{ steps.pf.outputs.preflight_log_ok }}
          GRAPH_OUTCOME: ${{ steps.graph.outcome }}
          GRAPH_COMPLETED: ${{ steps.graph.outputs.completed }}
          GRAPH_RC: ${{ steps.graph.outputs.rc }}
          SUMMARY_OUTCOME: ${{ steps.summary.outcome }}
        run: bash scripts/preflight_workflow.sh gate
