name: JARVIS LUNA Realtime Update

on:
  schedule:
    - cron: '*/1 * * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run JARVIS LUNA
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY_LUNA }}
        run: python jarvis_luna_complete.py

      - name: Commit and push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "JARVIS LUNA Bot"
          git add -A
          git commit -m "JARVIS LUNA: Auto-update $(date)" || true
          git push
