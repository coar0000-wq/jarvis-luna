name: Deploy verified GitHub Pages

# GITHUB_TOKEN publishers require workflow_run; manual recovery is main-only.
on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - 배포 전 검증
      - Daiso Real Product Collection
      - Gemini url_context 웹 채널 수집
      - 고시 alt 수집 (브라우저)
      - 고시 수집·비전 추출
      - INCI 사전 갱신 (대한화장품협회 정본)
      - 🤖 JARVIS Core Automation (2시간)
      - JARVIS Deep Analysis
      - JARVIS Real Knowledge Sync
      - 🧠 Legacy Obsidian 동기화 (수동 실행 전용)
      - 루트 수집기 3종 (gosi / product / inci)
      - SerpApi 미국 시장가·트렌드·YouTube 수집
      - Shopify 영문 리스팅 카피 생성
      - 다이소 오늘의 뷰티추천 → Shopify 일일 등록
      - 미국 리테일 베스트셀러 수집 (브라우저)
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  verified-deploy:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.event != 'pull_request')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout current published main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install offline verification dependencies
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements/requirements-verification.txt

      - name: Validate the exact deployment snapshot
        id: site
        shell: bash
        env:
          TYPESAFE_ENABLED: '0'
          GEMINI_FALLBACK_ENABLED: '0'
          GEMINI_ENABLED: '0'
          # Fixture-only CLI paths, no provider or source requests.
          JARVIS_SOURCE_CONTINUITY: 'verified'
          JARVIS_OPERATIONS_CONTINUITY: 'verified'
        run: |
          set -e
          for attempt in 1 2 3; do
            python -m pip install --require-hashes --only-binary=:all: -r requirements/requirements-verification.txt
            set +e
            python scripts/preflight.py
            rc=$?
            set -e
            if [ "$rc" != 0 ] && [ "$rc" != 2 ]; then
              echo "::error::Deployment blocked by preflight exit $rc"
              exit 1
            fi
            python scripts/test_preflight_workflow.py
            python scripts/test_daiso_collection_validation.py
            python scripts/test_daiso_candidates.py
            python scripts/test_listing_copy_local.py
            python scripts/test_operational_freshness.py
            python scripts/test_workflow_status.py
            python scripts/test_verified_pages.py
            python scripts/test_public_site.py
            python scripts/test_operational_integration.py
            python scripts/test_product_change_ledger.py
            python scripts/test_publish_graph_contract.py
            python scripts/test_actions_release_integration.py
            python scripts/test_dependency_pins.py
            python scripts/test_publish_transaction.py
            python scripts/test_release_quality.py
            python scripts/test_collector_result.py
            python scripts/test_typesafe_shared.py
            python scripts/test_team_typesafe.py
            python scripts/test_typesafe_receipt.py
            python scripts/test_typesafe_wiring.py
            python scripts/test_gate_signature_portability.py
            python -B -m unittest discover -s scripts -p "test_jarvis*.py"
            python scripts/test_operations_public_projection.py
            python scripts/test_improvement_public_projection.py
            python scripts/test_team_improvement_evidence.py
            python scripts/test_build_team_improvement.py
            python scripts/test_runtime_operations_wiring.py
            python scripts/test_watch_source_adapters.py
            python scripts/test_watch_recovery_integration.py
            python scripts/test_source_collector_provenance.py
            python scripts/test_knowledge_capture_provenance.py
            python scripts/test_shortlist_observations.py
            python scripts/test_shortlist_continuity.py
            python scripts/test_source_procedure_state.py
            python scripts/test_source_safety_checkpoint.py
            python scripts/test_source_self_healing_integration.py
            python scripts/test_restore_operations_safety.py
            python scripts/test_workflow_status_publication.py
            python scripts/test_daiso_pipeline_health.py
            python scripts/test_daiso_pipeline_inputs.py
            python scripts/test_observe_daiso_pipeline.py
            python scripts/test_candidate_pool_history.py
            python scripts/test_gosi_observation_provenance.py
            python scripts/test_us_label_provenance.py
            python scripts/test_immutable_snapshot_store.py
            python scripts/test_moe_evaluation_publication.py
            python scripts/test_diagnostic_evaluation_publication.py
            python scripts/test_gemini_escalation.py
            python scripts/test_build_artifact_graph_mermaid.py
            python scripts/test_self_improve.py
            python scripts/test_self_improve_replay.py
            python scripts/test_team_learning.py
            python scripts/test_shopify_shortlist_guard.py
            python scripts/build_artifact_graph.py --check
            python scripts/check_release_quality.py --phase final --report "$RUNNER_TEMP/pages-quality-report.json"
            python scripts/build_public_site.py --output dist
            python scripts/check_public_site.py --root dist
            git fetch origin main
            if [ "$(git rev-parse HEAD)" = "$(git rev-parse FETCH_HEAD)" ]; then
              echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
              break
            fi
            if [ "$attempt" = 3 ]; then
              echo "::error::Main changed during all three verification attempts. Use manual redeploy after publishers settle."
              exit 1
            fi
            git reset --hard FETCH_HEAD
          done

      - name: Reject an obsolete checkout
        shell: bash
        run: |
          git fetch origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse FETCH_HEAD)" ]; then
            echo "::error::Main changed after bounded revalidation. Retry with workflow_dispatch."
            exit 1
          fi
          cat dist/deployment.json >> "$GITHUB_STEP_SUMMARY"
          echo "Verified deployment commit: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"

      - name: Skip an already verified identical deployment
        id: duplicate
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          CURRENT_RUN: ${{ github.run_id }}
        shell: bash
        run: |
          python - <<'PY'
          import json, os, urllib.request
          from pathlib import Path
          local = json.loads(Path('dist/deployment.json').read_text(encoding='utf-8'))
          repo = os.environ['REPOSITORY']
          skipped = False
          try:
              api = 'https://api.github.com/repos/' + repo + '/actions/workflows/pages-verified.yml/runs?status=success&head_sha=' + local['commit'] + '&per_page=10'
              req = urllib.request.Request(api, headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'})
              with urllib.request.urlopen(req, timeout=15) as response:
                  runs = json.load(response).get('workflow_runs', [])
              verified = any(str(r.get('id')) != os.environ['CURRENT_RUN'] and r.get('conclusion') == 'success' and r.get('head_sha') == local['commit'] and r.get('head_branch') == 'main' for r in runs)
              if verified:
                  owner, name = repo.split('/')
                  url = 'https://' + owner + '.github.io/' + name + '/deployment.json'
                  with urllib.request.urlopen(urllib.request.Request(url, headers={'Cache-Control': 'no-cache'}), timeout=15) as response:
                      previous = json.load(response)
                  skipped = previous.get('commit') == local['commit'] and previous.get('site_hash') == local['site_hash'] and previous.get('public_files_only') is True
          except Exception:
              skipped = False  # Unverifiable evidence never skips deployment.
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as out:
              out.write('skip=' + str(skipped).lower() + '\n')
          print('PUBLIC_DEPLOYMENT_DUPLICATE=' + str(skipped).lower())
          PY

      - name: Configure Pages
        if: steps.duplicate.outputs.skip != 'true'
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # actions/configure-pages@v5

      - name: Upload verified site
        if: steps.duplicate.outputs.skip != 'true'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy verified site
        if: steps.duplicate.outputs.skip != 'true'
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # actions/deploy-pages@v4
