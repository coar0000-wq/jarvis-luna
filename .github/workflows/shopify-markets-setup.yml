name: Shopify 마켓 정리 (한국 제외 전 세계 판매)

# 수동 실행. apply=0 이면 점검만, apply=1 이면 한국 마켓 삭제 + 한국 제외 판매 지역 생성.
on:
  workflow_dispatch:
    inputs:
      apply:
        description: '1 이면 실제로 변경 (0 이면 점검만)'
        required: false
        default: '0'

permissions:
  contents: read

jobs:
  markets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SHOPIFY_STORE: ${{ secrets.SHOPIFY_STORE }}
      SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
      SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
      APPLY: ${{ github.event.inputs.apply || '0' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # actions/setup-python@v7.0.0
        with:
          python-version: '3.11'
      - run: python scripts/shopify_markets_setup.py
