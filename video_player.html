<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>비디오 분석 - JARVIS Dog Scroll Animation</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
            background: #1a1a1a;
            color: #fff;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            margin-bottom: 20px;
            text-align: center;
            font-size: 28px;
            color: #64e5ff;
        }

        .player-section {
            display: flex;
            gap: 20px;
            margin-bottom: 40px;
        }

        .video-container {
            flex: 1;
            background: #0a0a0a;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 0 30px rgba(100, 229, 255, 0.2);
        }

        video {
            width: 100%;
            display: block;
            background: #000;
        }

        .controls {
            background: #0f1535;
            padding: 15px;
            border-top: 1px solid rgba(100, 229, 255, 0.1);
        }

        .controls label {
            display: block;
            margin-bottom: 10px;
            font-size: 12px;
            color: #888;
            text-transform: uppercase;
        }

        .time-display {
            font-size: 14px;
            color: #64e5ff;
            font-weight: bold;
        }

        .analysis-panel {
            flex: 0 0 300px;
            background: #0f1535;
            border: 1px solid rgba(100, 229, 255, 0.1);
            border-radius: 12px;
            padding: 20px;
            max-height: 600px;
            overflow-y: auto;
        }

        .analysis-panel h3 {
            color: #64e5ff;
            margin-bottom: 15px;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .metric {
            background: rgba(100, 229, 255, 0.05);
            border-left: 2px solid #64e5ff;
            padding: 12px;
            margin-bottom: 12px;
            border-radius: 4px;
            font-size: 13px;
            line-height: 1.6;
        }

        .metric-label {
            color: #888;
            font-size: 11px;
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        .metric-value {
            color: #fff;
            font-weight: bold;
            font-size: 14px;
        }

        .observations {
            background: #0a0e27;
            border: 1px solid rgba(255, 107, 53, 0.2);
            border-radius: 8px;
            padding: 15px;
            margin-top: 30px;
        }

        .observations h2 {
            color: #ff6b35;
            margin-bottom: 15px;
            font-size: 18px;
        }

        .observation-item {
            padding: 10px 0;
            border-bottom: 1px solid rgba(255, 107, 53, 0.1);
            font-size: 14px;
            line-height: 1.6;
        }

        .observation-item:last-child {
            border-bottom: none;
        }

        .timestamp {
            color: #64e5ff;
            font-weight: bold;
        }

        @media (max-width: 1024px) {
            .player-section {
                flex-direction: column;
            }

            .analysis-panel {
                flex: 1;
                max-height: none;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎬 비디오 분석 - Dog Scroll Animation</h1>

        <div class="player-section">
            <div class="video-container">
                <video id="videoPlayer" controls>
                    <source src="녹음 2026-08-16 133016.mp4" type="video/mp4">
                    브라우저가 비디오 태그를 지원하지 않습니다.
                </video>
                <div class="controls">
                    <label>현재 시간:</label>
                    <div class="time-display" id="timeDisplay">00:00</div>
                </div>
            </div>

            <div class="analysis-panel">
                <h3>📊 실시간 분석</h3>

                <div class="metric">
                    <div class="metric-label">비디오 시간</div>
                    <div class="metric-value" id="duration">로딩 중...</div>
                </div>

                <div class="metric">
                    <div class="metric-label">재생 속도</div>
                    <div class="metric-value" id="playbackRate">1x</div>
                </div>

                <div class="metric">
                    <div class="metric-label">관찰 사항</div>
                    <div class="metric-value" id="observations-count">주의 깊게 시청하세요</div>
                </div>

                <h3 style="margin-top: 20px;">🔍 체크리스트</h3>
                <div style="font-size: 13px; line-height: 1.8;">
                    <label style="display: flex; gap: 10px; margin-bottom: 10px; cursor: pointer;">
                        <input type="checkbox"> 포즈 변화 감지
                    </label>
                    <label style="display: flex; gap: 10px; margin-bottom: 10px; cursor: pointer;">
                        <input type="checkbox"> 스크롤 속도 확인
                    </label>
                    <label style="display: flex; gap: 10px; margin-bottom: 10px; cursor: pointer;">
                        <input type="checkbox"> 이미지 크기 변화
                    </label>
                    <label style="display: flex; gap: 10px; margin-bottom: 10px; cursor: pointer;">
                        <input type="checkbox"> 전환 효과 부드러움
                    </label>
                    <label style="display: flex; gap: 10px; cursor: pointer;">
                        <input type="checkbox"> 고정 위치 확인
                    </label>
                </div>
            </div>
        </div>

        <div class="observations">
            <h2>📝 무엇을 관찰해야 하는가</h2>
            <div class="observation-item">
                <span class="timestamp">[전체]</span> 강아지가 페이지 중앙에 <strong>고정</strong>된 상태로 유지되는가?
            </div>
            <div class="observation-item">
                <span class="timestamp">[시작~중간]</span> 스크롤할 때 포즈가 <strong>부드럽게</strong> 변하는가? 아니면 끊기거나 변하지 않는가?
            </div>
            <div class="observation-item">
                <span class="timestamp">[중간~끝]</span> 모든 포즈(1번~16번)가 표시되는가? 몇 번까지 변하는가?
            </div>
            <div class="observation-item">
                <span class="timestamp">[전체]</span> 이미지 크기는 일정한가? 변하는가?
            </div>
            <div class="observation-item">
                <span class="timestamp">[전체]</span> 현재 구현과 비교해서 어떤 부분이 다른가?
            </div>
        </div>
    </div>

    <script>
        const video = document.getElementById('videoPlayer');
        const timeDisplay = document.getElementById('timeDisplay');
        const durationDisplay = document.getElementById('duration');

        // 비디오 메타데이터 로드 시
        video.addEventListener('loadedmetadata', () => {
            const minutes = Math.floor(video.duration / 60);
            const seconds = Math.floor(video.duration % 60);
            durationDisplay.textContent = `${minutes}:${seconds.toString().padStart(2, '0')}`;
        });

        // 재생 중 시간 업데이트
        video.addEventListener('timeupdate', () => {
            const minutes = Math.floor(video.currentTime / 60);
            const seconds = Math.floor(video.currentTime % 60);
            timeDisplay.textContent = `${minutes}:${seconds.toString().padStart(2, '0')}`;
        });

        // 비디오 팩트 분석 (포즈 변화 감지 가능하도록)
        video.addEventListener('play', () => {
            console.log('비디오 재생 시작 - 포즈 변화를 주의 깊게 관찰하세요');
        });
    </script>
</body>
</html>
